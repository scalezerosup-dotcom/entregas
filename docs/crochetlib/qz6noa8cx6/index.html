<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#FBF7F1">
<title>CrochetLib</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700;800&family=Nunito+Sans:wght@400;600;700;800&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FBF7F1;--paper:#FFFFFF;--ink:#2B2420;--ink-soft:#6B5E55;--accent:#C8643B;--accent-dark:#8E3F20;--line:#EDE3D8;
--r:18px;--nav:64px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);font-family:'Nunito Sans','Nunito Sans',system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 12px)}
h1,h2,h3,.serif{font-family:'Fraunces','Fraunces',Georgia,serif;line-height:1.15}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:inherit}
#app{max-width:560px;margin:0 auto;min-height:100vh}
.pad{padding:0 18px}
.top{display:flex;align-items:center;gap:10px;padding:16px 18px 6px}
.brand{font-family:'Fraunces',serif;font-weight:800;font-size:20px;letter-spacing:-.01em}
.brand b{color:var(--accent)}
.hello{padding:14px 18px 4px}
.hello .script{font-family:'Caveat',cursive;font-size:30px;color:var(--accent-dark);line-height:1}
.hello h1{font-size:32px;font-weight:800;margin-top:2px}
.search{margin:16px 18px 0;display:flex;align-items:center;gap:10px;background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:0 14px;height:52px}
.search:focus-within{border-color:var(--accent)}
.search input{flex:1;border:0;outline:0;background:transparent;font:inherit;font-size:16px;color:var(--ink);height:100%;min-width:0}
.search svg{flex:none;color:var(--ink-soft)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 18px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:99px;background:var(--paper);border:1.5px solid var(--line);font-weight:700;font-size:14px;color:var(--ink)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.sec{display:flex;align-items:baseline;justify-content:space-between;padding:26px 18px 10px}
.sec h2{font-size:22px}
.sec small{color:var(--ink-soft);font-weight:700}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 18px}
.tile{position:relative;text-align:left;border-radius:var(--r);padding:16px 14px;min-height:96px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.tile .em{font-size:26px;line-height:1}
.tile .nm{font-weight:800;font-size:16px;line-height:1.15}
.tile .ct{font-size:12px;opacity:.85;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:6px 18px 0}
.card{background:var(--paper);border-radius:var(--r);overflow:hidden;border:1px solid var(--line);text-align:left;position:relative;display:flex;flex-direction:column}
.card .ph{aspect-ratio:1/1;background:var(--line);overflow:hidden}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card .tx{padding:10px 12px 12px}
.card .tt{font-weight:800;font-size:15px;line-height:1.2}
.card .mt{font-size:12px;color:var(--ink-soft);margin-top:4px;font-weight:600}
.heart{position:absolute;top:8px;right:8px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.heart svg{width:19px;height:19px;stroke:var(--accent-dark);fill:none;stroke-width:2.2}
.heart.on svg{fill:var(--accent);stroke:var(--accent)}
.head{color:#fff;padding:16px 18px 20px;border-radius:0 0 26px 26px}
.head .back{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:14px;opacity:.95;margin-bottom:8px}
.head h1{font-size:28px;font-weight:800}
.head p{opacity:.9;font-size:14px;margin-top:2px;font-weight:600}
.empty{padding:40px 24px;text-align:center;color:var(--ink-soft)}
.empty b{display:block;font-size:18px;color:var(--ink);margin-bottom:4px}
.badge{position:absolute;top:8px;left:8px;background:rgba(255,255,255,.94);border-radius:99px;padding:3px 9px 3px 8px;font-size:11px;font-weight:800;display:flex;align-items:center;gap:5px;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.badge i{width:7px;height:7px;border-radius:50%;display:block}
.lv-Beginner i{background:#3E9B5C}.lv-Intermediate i{background:#E0A020}.lv-Advanced i{background:#C4432B}
.tag{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:11px;font-weight:800;color:var(--accent-dark);margin-left:4px}
.sub{padding:0 18px;color:var(--ink-soft);font-weight:600;font-size:14px;margin-top:-2px}
.tile .ic{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:21px}
/* recipe */
.hero{position:relative;aspect-ratio:1/1;background:var(--line)}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero .x,.hero .heart{top:12px}
.hero .x{position:absolute;left:12px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.hero .heart{right:12px;width:40px;height:40px}
.body{padding:18px}
.pill{display:inline-block;color:#fff;font-weight:800;font-size:12px;border-radius:99px;padding:4px 12px;letter-spacing:.02em}
.body h1{font-size:30px;font-weight:800;margin:10px 0 12px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fact{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center}
.fact small{display:block;color:var(--ink-soft);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.fact b{display:block;font-size:14px;margin-top:2px;line-height:1.2}
.line2{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:14px;color:var(--ink-soft);font-weight:600}
.line2 span{background:var(--paper);border:1px solid var(--line);border-radius:99px;padding:5px 12px}
.blk{margin-top:22px}
.blk h2{font-size:20px;margin-bottom:10px}
.mats li,.fin li,.tips li{margin-left:20px;margin-bottom:6px}
.part{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.part h3{font-size:18px;margin-bottom:2px}
.part .note{color:var(--ink-soft);font-size:13.5px;margin-bottom:8px}
.ln{display:grid;grid-template-columns:70px 1fr auto;gap:8px;padding:8px 0;border-top:1px dashed var(--line);font-size:15px}
.ln:first-of-type{border-top:0}
.ln .l{font-weight:800;color:var(--accent-dark)}
.ln .c{font-weight:800;color:var(--ink-soft);white-space:nowrap}
.ln.done{opacity:.45}
.ln.done .t{text-decoration:line-through}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:14px;background:var(--accent);color:#fff;font-weight:800;font-size:17px;text-decoration:none;box-shadow:0 4px 0 var(--accent-dark);margin-top:22px}
details{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:14px}
summary{font-weight:800;cursor:pointer}
details dl{margin-top:8px;font-size:14px}
details dt{font-weight:800;float:left;clear:left;width:56px}
details dd{margin-left:64px;margin-bottom:4px}
.note-honest{font-size:13px;color:var(--ink-soft);margin-top:18px}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--paper);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav div{max-width:560px;margin:0 auto;height:var(--nav);display:grid;grid-template-columns:repeat(3,1fr)}
nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:800;color:var(--ink-soft)}
nav button.on{color:var(--accent-dark)}
nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hide{display:none!important}
</style>
</head>
<body>
<div id="app"></div>
<nav><div>
  <button data-go="#/" id="n-home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
  <button data-go="#/search" id="n-search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>Search</button>
  <button data-go="#/saved" id="n-saved"><svg viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z"/></svg>Saved</button>
</div></nav>
<script src="recipes.js"></script>
<script>
(function(){
"use strict";
var D = window.CL || {categories:[], recipes:[]};
var CAT = {}; D.categories.forEach(function(c){CAT[c.id]=c;});
var $app = document.getElementById("app");
var saved = [];
try { saved = JSON.parse(localStorage.getItem("cl_saved")||"[]"); } catch(e){}
var done = {};
try { done = JSON.parse(localStorage.getItem("cl_done")||"{}"); } catch(e){}
function persist(){ try{ localStorage.setItem("cl_saved", JSON.stringify(saved)); localStorage.setItem("cl_done", JSON.stringify(done)); }catch(e){} }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function norm(s){ return String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,""); }
function byId(id){ return D.recipes.filter(function(r){return r.slug===id;})[0]; }
var HEART = '<svg viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z"/></svg>';
function heart(slug){ return '<span class="heart'+(saved.indexOf(slug)>-1?' on':'')+'" data-heart="'+slug+'" role="button" aria-label="Save">'+HEART+'</span>'; }
function card(r){
  return '<div class="card"><a href="#/r/'+r.slug+'" style="display:block;text-decoration:none"><div class="ph"><img loading="lazy" src="'+r.img+'" alt="'+esc(r.title)+'"><span class="badge lv-'+r.level+'"><i></i>'+esc(r.level)+'</span></div>'+
   '<div class="tx"><div class="tt">'+esc(r.title)+'</div><div class="mt">'+esc(r.hook.split(" ")[0])+' mm · '+esc(r.time)+'<span class="tag">US</span></div></div></a>'+heart(r.slug)+'</div>';
}
function head(active){
  ["home","search","saved"].forEach(function(k){ document.getElementById("n-"+k).classList.toggle("on", k===active); });
}
function count(cat){ return D.recipes.filter(function(r){return r.cat===cat;}).length; }
function levelChips(cur, base){
  return '<div class="chips">'+["All","Beginner","Intermediate","Advanced"].map(function(l){
    return '<button class="chip'+(cur===l?' on':'')+'" data-lv="'+l+'">'+l+'</button>'; }).join("")+'</div>';
}
function home(){
  head("home");
  $app.innerHTML = '<div class="top"><span class="brand">Crochet<b>Lib</b></span></div><div class="sub">Your patterns, right when you need them</div>'+
   '<div class="hello"><div class="script">Hi there,</div><h1>What will you hook today?</h1></div>'+
   '<a class="search" href="#/search" style="text-decoration:none;color:var(--ink-soft)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><span>Search: bag, fox, baby hat...</span></a>'+
   '<div class="sec" style="padding-bottom:0;padding-top:18px"><h2 style="font-size:17px">Start here</h2></div>'+
   '<div class="chips" style="padding-top:8px"><a class="chip" href="#/browse/beginner" style="text-decoration:none">Start simple</a><a class="chip" href="#/browse/quick" style="text-decoration:none">Quick makes</a></div>'+
   '<div class="sec"><h2>Your shelf</h2><small>'+D.recipes.length+(D.recipes.length===1?' pattern':' patterns')+'</small></div>'+
   '<div class="tiles">'+D.categories.map(function(c){
     return '<a class="tile" href="#/c/'+c.id+'" style="background:'+c.color+';text-decoration:none"><span class="ic">'+c.emoji+'</span><span><span class="nm">'+esc(c.name)+'</span><br><span class="ct">'+count(c.id)+(count(c.id)===1?' pattern':' patterns')+'</span></span></a>'; }).join("")+'</div>';
}
function category(id, lv){
  var c = CAT[id]; if(!c){ return home(); }
  head("home");
  var list = D.recipes.filter(function(r){return r.cat===id && (!lv||lv==="All"||r.level===lv);});
  $app.innerHTML = '<div class="head" style="background:'+c.color+'"><a class="back" href="#/" style="text-decoration:none">‹ Shelf</a><h1>'+c.emoji+' '+esc(c.name)+'</h1><p>Tap a pattern to open it</p></div>'+
    levelChips(lv||"All")+
    (list.length? '<div class="grid" style="padding-top:12px">'+list.map(card).join("")+'</div>' : '<div class="empty"><b>Nothing here yet</b>Try another level.</div>');
  $app.querySelectorAll("[data-lv]").forEach(function(b){ b.onclick=function(){ category(id, b.dataset.lv); }; });
}
function browse(kind){
  head("home");
  var list = kind==="beginner" ? D.recipes.filter(function(r){return r.level==="Beginner";}) :
     D.recipes.filter(function(r){ return r.hmax<=3; });
  var t = kind==="beginner" ? "Start simple" : "Quick makes";
  var s = kind==="beginner" ? "Beginner-friendly patterns" : "Finished in about 3 hours or less";
  $app.innerHTML = '<div class="head" style="background:var(--ink)"><a class="back" href="#/" style="text-decoration:none">‹ Home</a><h1>'+t+'</h1><p>'+s+'</p></div>'+
    (list.length? '<div class="grid" style="padding-top:16px">'+list.map(card).join("")+'</div>' : '<div class="empty"><b>Nothing here yet</b></div>');
}
function score(r, toks){
  var title = norm(r.title), kw = norm(r.keywords.join(" ")), cat = norm(CAT[r.cat]?CAT[r.cat].name:"");
  var total = 0;
  for(var i=0;i<toks.length;i++){
    var t = toks[i], s = 0;
    if(title.indexOf(t)===0) s = 9; else if(title.indexOf(" "+t)>-1) s = 7; else if(title.indexOf(t)>-1) s = 5;
    else if(kw.indexOf(t)>-1) s = 3; else if(cat.indexOf(t)>-1) s = 2; else if(norm(r.level).indexOf(t)===0) s = 1;
    if(!s) return 0; total += s;
  }
  return total;
}
function search(q){
  head("search");
  $app.innerHTML = '<div class="top"><span class="brand">Search</span></div>'+
   '<label class="search"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><input id="q" type="search" placeholder="bag, fox, baby hat..." autocomplete="off" value="'+esc(q||"")+'"></label><div id="res"></div>';
  var inp = document.getElementById("q"), res = document.getElementById("res");
  function run(){
    var v = inp.value.trim();
    if(!v){ res.innerHTML = '<div class="chips">'+["bag","fox","sunflower","tote","baby","gift"].map(function(w){return '<button class="chip" data-w="'+w+'">'+w+'</button>';}).join("")+'</div><div class="empty">Type what you want to make.<br>The pattern shows up as you type.</div>'; bind(); return; }
    var toks = norm(v).split(/\s+/).filter(Boolean);
    var out = D.recipes.map(function(r){return {r:r,s:score(r,toks)};}).filter(function(x){return x.s>0;}).sort(function(a,b){return b.s-a.s;}).map(function(x){return x.r;});
    res.innerHTML = out.length ? '<div class="grid" style="padding-top:14px">'+out.map(card).join("")+'</div>' : '<div class="empty"><b>No patterns for "'+esc(v)+'"</b>Try a simpler word, like bag or toy.</div>';
    bindHearts();
  }
  function bind(){ res.querySelectorAll("[data-w]").forEach(function(b){ b.onclick=function(){ inp.value=b.dataset.w; run(); }; }); }
  inp.addEventListener("input", run); run();
  if(!q) setTimeout(function(){ try{inp.focus();}catch(e){} }, 50);
}
function savedView(){
  head("saved");
  var list = saved.map(byId).filter(Boolean);
  $app.innerHTML = '<div class="top"><span class="brand">Saved</span></div>'+
    (list.length? '<div class="grid" style="padding-top:12px">'+list.map(card).join("")+'</div>' :
     '<div class="empty"><b>No saved patterns yet</b>Tap the heart on any pattern to keep it here.</div>');
}
function recipe(slug){
  var r = byId(slug); if(!r){ return home(); }
  head("home");
  var c = CAT[r.cat] || {name:"",color:"#888"};
  var parts = r.parts.map(function(p,pi){
    return '<div class="part"><h3>'+esc(p.name)+'</h3>'+(p.note?'<div class="note">'+esc(p.note)+'</div>':'')+
      p.lines.map(function(l,li){ var key=r.slug+"|"+pi+"|"+li; var d = done[key];
        return '<div class="ln'+(d?' done':'')+'" data-k="'+key+'"><span class="l">'+esc(l.l)+'</span><span class="t">'+esc(l.t)+'</span><span class="c">'+(l.c?'('+l.c+')':'')+'</span></div>'; }).join("")+'</div>';
  }).join("");
  $app.innerHTML = '<div class="hero"><img src="'+r.img+'" alt="'+esc(r.title)+'"><a class="x" href="#/c/'+r.cat+'" aria-label="Close" style="text-decoration:none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2B2420" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></a>'+heart(r.slug)+'</div>'+
   '<div class="body"><span class="pill" style="background:'+c.color+'">'+esc(c.name)+'</span><h1>'+esc(r.title)+'</h1>'+
   '<div class="facts"><div class="fact"><small>Hook</small><b>'+esc(r.hook)+'</b></div><div class="fact"><small>Yarn</small><b>'+esc(r.yarn.split(")")[0]+")")+'</b></div><div class="fact"><small>Level</small><b>'+esc(r.level)+'</b></div></div>'+
   '<div class="line2"><span>Time: '+esc(r.time)+'</span><span>'+esc(r.size)+'</span></div>'+
   '<p style="margin-top:14px">Full pattern with photo and step by step. Open it on your phone and start right away.</p>'+
   '<div class="blk"><h2>Materials</h2><ul class="mats">'+r.materials.map(function(m){return '<li>'+esc(m)+'</li>';}).join("")+'</ul></div>'+
   '<details><summary>Stitch guide (US terms)</summary><dl>'+r.abbr.map(function(a){return '<dt>'+esc(a[0])+'</dt><dd>'+esc(a[1])+'</dd>';}).join("")+'</dl></details>'+
   '<div class="blk"><h2>Pattern</h2><div class="note" style="color:var(--ink-soft);font-size:13.5px;margin:-4px 0 10px">Tap a line to cross it off. The number in parentheses is your stitch count for that round.</div>'+parts+'</div>'+
   '<div class="blk"><h2>Finishing</h2><ol class="fin">'+r.finishing.map(function(m){return '<li>'+esc(m)+'</li>';}).join("")+'</ol></div>'+
   '<div class="blk"><h2>Tips</h2><ul class="tips">'+r.tips.map(function(m){return '<li>'+esc(m)+'</li>';}).join("")+'</ul></div>'+
   '<a class="btn" href="'+r.pdf+'" download>Download PDF</a>'+
   '<p class="note-honest">Sizes are approximate and depend on your yarn and tension. The photo is an illustration of the finished piece.</p></div>';
  $app.querySelectorAll(".ln").forEach(function(el){ el.onclick=function(){ var k=el.dataset.k; if(done[k]) delete done[k]; else done[k]=1; el.classList.toggle("done", !!done[k]); persist(); }; });
  window.scrollTo(0,0);
}
function bindHearts(){
  document.querySelectorAll("[data-heart]").forEach(function(h){
    h.onclick=function(e){ e.preventDefault(); e.stopPropagation();
      var s=h.dataset.heart, i=saved.indexOf(s); if(i>-1) saved.splice(i,1); else saved.push(s); persist();
      document.querySelectorAll('[data-heart="'+s+'"]').forEach(function(x){ x.classList.toggle("on", saved.indexOf(s)>-1); });
      if(/^#\/saved/.test(location.hash)) savedView(), bindHearts();
    };
  });
}
function route(){
  var h = location.hash || "#/", m;
  if(m = h.match(/^#\/c\/([\w-]+)/)) category(m[1]);
  else if(m = h.match(/^#\/r\/([\w-]+)/)) recipe(m[1]);
  else if(m = h.match(/^#\/browse\/(\w+)/)) browse(m[1]);
  else if(h.indexOf("#/search")===0) search("");
  else if(h.indexOf("#/saved")===0) savedView();
  else home();
  bindHearts();
  if(!/^#\/search/.test(h)) window.scrollTo(0,0);
}
document.querySelectorAll("nav [data-go]").forEach(function(b){ b.onclick=function(){ location.hash=b.dataset.go; }; });
window.addEventListener("hashchange", route);
route();
})();
</script>
</body>
</html>
