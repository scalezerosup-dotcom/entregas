<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Certificate of Participation · Floral Cupcakes Premium</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700;800&family=Jost:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffffff;--paper:#fff6f9;--ink:#000000;--ink-soft:#c0817e;--accent:#eb001b;--accent-dark:#0071ce;--line:#f3f3f3}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:'Jost',-apple-system,Arial,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
.top{background:var(--accent-dark);color:var(--paper);text-align:center;padding:11px 16px;font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;font-size:15px}
.wrap{max-width:960px;margin:0 auto;padding:28px 16px 56px}
.head{text-align:center;margin-bottom:22px}
.kicker{display:inline-block;background:var(--accent);color:var(--paper);padding:6px 14px;border-radius:99px;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-bottom:12px}
h1{font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(26px,5vw,40px);line-height:1.15;margin-bottom:10px}
.sub{color:var(--ink-soft);font-size:17px;max-width:640px;margin:0 auto 20px}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 22px;border-radius:12px;font-weight:800;font-size:16px;text-decoration:none;border:2px solid transparent}
.btn.primary{background:var(--accent);color:var(--paper);box-shadow:0 4px 0 var(--accent-dark)}
.btn.ghost{color:var(--accent-dark);border-color:var(--line);background:var(--paper)}
.viewer{margin-top:22px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#000}
.viewer iframe{display:block;width:100%;height:75vh;min-height:520px;border:0}
.meta{margin-top:14px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 18px;display:flex;gap:18px;flex-wrap:wrap;color:var(--ink-soft);font-size:14px}
.meta b{color:var(--ink)}
.foot{text-align:center;color:var(--ink-soft);font-size:13px;margin-top:28px}
@media (max-width:600px){.btn{width:100%}.viewer iframe{height:70vh}}
</style>
</head>
<body>
<div class="top">Floral Cupcakes Premium</div>
<main class="wrap">
  <div class="head">
    <span class="kicker">Bonus 4</span>
    <h1>Certificate of Participation</h1>
    <p class="sub">Printable certificate (not an accredited certification).</p>
    <div class="actions">
      <a class="btn primary" href="certificate-of-participation.pdf" download>Download the PDF</a>
      <a class="btn ghost" href="certificate-of-participation.pdf" target="_blank" rel="noopener">Open in a new tab</a>
    </div>
  </div>
  <div class="viewer">
    <iframe src="certificate-of-participation.pdf#view=FitH" title="Certificate of Participation"></iframe>
  </div>
  <div class="meta">
    <div><b>2</b> pages</div>
    <div>Lifetime access</div>
  </div>
  <p class="foot">For personal use only. Not for resale or redistribution.</p>
</main>
</body>
</html>
