<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Χρυσή Συνταγή: Χωνάκια Γκουρμέ για Δώρο · Gourmet Popcorn</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600;700;800&family=Nunito+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff6e6;--paper:#fff5f8;--ink:#020817;--ink-soft:#6b7280;--accent:#8b2d5c;--accent-dark:#6b1d45;--line:#fbcfe8}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:'Nunito Sans',-apple-system,Arial,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
.top{background:var(--accent-dark);color:var(--paper);text-align:center;padding:11px 16px;font-family:'Fraunces',Georgia,serif;font-weight:700;font-size:15px}
.wrap{max-width:960px;margin:0 auto;padding:28px 16px 56px}
.head{text-align:center;margin-bottom:22px}
.kicker{display:inline-block;background:var(--accent);color:var(--paper);padding:6px 14px;border-radius:99px;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-bottom:12px}
h1{font-family:'Fraunces',Georgia,serif;font-size:clamp(26px,5vw,40px);line-height:1.15;margin-bottom:10px}
.sub{color:var(--ink-soft);font-size:17px;max-width:640px;margin:0 auto 20px}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 22px;border-radius:12px;font-weight:800;font-size:16px;text-decoration:none;border:2px solid transparent}
.btn.primary{background:var(--accent);color:var(--paper);box-shadow:0 4px 0 var(--accent-dark)}
.btn.ghost{color:var(--accent-dark);border-color:var(--line);background:var(--paper)}
.viewer{margin-top:22px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#000}
.viewer iframe{display:block;width:100%;height:75vh;min-height:520px;border:0}
.meta{margin-top:14px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 18px;display:flex;gap:18px;flex-wrap:wrap;color:var(--ink-soft);font-size:14px}
.meta b{color:var(--ink)}
.foot{text-align:center;color:var(--ink-soft);font-size:13px;margin-top:28px}
@media (max-width:600px){.btn{width:100%}.viewer iframe{height:70vh}}
</style>
</head>
<body>
<div class="top">Gourmet Popcorn</div>
<main class="wrap">
  <div class="head">
    <span class="kicker">Bono 6 de 7</span>
    <h1>Χρυσή Συνταγή: Χωνάκια Γκουρμέ για Δώρο</h1>
    <p class="sub">Πώς να φτιάξεις χωνάκια γκουρμέ ποπ κορν ιδανικά για δώρο.</p>
    <div class="actions">
      <a class="btn primary" href="xonakia.pdf" download>Descargar el PDF</a>
      <a class="btn ghost" href="xonakia.pdf" target="_blank" rel="noopener">Abrir en otra pestaña</a>
    </div>
  </div>
  <div class="viewer">
    <iframe src="xonakia.pdf#view=FitH" title="Χρυσή Συνταγή: Χωνάκια Γκουρμέ για Δώρο"></iframe>
  </div>
  <div class="meta">
    <div><b>9</b> páginas</div>
    <div>Acceso de por vida</div>
  </div>
  <p class="foot">Para uso personal. Prohibida la reventa o redistribución.</p>
</main>
</body>
</html>
