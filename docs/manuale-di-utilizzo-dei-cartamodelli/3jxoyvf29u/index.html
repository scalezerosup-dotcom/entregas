<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Manuale di Utilizzo dei Cartamodelli · Cartamodelli di Cucito</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf3eb;--paper:#fffaf5;--ink:#382b2a;--ink-soft:#6d5956;--accent:#d88b9a;--accent-dark:#a95f70;--line:#eadccf}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:'Inter',-apple-system,Arial,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
.top{background:var(--accent-dark);color:var(--paper);text-align:center;padding:11px 16px;font-family:'Poppins',Georgia,serif;font-weight:700;font-size:15px}
.wrap{max-width:960px;margin:0 auto;padding:28px 16px 56px}
.head{text-align:center;margin-bottom:22px}
.kicker{display:inline-block;background:var(--accent);color:var(--paper);padding:6px 14px;border-radius:99px;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-bottom:12px}
h1{font-family:'Poppins',Georgia,serif;font-size:clamp(26px,5vw,40px);line-height:1.15;margin-bottom:10px}
.sub{color:var(--ink-soft);font-size:17px;max-width:640px;margin:0 auto 20px}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 22px;border-radius:12px;font-weight:800;font-size:16px;text-decoration:none;border:2px solid transparent}
.btn.primary{background:var(--accent);color:var(--paper);box-shadow:0 4px 0 var(--accent-dark)}
.btn.ghost{color:var(--accent-dark);border-color:var(--line);background:var(--paper)}
.viewer{margin-top:22px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#000}
.viewer iframe{display:block;width:100%;height:75vh;min-height:520px;border:0}
.meta{margin-top:14px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 18px;display:flex;gap:18px;flex-wrap:wrap;color:var(--ink-soft);font-size:14px}
.meta b{color:var(--ink)}
.foot{text-align:center;color:var(--ink-soft);font-size:13px;margin-top:28px}
@media (max-width:600px){.btn{width:100%}.viewer iframe{height:70vh}}
</style>
</head>
<body>
<div class="top">Cartamodelli di Cucito</div>
<main class="wrap">
  <div class="head">
    <span class="kicker">Bonus 1 di 5</span>
    <h1>Manuale di Utilizzo dei Cartamodelli</h1>
    <p class="sub">Come stampare, assemblare e tagliare i cartamodelli PDF con precisione fin dal primo capo.</p>
    <div class="actions">
      <a class="btn primary" href="manuale-di-utilizzo-dei-cartamodelli.pdf" download>Scarica il PDF</a>
      <a class="btn ghost" href="manuale-di-utilizzo-dei-cartamodelli.pdf" target="_blank" rel="noopener">Apri in un'altra scheda</a>
    </div>
  </div>
  <div class="viewer">
    <iframe src="manuale-di-utilizzo-dei-cartamodelli.pdf#view=FitH" title="Manuale di Utilizzo dei Cartamodelli"></iframe>
  </div>
  <div class="meta">
    <div><b>14</b> pagine</div>
    <div>Accesso a vita</div>
  </div>
  <p class="foot">Solo per uso personale. Vietata la rivendita o redistribuzione.</p>
</main>
</body>
</html>
