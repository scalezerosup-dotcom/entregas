*{box-sizing:border-box;margin:0}html,body{height:100%}body{background:#14100a;color:#f1e6cb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden}

.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;max-width:100%}.chip{flex:0 0 auto;border:1px solid #5a4d33;border-radius:99px;padding:5px 11px;font-size:12px;color:#d9ccaa;background:#1f1a12;cursor:pointer}.chip.on{background:#b8893a;color:#14100a;border-color:#b8893a;font-weight:700}

#stage{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}#stage img.base{display:block;user-select:none;-webkit-user-drag:none}
.pin{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:var(--c);border:2px solid #fff;box-shadow:0 1px 6px #000a;cursor:pointer;padding:0;transform:scale(var(--s,1))}

.lbl{position:absolute;transform:translate(10px,-50%) scale(var(--s,1));transform-origin:0 50%;font:600 12px Georgia,serif;color:#2b2112;text-shadow:0 0 3px #efe2bf,0 0 3px #efe2bf,0 0 3px #efe2bf;white-space:nowrap;pointer-events:none}

#panel .in{padding:16px 18px 30px}#panel img{width:100%;border-radius:8px;margin-bottom:12px;display:block}#panel h2{font:700 21px Georgia,serif;color:#f1e6cb;line-height:1.15}.k{font:600 11px ui-monospace,Menlo,monospace;letter-spacing:.18em;text-transform:uppercase;color:#b8893a;margin-bottom:6px}.sub{font-style:italic;color:#c8bca0;margin:6px 0 12px}#panel p{font-size:14.5px;line-height:1.55;color:#e8dcc0;margin-bottom:10px}.box{background:#14100a;border-top:3px solid #b8893a;border-radius:6px;padding:11px 13px;margin:12px 0}.box b{display:block;font:700 10px ui-monospace,Menlo,monospace;letter-spacing:.2em;text-transform:uppercase;color:#d1a24f;margin-bottom:5px}.box p{margin:0;font-size:13.5px}

.zoom{position:fixed;left:12px;bottom:14px;z-index:15;display:flex;flex-direction:column;gap:6px}.zoom button{width:40px;height:40px;border-radius:10px;border:1px solid #5a4d33;background:#1f1a12ee;color:#f1e6cb;font-size:22px;cursor:pointer}
.hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);background:#14100acc;border:1px solid #3a3022;border-radius:99px;padding:6px 14px;font-size:12px;color:#c8bca0;z-index:12;pointer-events:none}

<script>
const DATA=[{"id": "c1m5", "c": 1, "ct": "Beginnings", "n": "Mountains of Ararat", "lat": 39.7, "lon": 44.3, "ref": "Gen 8:4", "sub": "The highland where, according to tradition, the ark came to rest as the waters receded.", "s": "The Book of Genesis says the ark came to rest on the mountains of Ararat, that is, in the ancient land of Urartu. Tradition associates them with the massif above today's border between Turkey and Armenia.", "k": ["As the floodwaters recede, the ark comes to rest on the mountains of Ararat. Noah waits, sends out a raven, and then a dove, which returns with an olive leaf. After waiting once more, the family leaves the ark and builds an altar. The text points not to a single peak but to a mountainous region. The Hebrew name Ararat corresponds to the Assyrian Urartu, a kingdom around Lake Van. Later, tradition attached the name to the tall, twin-peaked volcano Ararat, which today rises over eastern Turkey and can also be seen from Armenia. Today the area is almost barren on the slopes and lush only in the valleys, which makes it easy to imagine that once the waters subsided, people had to seek fertile land lower down.", "Geographically this is the Armenian Highland, one of the highest regions of Western Asia. Both the Euphrates and the Tigris rise here, so the waters flow from this place down into Mesopotamia. In the flood story this carries symbolic meaning: a new world begins at the sources of the rivers, at a height from which the lowland can be seen. The road from Ararat to the plains of Shinar is about 800 km in a straight line. The location of the peak with the ark remains a matter of faith and tradition, not the result of scientific discoveries. For the reader it is a good example of how tradition and geography weave together into one story, without having to settle every detail."], "j": "Artistic reconstruction: the place can be imagined as a rugged volcanic massif: snow on the summits, stony slopes, and cool, thin air. Below, valleys with fields and pastures stretch out. This is today's landscape, which lets us sense how distant and high this land must have seemed to the people of the Mesopotamian lowlands.", "d": "The Ararat massif rises to about 5,137 m above sea level; traditional location.", "img": null}, {"id": "c1m6", "c": 1, "ct": "Beginnings", "n": "The Nile and the Land of Mizraim", "lat": 29.85, "lon": 31.25, "ref": "Gen 10:6–14", "sub": "Egypt in the Table of Nations: the land of a great river and one of the world's first states.", "s": "In the Table of Nations, Egypt appears under the Hebrew name Mizraim, as a descendant of Ham. The Nile was the axis of life in this land, and the area around Memphis symbolizes the beginning of the state of the pharaohs.", "k": ["Chapter 10 of Genesis is the Table of Nations: a list of the peoples who spread out after the flood. The author arranges them by the families of Shem, Ham, and Japheth, not according to today's ethnography but according to the political and cultural ties of his age. Among the descendants of Ham is Mizraim, that is, Egypt, along with peoples tied to the Mediterranean coast. The text shows that Israel lived among neighbors it knew from trade, wars, and travel, and regarded them as part of one human family. This map shows that Egypt and Mesopotamia were the two poles of the ancient world, linked by routes through Canaan, where the patriarchs would later arrive.", "For Egypt, the most important thing was the Nile, which flows from south to north through the desert and feeds a fertile valley only a dozen or so kilometers wide. The yearly flood deposited silt and made harvests possible, so Egypt was the breadbasket of the region. The area around Memphis, where the valley meets the delta, was the place where the country was unified around 3000 BC. The distance from Memphis to the Mediterranean is about 160 km, and from Memphis to Jerusalem the overland road is about 450 km, which explains the frequent contact between the two lands. That is why the Bible often describes Egypt as a place of refuge from famine and, at the same time, a place of testing for Israel."], "j": "Artistic reconstruction: one can imagine a broad river within a narrow strip of green. On both sides rise the yellowish cliffs of the desert, and along the bank stand fields, palm trees, and low mud-brick houses. Wooden boats with sails glide on the water. The contrast between green and sand helps us understand why the Nile was a gift to the Egyptians.", "d": "The Nile is about 6,650 km long, and the valley in Egypt is often only about 10–20 km wide.", "img": null}, {"id": "c1m7", "c": 1, "ct": "Beginnings", "n": "Nineveh", "lat": 36.36, "lon": 43.15, "ref": "Gen 10:11–12", "sub": "A city on the upper Tigris, later the capital of Assyria.", "s": "The Table of Nations lists Nineveh among the cities founded in the land of Asshur. Its ruins lie near present-day Mosul in Iraq.", "k": ["The Book of Genesis mentions Nineveh in connection with Nimrod, the legendary hunter and ruler, who is said to have gone from the land of Shinar to Asshur and built cities there. Among them Nineveh is named. Later in the Bible the city returns: the prophet Jonah will be sent to call its inhabitants to repentance, and Nahum will foretell its fall. The text in Genesis is thus a brief mention, but it marks a geographical direction: from the southern plains toward northern Assyria. Through the Book of Jonah, Nineveh also became a symbol of a city called to repentance, which gives this mention in Genesis added weight.", "Nineveh lay on the eastern bank of the Tigris, at the place where the river leaves the hill country and flows onto a flatter plain. This position gave access to water, fertile land, and routes leading to Anatolia and Syria. Under Sennacherib, around 700 BC, the city became the capital of the empire, surrounded by walls many kilometers long. The library of Ashurbanipal, with thousands of clay tablets, was discovered there. The location of Nineveh is certain and confirmed by excavations at the mounds of Kuyunjik and Nebi Yunus. Today part of the ruins lies next to a large city, which makes the archaeologists' work difficult, yet it still brings new discoveries."], "j": "The artistic reconstruction shows a mighty city with brick walls, great gates, and palaces on a hill. Before the gate merchants bustle about with donkeys and carts. In the background the broad Tigris flows, and gardens give shade around the palaces. The whole is an imagining based on archaeological discoveries and Assyrian reliefs, not an exact picture of a single moment.", "d": "According to research, the walls of Nineveh were about 12 km in circumference; the city lies about 400 km from Babylon.", "img": null}, {"id": "c1m8", "c": 1, "ct": "Beginnings", "n": "Uruk (Erech)", "lat": 31.32, "lon": 45.64, "ref": "Gen 10:10", "sub": "One of the world's first great cities, the cradle of writing.", "s": "Uruk, Erech in the Bible, is named among the beginnings of Nimrod's kingdom. Archaeology shows it to be one of the oldest cities and the birthplace of writing.", "k": ["The Book of Genesis says that the beginning of Nimrod's kingdom was Babel, Erech, Akkad, and Calneh in the land of Shinar. Erech is Uruk, a city with an extraordinary role in human history. Here, around 3300 BC, the first signs of writing appeared, at first serving economic records. Among the legendary rulers of Uruk is Gilgamesh, the hero of the famous epic. The biblical author mentions the cities of Shinar to show that people very early on began to build states and conduct politics. Thanks to this information, Uruk is for us proof that the urban civilization of the Bible is not a fairy tale but the real backdrop of the story of the beginnings of states and power.", "Uruk lay on the old course of the Euphrates, in southern Mesopotamia, a low, fertile land but lacking stone and timber. The inhabitants built with clay brick and relied on a system of irrigation canals. The city may have had tens of thousands of inhabitants, and its walls, according to Sumerian tradition, were about 9 km long. Today the ruins, called Warka, lie in the desert because the Euphrates changed its course, which shows how much the life of cities depended on water. The Epic of Gilgamesh, tied to this city, shows at the same time how ancient people searched for answers to questions about death and the meaning of life."], "j": "The artistic reconstruction shows a densely built city of mud brick, with a high temple terrace above the rooftops. The streets are narrow, and green strips of gardens can be seen around the canals. In the distance reed boats float, and farmers lead donkeys with baskets of grain. The colors of earth and the blue of the canals give the impression of a warm, dry climate.", "d": "According to research, Uruk covered about 5 km² and had about 40,000 inhabitants at its height, around 3000 BC.", "img": null}, {"id": "c1m9", "c": 1, "ct": "Beginnings", "n": "Eridu", "lat": 30.82, "lon": 45.99, "ref": "Gen 10:10; 11:2", "sub": "One of the oldest cities of Sumer, on the former lagoon of the Persian Gulf.", "s": "According to Sumerian tradition, Eridu is the oldest city in the world. It lay in the land of Shinar, which the Book of Genesis mentions in the story of the settlers on the plain.", "k": ["When the Book of Genesis describes the descendants of Noah, it says that people traveling from the east found a plain in the land of Shinar and settled there. Shinar is the biblical term for southern Mesopotamia, that is, Sumer and Akkad. One of the first centers there was Eridu, today the ruins of Abu Shahrain. The Sumerians regarded it as the city where settled life was first begun and the temple of the god Enki was built. The biblical text does not mention it by name, but it describes the environment in which such cities arose. This shift of the coastline shows that the landscape described in the Bible was dynamic, and that rivers could create and transform whole lands within a few millennia.", "Eridu then lay close to the shoreline of the Persian Gulf, among the marshes and lagoons that filled the mouth of the Euphrates. Today the shoreline is about 200 km farther south, because the rivers have deposited enormous amounts of silt. The surroundings were fertile but lacked stone and timber, so the inhabitants traded with the mountains to the north and east. Archaeologists have discovered here layers of a temple built successively over many centuries, beginning around 5000 BC. It is not certain whether the biblical author knew Eridu by name, but he undoubtedly knew the whole cultural sphere to which it belonged."], "j": "The artistic reconstruction shows a small town at the edge of the marshes: houses of reed and brick, a small temple on a raised platform, and narrow boats gliding among the reed beds. In the morning mist hangs over the water, and nets dry on the shore. The picture is an imagining based on discoveries at Abu Shahrain and on the landscape of the marshes of southern Iraq.", "d": "The temple layers at Eridu reach back to about 5000 BC, and the present ruins lie about 200 km from the sea.", "img": null}, {"id": "c1m10", "c": 1, "ct": "Beginnings", "n": "The Tower of Babel in Babylon", "lat": 32.54, "lon": 44.42, "ref": "Gen 11:1–9", "sub": "A city of brick and tar, a tower reaching the sky, and the scattering of languages.", "s": "The people who settled in Shinar decide to build a city and a tower to make a name for themselves. God confuses their languages, and the people disperse across the earth.", "k": ["The story says that all people had one language and the same words. Having come to the plain of Shinar, they decided to bake bricks, to use tar instead of mortar, and to build a city with a tower reaching the sky, so as to make a name for themselves and not be scattered over the earth. God comes down to see their work and confuses their speech. The building is halted, and the city receives the name Babel. The text is a warning against the pride of a community that wants to replace God with its own work. Later, the prophets and psalmists will refer to Babylon as a symbol of power hostile to God, but also as the place where the people of Israel would experience exile.", "A play on words in the text links the Hebrew word for confusion with the name Babel, that is, Babylon. The city lay on the Euphrates, about 85 km south of present-day Baghdad. The tower recalls the ziggurat Etemenanki, a stepped temple built in Babylon of fired bricks, using bitumen, the natural tar from local springs. This was how building was done across the whole plain: the lack of stone made brick necessary. Thanks to this, the biblical author, knowing Babylonian realities, gave the story a distinct local color. For Christian readers, the story of the confusion of languages is completed by the event of Pentecost, in which people of different nations understand one message."], "j": "The artistic reconstruction shows an enormous stepped tower of brick rising above the city, with broad ramps and scaffolding of logs. At its foot a crowd of workers can be seen, with carts of bricks and canals. The Euphrates flows along the bank. The whole is an interpretation based on excavations of ziggurats and descriptions in ancient sources, not a photograph of one specific building.", "d": "The ziggurats of Mesopotamia usually had from 3 to 7 stages, and the ruins of Babylon lie about 85 km from Baghdad.", "img": "img/c1m10.webp"}, {"id": "c1m11", "c": 1, "ct": "Beginnings", "n": "Ur of the Chaldeans", "lat": 30.96, "lon": 46.1, "ref": "Gen 11:27–31", "sub": "Abram's hometown, on the Euphrates, with a great temple of the moon god.", "s": "Terah, Abram's father, lives in Ur of the Chaldeans and sets out from there toward Canaan. Ur was a rich commercial and religious city with a ziggurat of the moon god.", "k": ["Chapter 11 moves from the story of the peoples to the history of one family. Terah, his sons Abram, Nahor, and Haran, and Abram's wife, Sarai, live in Ur of the Chaldeans. Haran dies in his native city, and Terah sets out with part of the family toward Canaan, but stops in Haran and dies there. For the reader this is an important moment: from the universal story of humanity, the Bible narrows to a single clan from which the people of Israel will grow. Because of this, we can see that Abram's call meant giving up a secure, prosperous life in one of the most developed cities in the world.", "Ur lay on the Euphrates in the south of Mesopotamia and was one of the largest urban centers of its age. Excavations have revealed the ziggurat of the moon god Nanna, rich royal tombs, and tablets with commercial records. The inhabitants traded wool, grain, and metals with distant lands. According to the records, Ur flourished around 2100 BC, so the probable time of Abram corresponds to the period of the city's greatness. The name of the Chaldeans itself appears later, which writers explain as an updating of the name for the reader. This gives his journey a credible, human dimension: he was leaving a home that gave security, not ruins or a village."], "j": "The artistic reconstruction shows a city with a broad ziggurat on a mound, surrounded by compact brick buildings and date palms. A merchant passes along a street with a donkey, and in the background the sun shines over the Euphrates. The picture is based on excavations at Ur, including the preserved base of the ziggurat. The figures are small and seen from a distance, and the details of clothing are conjectural.", "d": "The ziggurat at Ur had a base of about 64 × 45 m, and the city lies about 300 km from the Persian Gulf along the old shoreline.", "img": "img/c1m11.webp"}, {"id": "c1m12", "c": 1, "ct": "Beginnings", "n": "Haran", "lat": 36.87, "lon": 39.03, "ref": "Gen 11:31–32; 12:4", "sub": "A city on a trade route where Terah's family stops.", "s": "Terah and his family settle in Haran, and he dies there. From this city Abram, according to the following text, will set out for Canaan.", "k": ["After leaving Ur, Terah's family reaches Haran and decides to stay there. Terah dies at the age of two hundred and five. In the next chapter God calls Abram to leave his country and his father's house, and promises him blessing and offspring. Abram, at the age of seventy-five, sets out with his wife Sarai, his nephew Lot, and their possessions. Haran thus becomes the last stop before the real journey to Canaan and the beginning of the story of the covenant. Israelite tradition remembered Haran as the home of Nahor's family and the place from which Isaac and Jacob would seek wives, which shows the lasting strength of family ties.", "Haran lay on the Balikh River, a tributary of the Euphrates, in northern Mesopotamia. Trade routes linking Mesopotamia with Syria and Anatolia passed through the city, so it was an important center for caravans. The distance from Ur to Haran is about 900 km in a straight line, and the journey along the Euphrates took many weeks. The city was also a center of the cult of the moon god, like Ur. Today it lies near the Turkish-Syrian border, and the area is dotted with characteristic dome-shaped brick houses. In this way the city becomes a bridge between the prehistory of the early Bible and the history of the patriarchs, to which the next part of the atlas is devoted."], "j": "Artistic reconstruction: imagine an open plain with a walled city, a well, and a route along which caravans of donkeys travel. The land is dry but green along the river. Flocks graze around the city, and in the evening women draw water from the well.", "d": "The road from Ur to Haran is about 900 km in a straight line; Haran lies about 40 km from Şanlıurfa.", "img": null}, {"id": "c2m1", "c": 2, "ct": "The Patriarchs", "n": "Ur of the Chaldees", "lat": 30.96, "lon": 46.1, "ref": "Gen 11:27–12:3", "sub": "From here Abram sets out at the sound of a voice that promises him a land and a great nation.", "s": "Abram lives in Ur, a rich city on the Euphrates, when he receives the call to leave his native country. He sets out with his father Terah and his family, not knowing exactly where the road will lead him.", "k": ["Terah's family comes from Ur of the Chaldees. According to the Book of Genesis, Terah leads out his relatives, among them his son Abram, his grandson Lot, and his daughter-in-law Sarai, and heads toward Canaan. The journey breaks off, however, at Haran, where the family settles. Only there does Abram hear the call to leave his native land and his father's house, and in return he receives the promise of offspring, blessing, and a country. The text does not describe the reasons for the departure, but it shows that the decision meant a break with his entire social background.", "Ur lay in southern Mesopotamia, near the old bed of the Euphrates, not far from the former coast of the Persian Gulf. The area was flat, irrigated by canals, and very fertile, so the city grew rich on trade and agriculture. The road to the northwest ran along the Euphrates, through Babylonia and on toward Syria. Such a route was over a thousand kilometers long and gave constant access to water, but it also meant passing the settlements of rulers who collected tolls from caravans. That is why the family's journey was an undertaking that required planning."], "j": "The artistic reconstruction shows a city of sun-dried and fired brick, surrounded by grain fields and date palms. Above the rooftops rises a multi-stage temple tower called a ziggurat, visible from afar on the flat plain. Narrow streets wind among houses with courtyards, and canals connect the districts with the river. At the quay, reed and wooden boats are moored with goods. Archaeologists have discovered rich tombs and buildings at Ur from the beginning of the third and second millennia before Christ.", "d": "Distance from Ur to Haran along the Euphrates: about 1,000–1,200 km.", "img": null}, {"id": "c2m2", "c": 2, "ct": "The Patriarchs", "n": "Haran", "lat": 36.87, "lon": 39.03, "ref": "Gen 11:31–12:5", "sub": "A city in northern Mesopotamia where Abram stays until his father's death and from where he moves on.", "s": "In Haran, Terah's family stops for a longer time, and after his father's death Abram sets out toward Canaan. Later Isaac and Jacob return to this region to seek wives among their relatives.", "k": ["Haran is a stopping place that becomes a starting point. When Terah dies, Abram takes his wife Sarai, his nephew Lot, all the possessions they had gathered, and the people they had acquired in Haran, and heads south. The biblical tradition calls the area Aram Naharaim, that is, the land by the rivers. Abraham's servant later seeks a wife for Isaac here, and Jacob flees here from the anger of his brother Esau. The family therefore keeps its ties with this country over generations and remembers its roots.", "Haran lay on the Balikh River, a tributary of the Euphrates, in what is today northern Syria and southern Turkey. The area has a semi-arid climate, yet gentle hills and plains provide good pastures for sheep and goats. The city stood at the crossing of routes leading to Anatolia, Syria, and Mesopotamia, which made it an important trading center. From here the road to Canaan led through Aleppo and Damascus and was about 800–900 km long. For flocks moving slowly, this meant a journey of several weeks.", "Most scholars identify the location of Haran with the modern town of Harran in Turkey."], "j": "The artistic reconstruction shows a fortified town on a slightly raised plain, with walls of brick and stone and a cluster of houses around a temple. Fields and pastures stretch around it, and at the wells shepherds gather with their sheep. Paths converge at the city gate, where caravans of donkeys unload goods. In winter a cold wind blows here, and in summer the heat is oppressive. Important trade routes passed through the city.", "d": "Haran to Shechem: about 700–800 km in a straight line, and more by road.", "img": null}, {"id": "c2m3", "c": 2, "ct": "The Patriarchs", "n": "Shechem", "lat": 32.21, "lon": 35.28, "ref": "Gen 12:6–7; 33:18–20; 34", "sub": "Abram's first stop in Canaan, between Mount Gerizim and Mount Ebal.", "s": "Abram arrives at Shechem and there receives the promise that this land will go to his offspring. Later Jacob buys a piece of land here, and tragic events involving his family take place in the city.", "k": ["After arriving in Canaan, Abram passes through the land as far as the place called Shechem, near the great tree of Moreh. The Canaanites live there at that time. In this place God renews the promise of the land to his offspring, and the patriarch builds an altar. Many years later Jacob, returning from Haran, pitches his camp before the city and buys a plot from the sons of Hamor. Chapter 34 tells of the conflict that breaks out after the violation of Dinah and leads to violence by Jacob's sons. Shechem thus remains a place of promise and of painful memory.", "Shechem lies in a valley between two mountains, Gerizim and Ebal, which rise above it by several hundred meters. Through this place runs the main north–south road along the ridge of the hills of Ephraim, more convenient and safer than the lowland routes where city-states held sway. Abundant springs provided water, and the slopes favored the cultivation of olives and grain. It was therefore a natural place for shepherds to stop. From Shechem to Bethel is about 30 km to the south, a day or two of travel with flocks.", "The name Shechem is linked to present-day Tell Balata near Nablus."], "j": "The artistic reconstruction shows a narrow valley with two steep mountains on either side. At the foot grows an olive grove, and on a hill stands a walled city with a gate tower. Beside the road, shepherds water their flocks at a well. In the distance, rocky slopes covered with sparse vegetation can be seen on the summits. In spring the valley is green, and in summer dry and golden. The patriarch's tents stand off to the side, outside the walls of the settlement.", "d": "Height of the mountains: Gerizim about 881 m above sea level, Ebal about 940 m above sea level.", "img": null}, {"id": "c2m4", "c": 2, "ct": "The Patriarchs", "n": "Mamre near Hebron", "lat": 31.55, "lon": 35.11, "ref": "Gen 13:18; 18:1–15", "sub": "Beneath a great tree Abraham welcomes three mysterious guests.", "s": "At Mamre Abraham settles permanently and builds an altar. There he also hosts three travelers who announce the birth of a son.", "k": ["After parting from Lot, Abram moves his tents to the grove of Mamre near Hebron and builds an altar there. In the heat of midday, as he sits at the entrance to his tent, he sees three men. He runs to meet them, bows low, has water brought to wash their feet, and asks Sarah to bake bread. The meal consists of milk, curds, and veal. The guests announce that in a year Sarah will bear a son. Sarah, hearing this at the tent, laughs, and the name Isaac will recall that laughter. The Christian tradition sees in the scene hospitality as a virtue.", "Hebron lies at an elevation of about 900 m above sea level, on the watershed of the Judean hills, where rainfall is higher than in the desert and the soils are suited to growing vines and olives. In winter it can be cold, and in summer the altitude eases the heat. Through the area runs the ridge road linking Beersheba with Jerusalem, about 70 km long. Ancient trees offered shade, and wells and pastures made it possible to keep large flocks. For this reason Mamre was an ideal place for the family's permanent camp, safely situated away from the great cities."], "j": "The artistic reconstruction depicts the heat of midday. An old, spreading oak casts deep shade on a tent of black goat hair. In front of it sits an older man, and in the distance three figures approach. Sheep and goats graze around, and on the hillside vineyards and olive trees grow. The air shimmers with heat, the ground is dry, and the sky is faded. It all unfolds in the quiet of a pastoral afternoon.", "d": "Hebron lies about 900 m above sea level, about 30 km south of Jerusalem.", "img": "img/c2m4.webp"}, {"id": "c2m5", "c": 2, "ct": "The Patriarchs", "n": "Sodom and Gomorrah by the Dead Sea", "lat": 31.2, "lon": 35.45, "ref": "Gen 13:10–13; 18:16–19:29", "sub": "The Jordan valley that Lot chose ends in the catastrophe of the cities of the plain.", "s": "Lot chooses the fertile region of the Jordan and settles near Sodom. After the destruction of the cities, Abraham looks from afar at the smoke rising over the valley.", "k": ["When the herdsmen of Abram and Lot begin to quarrel over pastures, Abram proposes that they part. Lot chooses the well-watered plain of the Jordan, which reminds him of a garden, and pitches his tents near Sodom. The inhabitants of the city are described as cruel to strangers. Abraham intercedes for them with God, but the righteous are too few. Lot flees with his daughters, and the cities of Sodom and Gomorrah are destroyed. In the morning Abraham looks down from above at the smoke rising like smoke from a furnace. The story has a moral dimension, not a tourist one.", "The Jordan valley is the lowest place in the world: the shore of the Dead Sea lies about 430 m below sea level. The climate here is hot and dry, and the water of the sea contains about ten times more salt than the ocean. In the area there are natural bitumen and sulfur, which explains the biblical images of fire and tar. From Hebron to the shore of the lakes is about 40 km downhill, which explains how Abraham could observe the valley from a height. The exact location of the cities is uncertain; tradition places them in the south or east of the body of water."], "j": "The artistic reconstruction shows the valley in the morning, seen from a high ridge. Below, the smooth surface of the salt sea gleams, surrounded by white salt deposits and bare cliffs. A streak of dark smoke rises from the plain. Closer by is a stony path, and on it a lone figure looking down, turned away. The air is thick with haze, and the light of the rising sun reddens the rocks on the other side.", "d": "Level of the Dead Sea: about 430 m below sea level; length of the body of water about 50 km.", "img": "img/c2m5.webp"}, {"id": "c2m6", "c": 2, "ct": "The Patriarchs", "n": "Beersheba", "lat": 31.25, "lon": 34.79, "ref": "Gen 21:22–34; 22; 26:23–33", "sub": "The well of the oath at the edge of the desert, an important stop for Abraham and Isaac.", "s": "At Beersheba Abraham makes an agreement with Abimelech over a well and plants a tamarisk. Later Isaac renews the wells here and again receives the promise.", "k": ["The name Beersheba is associated with a well and an oath. Abimelech, the ruler from the area of Gerar, and his commander make an agreement with Abraham in which they acknowledge his right to the well dug with his own hands. The patriarch plants a tamarisk and calls on the name of the Lord. From here he sets out for the mountain indicated for the offering of Isaac. Many years later Isaac reopens the wells that had been filled in and receives the promise of support. The well here means life, the right of ownership, and peace with neighbors.", "Beersheba lies at the meeting point of the Negev and the cultivated belt, in a place where annual rainfall is only about 200 mm. For this reason access to wells decided the survival of flocks. This area was the southern edge of the permanently settled land, hence the later expression \"from Dan to Beersheba.\" The road to Hebron is about 45 km and runs through dry hills. Shepherds traveled it seasonally, seeking grass after the winter rains. The site of Tell es-Seba lies a few kilometers from the modern city."], "j": "The artistic reconstruction shows a broad, bright plain under a cloudless sky. In the middle is a stone well with a wooden windlass and troughs for the animals. Beside it grows a solitary tamarisk, and sheep graze around. On the horizon, low sand-colored hills stand out, and beyond them dry steppe. Shepherds draw water in leather buckets and talk at the edge of the stone well-curb.", "d": "Beersheba to Hebron: about 45 km; rainfall about 200 mm per year.", "img": null}, {"id": "c2m7", "c": 2, "ct": "The Patriarchs", "n": "Machpelah in Hebron", "lat": 31.52, "lon": 35.11, "ref": "Gen 23; 25:7–10; 49:29–32", "sub": "The only piece of land Abraham buys, to bury Sarah.", "s": "After Sarah's death Abraham negotiates with the Hittites to buy the cave of Machpelah. Abraham, Isaac, Rebekah, Leah, and Jacob will also rest here.", "k": ["Sarah dies in Kiriath-arba, that is, in Hebron. Abraham, as a foreigner, has no tomb of his own. He stands before the assembly of the city's inhabitants and asks for the opportunity to buy. Ephron offers the field together with the cave, but the patriarch insists on settling the price so that the matter is honestly sealed. He pays four hundred shekels of silver, and the transaction takes place publicly, at the city gate. Thus the family tomb comes into being, in which Abraham, Isaac, Rebekah, Leah, and Jacob were later laid as well.", "Hebron lies about 30 km south of Jerusalem, at an elevation of about 900 m, in one of the oldest centers of settlement in Judea. The area is hilly, stony, and full of natural limestone caves, which often served as tombs. Tradition locates Machpelah beneath a structure from the time of Herod, which to this day surrounds a place revered by Jews, Christians, and Muslims. The Herodian wall is about 60 m long and clearly visible. The exact layout of the caves remains inaccessible to full archaeological investigation."], "j": "The artistic reconstruction depicts a field on a hillside, with a row of olive trees and a low stone wall. In the rock face opens a narrow entrance to a cave, covered by a flat boulder. Below runs a road leading to a town with flat stone roofs. In the setting sun everything takes on a golden hue. The atmosphere is quiet, full of solemnity and mourning.", "d": "Price of the field about 400 shekels of silver; Hebron about 900 m above sea level.", "img": null}, {"id": "c2m8", "c": 2, "ct": "The Patriarchs", "n": "Bethel – Jacob's Dream", "lat": 31.93, "lon": 35.22, "ref": "Gen 28:10–22; 35:1–15", "sub": "A fugitive sleeps on a stone and sees heaven opened over the earth.", "s": "Fleeing from Esau, Jacob spends the night in a field near Luz and has a dream of a ladder reaching to heaven. He names the place Bethel, that is, the house of God.", "k": ["Jacob sets out from Beersheba for Haran to escape his brother's revenge and to find a wife among his relatives. When dusk falls, he stops for the night, lays his head on a stone, and dreams of a ladder. Angels ascend and descend, and God renews the promise given to Abraham and Isaac. After waking, Jacob sets up the stone as a memorial, anoints it with oil, and names the place Bethel. Years later he returns here at God's command to fulfill his vow.", "Bethel lies on the ridge of the mountains of central Palestine, about 17 km north of Jerusalem, at an elevation of about 880 m above sea level. The stony terrain, sparse trees, and lack of convenient shelter meant that a lone traveler slept under the open sky. The ridge road linked Hebron with Shechem and was the main route of Palestine. Jacob traveled about 100 km from Beersheba to Bethel, which corresponds to several days' journey. The identification with the village of Beitin is widely accepted."], "j": "The artistic reconstruction shows an evening sky over a stony hill. A lone figure sleeps on the ground with his head on a flat stone, seen from a great distance. Above him a bright streak of light parts the clouds, forming a fan of rays descending to the earth. Boulders lie all around, and a few thorny shrubs grow. Far below, a gentle valley looms. In the air hangs a warm night after a hot day.", "d": "Bethel: about 880 m above sea level, about 17 km north of Jerusalem.", "img": "img/c2m8.webp"}, {"id": "c2m9", "c": 2, "ct": "The Patriarchs", "n": "Jabbok and Penuel", "lat": 32.19, "lon": 35.69, "ref": "Gen 32:23–33", "sub": "A night struggle at the Jabbok ford changes Jacob's name to Israel.", "s": "Returning to Canaan, Jacob takes his family across the ford of the Jabbok and is left alone. In the night he wrestles with a mysterious opponent and receives a new name.", "k": ["Returning after many years from Haran, Jacob learns that Esau is coming to meet him with four hundred men. At night he sends his wives, children and possessions across the ford of the Jabbok, while he stays alone on the other side. There he wrestles until dawn with a mysterious figure who touches his hip and changes the patriarch's name to Israel. In the morning Jacob names the place Peniel, because he has seen God face to face, and he limps for the rest of his life. The next day he meets his brother in reconciliation.", "The Jabbok, today the Nahr az-Zarqa, is a tributary of the Jordan flowing down from the hills of Gilead to the east. The river cuts into a deep, rocky gorge, and in the dry season it can be crossed in several places. Penuel stood near the ford, about 10 km east of the Jordan. From Haran to Penuel is about 600 km in a straight line, so the journey with flocks took many weeks. Its exact location is uncertain; Tulul edh-Dhahab on the lower course of the river is often suggested."], "j": "The artistic reconstruction shows a deep gorge at dusk. Shallow, swift water runs between stony banks, and on the far side a herd of animals and a few tents can be seen. In the foreground, in the gloom, two dark figures are locked in a struggle, visible from a distance. The sky in the east is growing lighter, heralding dawn. Oleander bushes cover the slopes, and the chill of the night hangs in the air.", "d": "The Jabbok is about 100 km long; Penuel lies about 10 km east of the Jordan.", "img": "img/c2m9.webp"}, {"id": "c2m10", "c": 2, "ct": "The Patriarchs", "n": "Dothan", "lat": 32.41, "lon": 35.24, "ref": "Gen 37:12–36", "sub": "Near the cisterns and the caravan route, the brothers sell Joseph.", "s": "Joseph goes looking for his brothers, who are grazing their sheep, and finds them at Dothan. Jealous, they throw him into a dry cistern and then sell him to merchants traveling to Egypt.", "k": ["Jacob sends Joseph from Hebron to see how his brothers are doing. Joseph goes by way of Shechem and learns that the flocks have moved on to Dothan. His brothers see him from afar, dressed in his distinctive robe, and decide to get rid of him. They throw him into an empty cistern. When a caravan of Ishmaelite merchants passes by, they pull Joseph out and sell him for twenty pieces of silver. They bring their father a bloodstained robe, and he sinks into mourning.", "Dothan lies in a valley north of Shechem, about 25 km in a straight line. The road linking the Jezreel Valley with the coast, and onward to Egypt, passed through it, so caravans carrying balm and resin came this way regularly. The valley has fertile pastures surrounded by hills, and cisterns for storing water were cut into the rock. From Hebron to Dothan is about 100 km, and to Egypt more than 400 km. Tell Dothan has been studied archaeologically and shows settlement from the Bronze Age."], "j": "The artistic reconstruction shows a green valley beneath gentle hills. Flocks of sheep graze on the slopes, and in the distance a group of shepherds stands under a tree. From the other side of the valley a caravan of camels approaches, loaded with sacks and jars. In the foreground is the stone opening of a cistern, partly hidden by bushes. The light is sharp, afternoon light, and the shadows are long.", "d": "Dothan–Hebron: about 100 km; Joseph's sale price about 20 pieces of silver.", "img": "img/c2m10.webp"}, {"id": "c2m11", "c": 2, "ct": "The Patriarchs", "n": "Egypt and Memphis", "lat": 29.85, "lon": 31.25, "ref": "Gen 39–41", "sub": "A slave from Canaan becomes the steward of the granaries of the land of the Nile.", "s": "Joseph ends up in the house of Potiphar, sits in prison, and finally interprets Pharaoh's dreams. He becomes steward of the supplies, preparing the country for seven years of famine.", "k": ["In Egypt, Joseph works in the house of Potiphar, one of Pharaoh's courtiers. Falsely accused, he is thrown into prison, where he explains the dreams of two officials. When Pharaoh has troubling dreams about cows and ears of grain, Joseph is mentioned. The young Hebrew explains that after seven fruitful years, seven years of famine will come. Pharaoh entrusts him with overseeing the storing of grain, gives him an Egyptian name and raises him to high office. The text stresses that Joseph's rise comes from wisdom and God's good care.", "Egypt depended on the yearly flooding of the Nile, which deposited fertile silt on the fields. When the flood was too low or too high, famine and disaster threatened. Memphis, at the apex of the delta, was an important center of administration and trade. From there to the Mediterranean coast is about 200 km. Granaries stored grain in silos of clay and brick, and officials recorded the supplies. The biblical text does not give the name of the pharaoh, so the exact dating of the events remains a subject of research."], "j": "The artistic reconstruction shows the broad Nile, with sailing barges gliding along it and green fields on both banks. Beyond them stretch the desert and low pyramids in the misty distance. By the quay stand long granaries of mud brick, and workers carry baskets of grain. On a palace terrace a small figure with his back turned watches the work. The air is warm and bright, smelling of water and straw.", "d": "Memphis–Mediterranean Sea: about 200 km; the Nile flood lasted several months.", "img": "img/c2m11.webp"}, {"id": "c2m12", "c": 2, "ct": "The Patriarchs", "n": "Goshen", "lat": 30.55, "lon": 31.95, "ref": "Gen 45:9–11; 46:28–34; 47:1–12", "sub": "A region in the eastern Nile delta where Jacob's family settles.", "s": "Joseph invites his father and brothers to Egypt, and Pharaoh assigns them the land of Goshen. There the family prospers as shepherds.", "k": ["Years later Joseph reveals himself to his brothers and asks them to bring their father. Jacob sets out with his whole family from Beersheba, and on the way receives God's assurance of protection. Joseph goes out to meet him and presents him to Pharaoh. The ruler assigns the settlers the land of Goshen as the best region for their flocks. Thus begins a community that, from seventy persons, will grow into a nation. The Book of Genesis ends with the death of Joseph and the promise that God will bring his descendants back to Canaan.", "Goshen is usually located in the eastern part of the Nile delta, in the Wadi Tumilat, about 100 km from Memphis toward the Sinai Peninsula. It was a strip of well-watered meadows, ideal for sheep and cattle, and also close to the border, so flocks could easily be moved from Canaan. The road from Beersheba across Sinai is about 250 km, or a dozen or so days' march. The exact boundaries of the region are uncertain, and the identification rests on tradition and analysis of routes."], "j": "The artistic reconstruction shows a flat, green plain crisscrossed by canals. Flocks of sheep and cattle graze beside rows of palms, and in the background there are pens of reed and clay. The shepherds wear simple, light robes. The air is humid and the sky wide. On the horizon the low dunes of the desert come into view, separated from the region by a sharp band of green.", "d": "Goshen lies about 100 km from Memphis; the road from Beersheba is about 250 km.", "img": null}, {"id": "c3m1", "c": 3, "ct": "Egypt, Exodus and the Wilderness", "n": "Pi-Ramesses, the City of Ramesses", "lat": 30.8, "lon": 31.83, "ref": "Exod 1; 12", "sub": "A great delta capital where the Israelites labored building storehouses and cities.", "s": "The Book of Exodus mentions the store cities that the Israelites built for Pharaoh, Ramesses among them. From this area a band of refugees set out on the night of the Passover.", "k": ["Exod 1:11 says that the Israelites built supply cities for Pharaoh, Pithom and Ramesses. The work with brick, clay and fields was hard, and the ruler feared that the growing people would become a threat on the eastern border. Exod 12 describes the night when, after dramatic events, Pharaoh let the people go. The text stresses the haste: unleavened bread, traveling clothes, families gathered together. The Exodus thus begins not in the silence of the desert, but in the middle of a crowded administrative capital.", "Pi-Ramesses lay on the eastern edge of the delta, near a former branch of the Nile, which gave the city a port and access to the trade routes to Sinai and Canaan. The area of present-day Qantir is most often accepted as the site, though some scholars point to nearby Tell el-Daba. This is therefore a dispute about location, not about the existence of the city in the time of Ramesses II. Its nearness to the border explains why the army, workshops and storehouses were built right here. From here, routes measured in days, not weeks, led to the desert. Think of the scale of such a metropolis: numerous temples, craftsmen's quarters, stables for horses, and canals along which barges brought stone and grain. In such a place the violence of the system of daily labor was visible at every step, but just as visible was the power that the biblical story stands against. That is why Exod 12 ends with the image of families setting out at dawn."], "j": "Imagine a broad, flat plain dotted with fields and canals. On the horizon rise temple gateways faced with pale stone, and below them long rows of mud-brick storehouses. Barges of acacia wood are moored at the quay. The air is hot and smells of silt and bakery smoke. The whole is an artistic reconstruction, based on finds from Qantir and Tell el-Daba, not an exact plan of the city.", "d": "The distance from Pi-Ramesses to Lake Timsah is about 50 km in a straight line (the location of the city is disputed: Qantir or Tell el-Daba).", "img": "img/c3m1.webp"}, {"id": "c3m2", "c": 3, "ct": "Egypt, Exodus and the Wilderness", "n": "Pithom, the Store City", "lat": 30.55, "lon": 31.99, "ref": "Exod 1:11", "sub": "The second of the store cities, built in the narrow valley of the Wadi Tumilat.", "s": "Pithom was an Egyptian city of supplies, mentioned together with Ramesses. It lay in a strip of fertile valley leading toward Sinai.", "k": ["Exod 1:11 names Pithom as one of two cities that the Israelites built as supply centers. The name Pithom comes from an Egyptian name meaning the house of the god Atum, which suggests a cult center linked to storehouses. The text shows how forced labor was bound up with the state economy: brick, clay and straw became the foundation of structures meant to secure power. The book gives no details of the architecture, but the mere mention of supplies shows that the delta was also a logistical base for military expeditions.", "It is most often assumed that Pithom lay in the Wadi Tumilat, a narrow valley running from the Nile eastward toward the Bitter Lakes. Tell el-Retaba is considered a candidate, though some researchers choose Tell el-Maskhuta, so the location is disputed. The valley was a natural corridor: it had water, pastures and roads along which caravans and armies moved. That is why cities with supplies were placed there, and later one of the possible escape routes toward the desert led this way. Geography thus explains why the story concentrates on this strip of land. For the reader the difference in scale between the two places matters: Pi-Ramesses was a great capital, Pithom more of a logistical center. Together they form a picture of a country in which work on resources was organized on a vast scale. When you look at the map, you see both cities about 40 km apart, on a single route leading to the border."], "j": "Imagine a row of long, low storehouses of raw brick, set around a rectangular courtyard. Beside them rises a small temple with columns, and by the canal people are working, kneading clay with straw. Donkeys with sacks of grain stand beneath the walls. This is an artistic reconstruction, based on finds from the store cities of the delta, not a portrait of a particular excavation.", "d": "The Wadi Tumilat is about 50 km long; the location of Pithom (Tell el-Retaba or Tell el-Maskhuta) is disputed.", "img": null}, {"id": "c3m3", "c": 3, "ct": "Egypt, Exodus and the Wilderness", "n": "Succoth, the First Stop", "lat": 30.55, "lon": 32.1, "ref": "Exod 12:37; 13:20", "sub": "The refugees' first camp, at the threshold of the desert.", "s": "From Ramesses the people reached Succoth, the first station on the road. This is where the real journey begins.", "k": ["Exod 12:37 says that the Israelites set out from Ramesses to Succoth, and with them many men, women, children and numerous flocks. The text also speaks of a mixed crowd that joined them. Exod 13:20 adds that the next stop was Etham, on the edge of the desert. Succoth means \"booths,\" and it fits the character of this place well: makeshift shelters where people stop for the first night. The story slows down here and shows weariness, uncertainty and the community of the road coming to life.", "Succoth is usually identified with the Egyptian Tjeku, that is, the area of Tell el-Maskhuta in the Wadi Tumilat, but the location is disputed. The valley leads straight toward the Bitter Lakes and Lake Timsah, so it is the natural first stage of a movement eastward. The distance from Ramesses is about 50 km in a straight line, which at the pace of a large group with children and cattle means several days' march. The border of Egypt was not a line on a map, but a belt of fortresses and wells, through which one passed with the permission of the guards. It is worth noting that the Book of Exodus does not choose the shortest road through the land of the Philistines (Exod 13:17), but leads the people toward the desert. The reason is practical: that way ran a military road full of Egyptian outposts. The choice of route shows how strongly geography and politics shaped the course of the events described."], "j": "Imagine a broad strip of sand and low shrubs at the edge of a valley. Along a narrow canal, makeshift booths of branches and cloth have been set up, and sheep graze nearby. Smoke from the campfires rises straight up, for there is no wind. In the distance the first rocky hills can be seen. This is an artistic reconstruction, not an exact picture of a specific place.", "d": "From Pi-Ramesses to Succoth (Tell el-Maskhuta) is about 50 km in a straight line; the location is disputed.", "img": null}, {"id": "c3m4", "c": 3, "ct": "Egypt, Exodus and the Wilderness", "n": "The Sea of Reeds", "lat": 30.58, "lon": 32.3, "ref": "Exod 14–15", "sub": "The place of the crossing, whose exact location remains a subject of research.", "s": "Exod 14 describes the crossing through the water and the rescue from the pursuit. The place is disputed: scholars consider several routes.", "k": ["Exod 14 tells of a camp by the water, of the pursuit by Pharaoh's army, and of a crossing that the Israelites recognized as the work of God. The Hebrew name yam suph means \"sea of reeds\" or \"sea of rushes,\" and the Greek tradition translated it as the Red Sea. Exod 15 is a hymn of thanksgiving after this event. The text gives no coordinates, so the reader must rely on the clues of place names: Pi-hahiroth, Migdol and Baal-zephon (Exod 14:2). Their location is uncertain.", "Scholars have proposed several hypotheses. The northern route leads to lakes near the Mediterranean Sea, the central route to Lake Timsah and the Bitter Lakes, and the southern route to the Gulf of Suez. Each has its supporters and arguments, so in this atlas we give Lake Timsah as an approximate point, noting that the location is disputed. In the Wadi Tumilat the terrain changes from fertile to marshy, with reeds and shallow pools that could have formed a natural obstacle for an army with chariots. For the reader the most important thing is what the text itself says: the road toward the desert led through a place where water blocked both escape and pursuit. Weighing geographical hypotheses does not weaken the message, but lets us see the realistic background. The width of shallow bodies of water, on the order of a few kilometers, and seasonal changes in water level fit well with the picture of a place where wind, land and water are at work."], "j": "Imagine shallow water, cold at dawn, among dense thickets of reeds, as wide as a lake, with no clear shore on the far side. The sky is gray and pink, and on the eastern side the low edge of the desert rises. On the shore, groups of people with animals can be seen from afar. This is an artistic reconstruction of one of the possible hypotheses, not an exact re-creation of the course of events.", "d": "Three main route hypotheses are considered for the crossing (northern, central, southern); the distance from Succoth to Lake Timsah is about 20 km, and the location of the place is disputed.", "img": "img/c3m4.webp"}, {"id": "c3m5", "c": 3, "ct": "Egypt, Exodus and the Wilderness", "n": "Marah, the Bitter Spring", "lat": 29.43, "lon": 32.97, "ref": "Exod 15:22–26", "sub": "The first water after three days of marching, but bitter to the taste.", "s": "After three days in the desert the people reached a spring whose water was bitter. The name Marah means \"bitterness.\"", "k": ["Exod 15:22–26 tells that after crossing the water the Israelites walked three days through the wilderness of Shur and found no water. When they reached Marah, the water proved undrinkable, so the people began to grumble. The story stresses how quickly joy at being rescued gives way to weariness and fear for basic needs. Then the spring is healed, and the people receive instruction about listening to the voice of God. Marah becomes a symbol of the first trial in the desert.", "Marah is traditionally identified with Ain Hawara, a spring of brackish water about 80 km southeast of Suez. The location is disputed, since some scholars prefer Ain Musa, closer to Suez. The picture of a brackish spring fits the text well: on the eastern shore of the Gulf of Suez many waters are made salty by the limestone bedrock and the hot climate. Three days' march at the average pace of a group with children and animals is about 40–60 km, which falls within this range. For reading the journey, it matters that water determines the route. In Sinai the routes lead from oasis to oasis, and between them stretch sections requiring days of marching without springs. Marah is the first such test, and Elim, the next place, shows the other side of the desert: wells and palms. The whole story thus has a rhythm of scarcity and abundance."], "j": "Imagine a small, gravelly valley with a few tamarisk bushes. In a shallow hollow stands murky water with a white crust of salt. Stones heated by the sun lie all around, and in the background rises a pale limestone plateau. There is no shade here, so people take shelter under cloths. This is an artistic reconstruction, not a photograph of a particular spring.", "d": "Ain Hawara lies about 80 km southeast of Suez; the location of Marah is traditional and disputed.", "img": null}, {"id": "c3m6", "c": 3, "ct": "Egypt, Exodus and the Wilderness", "n": "Elim, the Oasis of Twelve Springs", "lat": 29.28, "lon": 32.98, "ref": "Exod 15:27; Num 33:9", "sub": "A stop at twelve springs and seventy palm trees.", "s": "At Elim there were twelve springs and seventy palm trees. Rest in the oasis contrasts with the harshness of the desert.", "k": ["Exod 15:27 and Num 33:9 say that at Elim there were twelve springs and seventy palm trees, and that the people camped there by the water. Numbers in the Bible often carry symbolic meaning, but here they describe the real richness of an oasis. After the bitter water of Marah, the text brings relief and a picture of a stable place of rest. The story does not develop the details, but the very brevity of the account suggests a moment of respite before further trials.", "Elim is usually identified with the Wadi Gharandel, a valley about 15–20 km south of Ain Hawara, though the location is disputed. The Wadi Gharandel has permanent water, tamarisks and date palms, so it fits the description well. In the Sinai region such oases are rare, and they are what set the practical routes of caravans. That is why scholars often look for stopping places near permanent springs, assuming that a group with cattle could not go long without water. In the ancient world the date palm was not only a source of shade but also of food: fruit, fibers for rope and leaves for roofs. The picture of seventy palm trees thus describes a place where one could mend clothing, replenish supplies and rest. On the map you can see that Elim lies farther from Suez, toward the south of the peninsula, where the landscape begins to rise toward the granite massifs."], "j": "Imagine a narrow valley where a green belt of palms and tamarisks grows from the stony floor. A small stream runs beneath the crowns of the trees, and beside it stand modest tents of goat wool. Farther on, on the slopes of the wadi, sharp dark rocks stand out. The air here is noticeably cooler than in the open desert. This is an artistic reconstruction, not an exact re-creation of the oasis.", "d": "The Wadi Gharandel lies about 15–20 km south of Ain Hawara; the location of Elim is disputed.", "img": null}, {"id": "c3m7", "c": 3, "ct": "Egypt, Exodus and the Wilderness", "n": "Rephidim, the Battle and Water from the Rock", "lat": 28.7, "lon": 33.65, "ref": "Exod 17", "sub": "No water, a rock, and the first battle in the desert.", "s": "At Rephidim the people again struggle with lack of water, and then with an attack by the Amalekites. Exod 17 joins both events in one place.", "k": ["Exod 17 describes the camp at Rephidim, where there was no water and the people demanded help. Moses strikes the rock with his staff at God's direction, and water flows from the stone. The text calls the place Massah and Meribah, meaning \"testing\" and \"quarreling.\" Right after this comes the attack of the Amalekites, a desert people. The story shows that a crisis on the road has many faces: thirst, conflict within the group, and threat from outside.", "For centuries Christian tradition has located Rephidim in the oasis of Feiran, in the Wadi Feiran, the largest oasis of southern Sinai. The location is disputed, because Feiran lies about 25 km from Jebel Musa, which creates tension with the short interval of time described in the text. Feiran does, however, have palms, water and a strategic position on the route leading to the mountains. For a group wandering through the desert, taking such an oasis was a matter of survival, so an encounter with a local people is very likely. The battle with the Amalekites is fought on open ground, in a narrow valley, where superior numbers do not always decide. Exod 17:11–12 describes Moses on a hill with raised hands, supported by Aaron and Hur. The image of the hill as a vantage point fits the geography: high slopes above the wadi allowed one to see the whole battlefield. Thus nature and history are once again woven together in one place."], "j": "Imagine a broad valley lit by the sun, with a strip of green along a dry streambed. Above it rise reddish-brown slopes with jagged ridges. In the distance, on a hill, two small figures support a third with raised hands, while below groups of people gather. This is an artistic reconstruction, not a literal picture of the text.", "d": "The oasis of Feiran lies about 25 km from Jebel Musa in a straight line; the location of Rephidim is traditional and disputed.", "img": "img/c3m7.webp"}, {"id": "c3m8", "c": 3, "ct": "Egypt, Exodus and the Wilderness", "n": "Sinai / Horeb (Jebel Musa)", "lat": 28.54, "lon": 33.975, "ref": "Exod 19–20; 24; 31–34", "sub": "The mountain of the covenant, where the people received the Law.", "s": "The people stayed at the foot of Mount Sinai for about a year. Exod 19–34 describes the covenant, the Ten Commandments and the building of the Tabernacle here.", "k": ["Exod 19 says that three months after leaving Egypt the people stood at the foot of Mount Sinai. There follow preparation, thunder, fire and trumpets, and then the gift of the Ten Commandments (Exod 20). In the following chapters come the provisions of the law, the making of the covenant (Exod 24), the episode of the golden calf, and instructions about the Tabernacle. The Book of Numbers (Num 1–10) adds the census of the people and the organization of the camp. The stay at the mountain lasts about a year and is the central point of the whole narrative.", "Traditionally Mount Sinai, also called Horeb, is identified with Jebel Musa (the Mountain of Moses) in southern Sinai, at an elevation of about 2,285 m above sea level. This identification dates from Christian times and is tied to St. Catherine's Monastery at its foot. The location is disputed: other peaks have also been proposed, including Jebel Serbal, and even places in Arabia or the Negev. Before the mountain stretches the flat valley of Er-Raha, where a large crowd could have made camp. The granite mountain rises steeply above the valley and can be seen from far away, which explains the description of the boundaries set around it (Exod 19:12). Weather at this altitude can turn suddenly: storms with lightning, strong winds, cold nights even in summer. Such a landscape fits well with the picture of a theophany in thunder and fire. In reading the text, however, remember that its heart is not geography, but the meeting with God."], "j": "Imagine a huge, bare wall of red granite rising above a wide gravel valley. Dark clouds swirl above the summit, and below, the campfires of the camp burn, scattered like points of light. There are no trees on the slopes, only rock and shadow. This is an artistic reconstruction, not an exact re-creation of the events.", "d": "Jebel Musa is about 2,285 m above sea level; the identification with the biblical Sinai is traditional and disputed.", "img": "img/c3m8.webp"}, {"id": "c3m9", "c": 3, "ct": "Egypt, Exodus and the Wilderness", "n": "The Wilderness of Paran", "lat": 29.6, "lon": 34.1, "ref": "Num 10:12; 12:16; 13:3", "sub": "A vast desert through which the people traveled toward Kadesh.", "s": "After leaving Sinai, the people entered the wilderness of Paran. From here the spies set out for Canaan.", "k": ["Num 10:12 says that after leaving Sinai the cloud came to rest in the wilderness of Paran. From here, according to Num 13:3, Moses sent twelve spies to explore the land of Canaan. The story presents a stage of successive stops, such as Taberah and Kibroth-hattaavah, where the people complained about food and about their leaders (Num 11). Passing through this area took a long time and depended continually on water and fodder for the flocks.", "The wilderness of Paran is a vast, harsh area in central Sinai and in the northern part of the peninsula, with rocky hills, plateaus and dry wadi beds. Its exact boundaries are not fixed, and the location of individual stops is disputed. For the map we take a point of reference in the central part, about 100–150 km from Jebel Musa. Routes linking Sinai with the Negev ran this way, so the area was not entirely cut off from the world. For the reader it matters that Paran is not a single point, but a region. The name suggests large spaces where people and flocks wandered from spring to spring. In the Bible this place also appears in the story of Hagar and Ishmael (Gen 21:21), which shows that it was a known zone for pastoral peoples. From the point of view of the narrative, Paran is the gateway between the mountain of the covenant and the land of promise."], "j": "Imagine a boundless, flat plateau covered with gravel and sparse clumps of shrubs. Here and there low, pale hills rise, and in the valleys dry streambeds stretch out. The air shimmers with heat, and on the horizon a thin line of a caravan can be seen. This is an artistic reconstruction, not a portrait of a particular place.", "d": "The point on the map is approximate: the wilderness of Paran covers an area about 100–150 km across; its boundaries are disputed.", "img": null}, {"id": "c3m10", "c": 3, "ct": "Egypt, Exodus and the Wilderness", "n": "Kadesh-barnea", "lat": 30.63, "lon": 34.42, "ref": "Num 13–14; 20:1–13", "sub": "An oasis at the threshold of Canaan, where the people hesitated to enter.", "s": "At Kadesh-barnea the spies returned from Canaan, and the people were afraid to enter the land. It was here that they spent the following years.", "k": ["Num 13–14 tells of the twelve spies who explored the land for forty days. They returned with fruit and descriptions of a fertile land, but most presented its inhabitants as too strong. The people began to complain and refused to enter, which the book interprets as a lack of trust. As a consequence, the generation that came out of Egypt was to remain in the wilderness, and the way into the land was put off. Num 20:1–13 mentions the death of Miriam at Kadesh and a new conflict over water.", "Kadesh-barnea is most often identified with the oasis of Ain el-Kudeirat in northern Sinai, about 80 km south of Beersheba. The location is disputed, since Ain Qadis is also sometimes proposed. Ain el-Kudeirat is one of the largest springs in the region, surrounded by a fertile valley where cultivation is possible. The place lies at a crossroads of routes, so it provided the group with water and a good position, while also allowing a watch over the roads leading to the Negev. From the oasis to Beersheba is about 80 km in a straight line, which for families and flocks on the march would take several days. The oasis thus gives a picture of a place from which the goal can be seen, but a decision still has to be made. The book shows that the obstacle is not distance itself, but courage. That is why Kadesh-barnea remains in memory as the turning point of the whole journey."], "j": "Imagine a green, spacious hollow in the midst of a dry, rocky desert. The spring forms several streams, along which shrubs and low trees grow. Around the oasis stand many tents, and on the hills traces of old routes can be seen. This is an artistic reconstruction, not an exact re-creation of the camp.", "d": "Ain el-Kudeirat lies about 80 km south of Beersheba; the location of Kadesh-barnea is disputed.", "img": "img/c3m10.webp"}, {"id": "c3m11", "c": 3, "ct": "Egypt, Exodus and the Wilderness", "n": "The Plains of Moab", "lat": 31.78, "lon": 35.6, "ref": "Num 22–36; Deut 1–4", "sub": "The last camp before the Jordan, opposite Jericho.", "s": "After years of wandering, the people stopped on the plains of Moab, on the east side of the Jordan. From here the last stage before entering the land began.", "k": ["Num 22–36 describes the Israelite camp on the plains of Moab, on the east side of the Jordan, opposite Jericho. Here the episodes with Balaam take place, along with a new census of the people (Num 26) and the regulations on the division of the land. The Book of Deuteronomy, in turn, is a series of speeches by Moses, delivered in this very area. The story is drawing to a close, and the reader sees that the goal is not only to reach the land, but also to prepare the people for life in it.", "The plains of Moab are a broad strip of low ground east of the Jordan, just above the Dead Sea, at an elevation below sea level. The exact position of the camp is disputed, since the Bible gives names such as Shittim and Beth-peor, which we cannot identify with certainty. From the plains one can see Jericho to the west and the palm-filled valley of the Jordan. The strip of land is several kilometers wide, which was enough for a temporary camp of a large community. The climate of the Jordan valley is hot and dry in summer, and in spring the river overflows, which according to Josh 3:15 made the crossing difficult. Its location just before the border of the land makes Moab a symbolic place: the people are on the threshold, but not yet inside. Deut 1–4 recalls the whole road and leads to the final instructions that are meant to shape the life of the community."], "j": "Imagine a wide, hot lowland with shrubs, tamarisks and strips of green along the river. To the west the pale line of the Jordan and the palms of Jericho can be seen, and to the east the hills of Moab rise. The tents are pitched in rows, and above them rises the white smoke of campfires. This is an artistic reconstruction, not an exact plan of the camp.", "d": "The strip of the plains of Moab is several kilometers wide and lies below sea level; the point on the map is approximate, and the position of the camp is disputed.", "img": null}, {"id": "c3m12", "c": 3, "ct": "Egypt, Exodus and the Wilderness", "n": "Mount Nebo", "lat": 31.767, "lon": 35.725, "ref": "Deut 32:48–52; 34", "sub": "A view of the Promised Land and the end of Moses' journey.", "s": "From Mount Nebo Moses saw the land to which he had led the people. Deut 34 closes the Pentateuch with the account of his death.", "k": ["Deut 32:48–52 and Deut 34 present the last stage of Moses' life. At God's command he climbs Mount Nebo, the peak of Pisgah opposite Jericho, and from there he surveys the broad land: Gilead, the Negev, the Jordan valley, as far as the distant hills. The text says that he did not enter the land, and his grave remained unknown. The story ends with the mourning of the people and the handing over of leadership to Joshua. It is the closing of the Pentateuch, full of solemnity and gratitude.", "Traditionally Mount Nebo is identified with Ras Siyagha, a peak about 800 m above sea level, located in Jordan, about 10 km west of Madaba. The location is traditional, not certain. From this point, in good weather, one can see the Jordan valley, the northern part of the Dead Sea and the area around Jericho. The relative height above the valley is more than 1,100 m, which gives a wide panorama and at the same time clearly separates the observer from the land lying below. The significance of geography here is exceptional: the place was chosen not by chance, but because it offers a view of the whole land of promise. From the reader's perspective, Nebo shows that the journey ends not in triumph, but in trust that the promise will be fulfilled in the next generation. Deut 34 also recalls that Moses was about 120 years old, and his strength had not left him to the very end."], "j": "Imagine a broad, stony summit with low shrubs, from which one can see below the shining line of the Jordan and a vast yellow-brown plain. Beyond it the gentle outlines of the mountains of Judea take shape, and in the distance a band of blue water can be seen. On the summit stands a solitary figure, seen from afar and from behind. This is an artistic reconstruction, not an exact re-creation of the scene.", "d": "Ras Siyagha is about 800 m above sea level and rises more than 1,100 m above the Jordan; the identification with Mount Nebo is traditional.", "img": "img/c3m12.webp"}, {"id": "c4m1", "c": 4, "ct": "The Promised Land", "n": "Crossing the Jordan and Gilgal", "lat": 31.84, "lon": 35.54, "ref": "Josh 3–5", "sub": "The nation crosses the river on dry ground and pitches its first camp in Canaan.", "s": "In spring, when the Jordan was in flood, the priests with the Ark stepped into the water, and the current stopped. At Gilgal twelve stones were set up in memory of that day.", "k": ["The Book of Joshua describes how the Israelites camped at Shittim, and then moved toward the river opposite Jericho, at the season of the spring floods. The priests carrying the Ark of the Covenant stepped into the water first, and the current stopped, so that the whole people crossed on dry ground. Twelve stones were taken from the riverbed, one for each tribe, and set up at Gilgal. The place became the first camp in Canaan, the site of circumcision and of the celebration of the Passover. Tradition places Gilgal east of Jericho, though the exact location remains disputed.", "The Jordan is not a wide river, but at the time of the spring thaw its valley turns into a thicket of reeds, mud and swift current. The river flows through a deep rift valley, below sea level, and its banks are covered with dense vegetation. Moving a whole people with their belongings across was therefore a serious challenge. On the western side waited a belt of desert hills, which led toward Jericho and then up onto the plateau. For this reason the crossing also had a strategic dimension: whoever controlled the ford controlled the entrance to the whole land."], "j": "Imagine a broad, fertile valley where the river winds between green thickets. In spring the water is murky and swift, and crowds of people with animals stand on both banks. In front are the priests with the Ark carried high, and behind them families. On the horizon the pale hills of Judea take shape, and far to the west, in the morning mist, the outline of Jericho can be seen. This is an artistic reconstruction, based on the description of the valley's landscape.", "d": "The Jordan valley lies about 390 m below sea level, and the river here is only a few dozen meters wide.", "img": "img/c4m1.webp"}, {"id": "c4m2", "c": 4, "ct": "The Promised Land", "n": "Jericho", "lat": 31.871, "lon": 35.444, "ref": "Josh 2; 6", "sub": "The first city of Canaan, which fell after seven days of marching around its walls.", "s": "Jericho guarded the road from the Jordan valley up to the plateau. After seven days of marching with the Ark and the sound of horns, the city walls collapsed.", "k": ["Joshua sent two spies to Jericho, whom Rahab, a woman of the city, hid. Later the whole people circled the walls for six days, and on the seventh day seven times, with priests blowing horns. At the sound of a shared shout the walls fell, and the city fell into the hands of the Israelites. Rahab and her family were saved and joined the people. The story stresses that victory is a gift, not the fruit of strength. Jericho is identified with the tell of Tell es-Sultan, and the dating of its layers is a subject of debate among scholars.", "Jericho lay beside an abundant spring, in an oasis in the midst of the desert, and it is one of the oldest known cities in the world. For this reason it was called the City of Palms. From here roads led west, through steep, dry ravines toward Jerusalem and Bethel, and east, through the ford on the Jordan. Whoever took Jericho opened for himself the way onto the highland plateaus of Canaan. For newcomers from the desert it was therefore the natural first task, and at the same time the symbolic beginning of settling the land."], "j": "See a small but strongly fortified city on a low hill, surrounded by groves of palms and fields watered by the spring. Walls of sun-dried brick rise several meters, and behind them the flat roofs of houses can be seen. All around spreads the pale, parched desert, and in the distance rocky slopes rise. The artistic reconstruction combines knowledge of the tell with the description of the oasis.", "d": "Jericho lies about 250 m below sea level and is among the lowest-lying cities in the world.", "img": "img/c4m2.webp"}, {"id": "c4m3", "c": 4, "ct": "The Promised Land", "n": "Ai", "lat": 31.917, "lon": 35.267, "ref": "Josh 7–8", "sub": "Defeat because of Achan's sin, and victory by ambush.", "s": "The first attack on Ai ended in defeat when someone broke the ban on taking plunder. The second, with an ambush hidden behind the city, brought victory.", "k": ["After the fall of Jericho, Joshua sent a small detachment against Ai, but the Israelites had to flee. The cause was the hidden guilt of Achan, who had kept for himself items placed under the ban. When the matter came to light and the culprit was punished, Joshua prepared a second attack. Part of the army was hidden in ambush to the west of the city, while the rest pretended to flee. The inhabitants rushed out of the gates in pursuit, and the ambush took the city and set it on fire. Ai is traditionally identified with et-Tell, though archaeologists dispute this identification.", "Ai lay high on the edge of a mountainous plateau, near Bethel, and the road from Jericho led there by a steep, difficult climb through dry ravines. The difference in elevation between the Jordan valley and this place is several hundred meters, which explains why the first ascent was so exhausting. The surrounding area is full of narrow valleys and rocky folds, ideal for hiding an ambush. For commanders this meant making use of the terrain, not just numerical strength, and the tactics of the second battle rest on exactly this."], "j": "Imagine a rocky ridge covered with bushes, with a small walled town on the summit. All around stretch narrow gullies in which a detachment could easily hide. The road uphill winds among stones, and over everything hangs a dry, bright sky. This is an artistic reconstruction, based on the shape of the terrain.", "d": "The distance from Jericho to Ai is about 20 km, with a climb of about 900 m.", "img": null}, {"id": "c4m4", "c": 4, "ct": "The Promised Land", "n": "Shechem, Ebal and Gerizim", "lat": 32.213, "lon": 35.28, "ref": "Josh 8:30–35; 24", "sub": "Two mountains above a valley, where the people heard the blessings and the warnings.", "s": "After the victory at Ai, the people gathered between Mount Ebal and Mount Gerizim to hear the Law. At the end of his life Joshua renewed the covenant here.", "k": ["The Book of Joshua describes a ceremony in the heart of the land. After the capture of Ai, the people gathered between two mountains: part stood at the foot of Gerizim, part at the foot of Ebal. Joshua built an altar and read out the words of the Law, incl
