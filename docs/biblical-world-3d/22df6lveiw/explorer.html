uding the blessings and the warnings. Many years later, near the end of his life, he again called all the tribes together at Shechem and asked them to choose whom they wished to serve. The people answered that they would serve the Lord, and Joshua recorded this as a renewal of the covenant.", "Shechem lies in a natural pass between two massive mountains and controlled an important crossroads in the center of the land. The valley between Ebal and Gerizim is narrow, and sound carries here very well, which made it easy for a large number of people to gather together. The place was also close to the old patriarchs, for Abraham and Jacob had stopped here centuries before. That is why Shechem became the natural place to recall that the promise reaches deeper than the mere taking of the land."], "j": "Imagine a greenish, fertile valley above which, on two sides, gentle but tall mountains rise. Sheep graze on the slopes, and between them runs a road with merchant caravans. On one side the hills are covered with stone terraces, on the other with rock. The artistic reconstruction combines the biblical description with the appearance of the valley today.", "d": "Mount Ebal rises about 940 m above sea level, and Gerizim about 880 m; the valley between them is only about 500 m wide.", "img": null}, {"id": "c4m5", "c": 4, "ct": "The Promised Land", "n": "Gibeon", "lat": 31.85, "lon": 35.185, "ref": "Josh 9–10", "sub": "A deceitful alliance, the battle at Gibeon, and a day that grew longer.", "s": "The people of Gibeon made a treaty with the Israelites by trickery, and were then attacked by a coalition of kings. Joshua came to their aid in a night march.", "k": ["The Gibeonites, seeing the fate of Jericho and Ai, came to the camp at Gilgal in worn-out clothes, pretending to be travelers from a distant country. The Israelites made a treaty with them, and when the trick came to light, they did not break their oath. Soon five kings attacked Gibeon. Joshua set out from Gilgal on a night march, surprised the enemies and defeated them. Tradition describes the day as lengthening until the end of the pursuit, and a hailstorm completed the defeat of the adversaries. The author stresses that it was not strength, but God's intervention that decided the outcome.", "Gibeon lay on the western edge of the plateau, not far from Jerusalem, beside an important road leading from the hills down to the lowland. From Gilgal it took a whole night's march uphill, which means about 30 km along a steep, stony route. The further pursuit ran downhill through Beth-horon, a narrow pass where fleeing enemies found it hard to scatter. This region formed a transitional belt between the hills and the lowland Shephelah, so whoever controlled it held the key to both worlds."], "j": "See a hill crowned by a city with stone walls, surrounded by terraces of vineyards and olive trees. Life bustles all around: carts, flocks, merchants. Below, in the valley, clouds of dust can be seen as an army approaches. The sky is brightened, and the light falls long on the slopes. This is an artistic reconstruction, based on the description and on study of the terrain.", "d": "Gibeon lies about 9 km northwest of Jerusalem and about 800 m above sea level.", "img": "img/c4m5.webp"}, {"id": "c4m6", "c": 4, "ct": "The Promised Land", "n": "Shiloh", "lat": 32.055, "lon": 35.29, "ref": "Josh 18–19; 1 Sam 1–4", "sub": "The site of the Tabernacle and the casting of lots for the twelve tribes.", "s": "At Shiloh the Tabernacle was set up, and Joshua assigned the rest of the land to seven tribes. The place became the religious center of the land for many generations.", "k": ["When the army had settled in the land, the Tent of Meeting was set up at Shiloh, and the assembly of the whole people took place there. Joshua noticed that seven tribes still had no allotments. So he sent three men from each of them to describe the land, and then, before the Lord, lots were cast and each tribe received its own territory. Judah and Joseph (Ephraim and Manasseh) had received their allotments earlier, and the Levites received cities among the other tribes. Later Eli served at Shiloh, and Samuel as a boy.", "Shiloh lies in the heart of the land, in the hill country of Ephraim, in a valley hidden among low hills, not far from the main north–south route. From Shiloh to Shechem is about 18 km, and to Jerusalem about 31 km. Such a central position made it easier for pilgrims from different directions to reach the yearly festivals. The division of the land reflected geography: the north had fertile valleys, the hills of Ephraim had pastures and vineyards, and the south had drier hills. The twelve tribes thus received very different conditions of life."], "j": "Imagine a small hill above a greenish valley, on which stands a large tent covered with skins, surrounded by a courtyard. All around are smaller tents of pilgrims and stone enclosures. In spring and autumn crowds gather here. This is an artistic reconstruction, since we know the exact appearance of the Tabernacle at Shiloh only from descriptions.", "d": "Shiloh lies about 600 m above sea level and about 31 km north of Jerusalem.", "img": null}, {"id": "c4m7", "c": 4, "ct": "The Promised Land", "n": "Taanach and Megiddo", "lat": 32.585, "lon": 35.185, "ref": "Judg 4–5", "sub": "The battle by the Kishon brook and the victory of Deborah and Barak over Sisera's chariots.", "s": "Deborah called Barak to fight Sisera, commander of the Canaanite chariots. A downpour turned the valley into mud and kept the enemy from maneuvering.", "k": ["The prophetess and judge Deborah, from the hill country of Ephraim, called Barak to gather men from Naphtali and Zebulun. Sisera, commander of King Jabin's army, had nine hundred iron chariots and assembled them at the Kishon. When Barak set out from Tabor, the Lord threw the enemy into confusion, and the valley turned to mud. The Song of Deborah mentions a flooding brook that swept the chariots away. Sisera fled on foot and died in Jael's tent. In the text, Taanach and Megiddo are described as the site of the battle.", "Taanach and Megiddo guarded the passes from the Jezreel Valley toward the coast. One of the most important roads of the ancient world, linking Egypt with Mesopotamia, ran through Megiddo, which made the place the scene of battle again and again. The Jezreel Valley is a broad plain with rich, heavy soil that turns to mud after a downpour. Chariots, fearsome on hard ground, were helplessly stuck here. Geography thus became an ally of the weaker side."], "j": "See a broad, green plain under a heavy, dark sky. At its edge rise two fortified hills with towns, and in the valley wooden chariots with horses are stuck fast. Streams of mud flow toward the brook, and Mount Tabor can be seen in the distance. This is an artistic reconstruction, based on the description of the valley's landscape.", "d": "Taanach and Megiddo are about 8 km (5 mi) apart, and the Jezreel Valley is about 20 km (12 mi) wide.", "img": "img/c4m7.webp"}, {"id": "c4m8", "c": 4, "ct": "The Promised Land", "n": "Mount Tabor", "lat": 32.687, "lon": 35.39, "ref": "Judg 4:6–14", "sub": "A lone, dome-shaped mountain from which Barak set out for battle.", "s": "On Mount Tabor, Barak gathered ten thousand men from Naphtali and Zebulun. From here, in the rain, he went down into the valley to meet Sisera's chariots.", "k": ["Deborah instructed Barak to gather ten thousand men on Mount Tabor. When Sisera learned of this, he drew his chariots to the Kishon. Then Deborah told Barak that the day had come when the Lord would give his enemies into his hand. Barak came down the slope with his troops and struck the enemy. Tabor marked the border between the territories of Zebulun, Naphtali and Issachar, so it served as a natural gathering place for the tribes.", "Tabor rises alone from the plain like an enormous, rounded dome. From its summit one can see the whole Jezreel Valley, the hills of Galilee and the foothills of Carmel. This position provided an excellent vantage point, and the slope shielded the army from a chariot charge, since chariots could not drive uphill. Coming down the mountain gave the Israelites the advantage of momentum, while the mud below deepened the enemy's confusion."], "j": "Imagine a symmetrical mountain, covered with oaks and shrubs, rising majestically above a flat valley. On the slopes you can see paths and a small gathering of people. Far below, clouds of dust or rain drift past. The artistic reconstruction is based on the mountain's appearance today.", "d": "Tabor rises about 588 m (1,929 ft) above sea level and about 400 m (1,300 ft) above the surrounding plain.", "img": null}, {"id": "c4m9", "c": 4, "ct": "The Promised Land", "n": "The Spring of Harod", "lat": 32.55, "lon": 35.33, "ref": "Judg 6–7", "sub": "Gideon sets out against the Midianites with three hundred warriors.", "s": "At the spring of Harod, Gideon reduced his army from thirty-two thousand to three hundred. By night these warriors shattered the Midianite camp with the sound of trumpets and blazing torches.", "k": ["The Midianites and their allies invaded the land every year at harvest time, leaving the Israelites in poverty. Gideon of Ophrah was called to be a judge. He gathered an army, but the Lord told him to reduce it. First the fearful were sent home, then the men were tested by how they drank water from the spring, until three hundred remained. At night Gideon divided them into three companies and gave them trumpets, empty jars and torches. At the agreed signal they smashed the jars and blew the trumpets, and the enemy fled in panic.", "The spring of Harod lies at the foot of Mount Gilboa, on the edge of the Jezreel Valley, and the Midianite camp stood north of it, in the valley below the hill of Moreh. From this spot the road to the Jordan, about 15 km (9 mi) to the east, lay open to the fleeing. Gideon used the darkness of night, the breadth of the valley and the echo to give the impression of a vast army. The narrow passes and the edges of the hills drove the fugitives toward the fords of the river."], "j": "See a quiet night over the valley. A spring flows out at the foot of a rocky slope, and far off in the valley hundreds of campfires of the Midianite camp flicker, with camels lying scattered like dark patches. Sudden torchlights appear on the hills. An artistic reconstruction, based on the description of the night and the terrain.", "d": "The distance from the spring of Harod to the Jordan is about 15 km (9 mi), and according to the text the Midianite camp numbered hundreds of thousands of men and camels.", "img": "img/c4m9.webp"}, {"id": "c4m10", "c": 4, "ct": "The Promised Land", "n": "Timnah", "lat": 31.78, "lon": 34.92, "ref": "Judg 14", "sub": "A Philistine city where Samson fell in love with a woman and posed a riddle.", "s": "Samson of Zorah went down to Timnah to marry a young Philistine woman. At the feast he posed a riddle to the guests, which set off a series of conflicts with the Philistines.", "k": ["Samson came from the tribe of Dan, from the town of Zorah. When he grew up, he saw a young Philistine woman in Timnah and asked his parents to get her for him as a wife. On the way to Timnah he killed a lion with his bare hands, and later found honey in its remains. At the wedding feast he made a riddle of this for thirty guests, wagering garments. When the answer came out through his wife, Samson flew into a rage and began a series of deeds that unleashed open war with the Philistines.", "Timnah lay in the Sorek Valley, about 5 km (3 mi) from Zorah, on the border between the hills of Judah and the coastal lowland. It was a borderland where Israelites and Philistines met, traded goods and intermarried. The Sorek Valley formed a natural corridor from the coast into the mountains. That is why all the tensions between the two peoples played out in places just like this, and the story of Samson shows this world of borders well."], "j": "Imagine a wide valley with gentle slopes, with grain fields, vineyards and a small town on a hill. Farmsteads dot the surroundings, and shepherds and carts can be seen on the roads. In the distance, to the east, the rocky hills of Judah rise. This is an artistic reconstruction, based on the description of the borderland.", "d": "Timnah (Tel Batash) is about 5 km (3 mi) from Zorah and about 25 km (15 mi) from the sea.", "img": null}, {"id": "c4m11", "c": 4, "ct": "The Promised Land", "n": "Gaza", "lat": 31.5, "lon": 34.467, "ref": "Judg 16", "sub": "A Philistine city from which Samson carried the gates up to a hilltop.", "s": "When the Philistines shut the gates of Gaza to catch Samson, he tore them out along with the posts and carried them toward Hebron. Later, in Gaza, he was captured and imprisoned.", "k": ["Samson came to Gaza, where the Philistines shut the city gates, planning to catch him at dawn. In the middle of the night he got up, tore out the gates along with the posts and carried them to the top of the hill facing Hebron. Later Delilah, a woman from the Sorek Valley, betrayed his secret, and the Philistines seized him, blinded him and took him down to Gaza. Imprisoned, he worked at the mill, until in the temple of Dagon, during a festival, he asked the Lord for one last measure of strength and brought down the pillars, dying together with his enemies.", "Gaza lay at the southern end of the coastal plain, about 5 km (3 mi) from the sea, on the great road linking Egypt with Syria and Mesopotamia. It was one of the largest Philistine cities, rich from trade. The distance from Gaza to Hebron is about 60 km (37 mi), the last twenty-odd kilometers steeply uphill. Samson's feat was therefore not only a miracle of strength but also a symbol of the city's humiliation, whose gates were carried right up to the hills of Judah."], "j": "See a fortified city on a sandy hill, surrounded by palm groves and gardens. The walls of brick and stone are broad, and within them stands a massive gate with wooden doors. Beyond the city stretch the plain and the distant sea, and gentle hills rise in the far distance. This is an artistic reconstruction based on what is known about Philistine cities.", "d": "Gaza lies about 5 km (3 mi) from the Mediterranean Sea and about 60 km (37 mi) from Hebron.", "img": "img/c4m11.webp"}, {"id": "c4m12", "c": 4, "ct": "The Promised Land", "n": "Bethlehem", "lat": 31.704, "lon": 35.2, "ref": "Ruth 1–4", "sub": "The barley fields where Ruth met Boaz, and the beginning of David's line.", "s": "Ruth, a Moabite woman, returned with her mother-in-law Naomi to Bethlehem at the time of the barley harvest. She gleaned in the field of Boaz, who married her and became the grandfather of Jesse.", "k": ["Because of famine, Elimelech and his family left Bethlehem and settled in Moab. After the death of her husband and sons, Naomi decided to return, and her daughter-in-law Ruth went with her. In Bethlehem the barley harvest was beginning. Ruth went out to the fields to glean, and happened upon the field of Boaz, a relative of Naomi. Boaz saw to her safety, and after fulfilling the requirements of the law, he married her. From their family was born Obed, the father of Jesse, and thus the grandfather of King David.", "Bethlehem lies on a ridge of the hills of Judah, about 8 km (5 mi) south of Jerusalem, at an elevation of about 770 m (2,526 ft) above sea level. The area is fertile, but the transition from fields to desert is short here, which explains both the periodic famines and the pastoral tradition. The hillsides form terraces of barley and wheat, and farther down, toward the Dead Sea, the Judean Desert begins. The road from Hebron to Jerusalem ran through Bethlehem."], "j": "Imagine golden barley fields on terraces, harvested by hand by reapers. Women gather the ears of grain, carrying them in bundles, and in the background you can see the small stone houses of the hilltop town. Olive and fig trees grow all around, and farther off pale slopes rise. An artistic reconstruction, based on the landscape of the area today.", "d": "Bethlehem lies about 770 m (2,526 ft) above sea level and about 8 km (5 mi) from Jerusalem.", "img": null}, {"id": "c5m1", "c": 5, "ct": "The Kingdom of Israel", "n": "Gibeah of Saul", "lat": 31.8283, "lon": 35.2269, "ref": "1 Sam 10; 1 Sam 13–15; 1 Sam 22", "sub": "The modest seat of Israel's first king on a hill of Benjamin.", "s": "Gibeah was Saul's hometown and his first capital. From here he ruled, and from here he set out to fight the Philistines and the Amalekites.", "k": ["The Book of Samuel tells that Saul, son of Kish of the tribe of Benjamin, was anointed by the prophet Samuel and proclaimed king. He did not, however, move into a palace: he returned to Gibeah, where he governed among shepherds and farmers. His court was modest, and his power rested on constant readiness for war. When the Philistines threatened the land, he gathered volunteers from around Gibeah and Michmash. In time his relations with Samuel and with the young David soured, which the biblical authors present as the drama of a rejected ruler. What matters for the reader is that the Book of Samuel does not hide the tensions: the king could be uncertain and fearful, and his decisions brought disputes with the prophet.", "Gibeah lay on a mountain ridge about 5 km (3 mi) north of what would later be Jerusalem, beside the road running along the central highlands from south to north. This hill of Benjamin was a lookout point: from here one could see Jerusalem, the valleys descending toward the Jordan, and the movements of armies coming from the west. Narrow passes, such as neighboring Michmash, allowed a small army to hold off a far larger opponent. This explains why the first king chose a defensible place rather than a trading center. A place like this explains well the style of the first government: a small capital, closeness to the fields, and constant vigilance against a threat that could come from any side."], "j": "The traditional location points to Tell el-Ful, a flat-topped mound above present-day Jerusalem. The artistic reconstruction shows a small fortress with a thick wall of undressed stones, a corner tower and a few clay houses. All around stretch terraces of barley, olive trees and flocks of sheep. Over everything hangs the dust of the mountain road, and in the distance the ridges of Judah can be seen. Above it all you can sense a stark simplicity: no columns, no marble, only solidity and the smoke of hearth fires.", "d": "The hill stands about 840 m (2,756 ft) above sea level; the distance to Jerusalem is about 5 km (3 mi).", "img": null}, {"id": "c5m2", "c": 5, "ct": "The Kingdom of Israel", "n": "The Valley of Elah", "lat": 31.6963, "lon": 35.0392, "ref": "1 Sam 17", "sub": "The field of David's clash with Goliath, between Socoh and Azekah.", "s": "In the Valley of Elah the armies of the Philistines and the Israelites assembled. The young shepherd David took up a duel here that became a symbol of courage against a stronger opponent.", "k": ["According to the Book of Samuel, the Philistines gathered their armies at Socoh in Judah, and Saul drew up the Israelites on the other side of the Valley of Elah. For many days the giant Goliath came out from the enemy camp, challenging the Israelites to fight. David, who had brought food to his brothers, could no longer bear to watch this humiliation. He rejected Saul's armor, took his staff, his sling and a few smooth stones from the brook. He defeated his opponent, and the Philistines fled toward Gath and Ekron, pursued by the Israelites. The story also has a symbolic dimension, but its setting is very concrete: two armies, one valley, and a local brook from which the stones came.", "The Valley of Elah, today Wadi es-Sant, is a natural boundary between the Shephelah and the hills of Judah. It runs from east to west and opens to the Philistines the road from the coastal plain toward Bethlehem and Hebron. The slopes are gentle, and the broad valley floor is strewn with stones, which explains the motif of the sling. For the Israelites, control of this valley meant the defense of the hill country. Archaeologists are studying a fortified city from David's time nearby, Khirbet Qeiyafa, but its connection to the duel itself remains a matter of debate. Geography thus suggests why this valley kept returning in history: whoever stood on the hill could see the enemy's movements, and whoever went down to the floor exposed himself to fire."], "j": "The artistic reconstruction shows a wide valley with a shallow, stony brook in the middle. On one slope stands the Philistine camp with tents and bronze shields, and on the other a simpler Israelite encampment with olive groves. Between them, far off, two tiny figures can be seen facing each other. The air is dry, the light harsh, and spreading terebinth trees grow over the valley. The rest of the picture is the stillness before the clash: the clink of metal, the snorting of animals and the short shouts of commanders carry far.", "d": "From Khirbet Qeiyafa to Jerusalem is about 30 km (19 mi); the valley is about 2–3 km (1–2 mi) wide.", "img": "img/c5m2.webp"}, {"id": "c5m3", "c": 5, "ct": "The Kingdom of Israel", "n": "Hebron", "lat": 31.5326, "lon": 35.0998, "ref": "2 Sam 2–5; Gen 23", "sub": "David's first capital as king of Judah.", "s": "At Hebron David was anointed king of Judah, and later of all Israel. He ruled from here for about seven and a half years.", "k": ["After Saul's death, David asks God where he should go, and sets out for Hebron. The elders of Judah anoint him here as king of their tribe, while the north remains with the house of Saul. Years of civil war follow, until the murder of the commander Abner and of King Ish-bosheth. Then representatives of the tribes come to Hebron and acknowledge David as ruler of all the Israelites. The Book of Samuel reports that he reigned in Hebron for about seven and a half years, and later moved to Jerusalem. Hebron remains important later as well: it is here that Absalom will declare his revolt against his father, and the city will long keep its significance for the tribe of Judah.", "Hebron lies about 30 km (19 mi) south of Jerusalem, at an elevation of about 930 m (3,051 ft) above sea level, the highest of all the large cities of Judah. The surrounding country is fertile: vineyards, olive groves and pastures gave the city its wealth, and the nearby cave of Machpelah is associated with the tombs of the patriarchs. From Hebron roads led toward Beersheba and the Negev and toward the coast. For David, who came from the tribe of Judah, it was a natural home base, but too far from the northern tribes to rule the whole land. The choice of place shows the first phase of David's reign, when he relied on his own tribe and friends in the south, before he built a state embracing the whole land."], "j": "The artistic reconstruction shows a town on a hillside, with stone houses crowded close together, narrow lanes and a square by the gate where the elders gathered. Around it are cascades of terraces with grapevines, olive groves and herds of goats. The backdrop is the pale limestone hills of Judah, and the air is cooler than in the desert to the east. In the evening smoke rises from the chimneys, and from below come the voices of shepherds calling their flocks into the pens.", "d": "The distance to Jerusalem is about 30 km (19 mi); elevation about 930 m (3,051 ft) above sea level.", "img": null}, {"id": "c5m4", "c": 5, "ct": "The Kingdom of Israel", "n": "The City of David in Jerusalem", "lat": 31.774, "lon": 35.2352, "ref": "2 Sam 5–6; 1 Chr 11", "sub": "The Jebusite stronghold that became the capital of all Israel.", "s": "David captured Zion, the Jebusite stronghold, and called it his city. He brought the Ark of the Covenant there, making Jerusalem the political and religious center.", "k": ["After being crowned over all Israel, David turns against Jerusalem, which the Jebusites still held. The inhabitants felt safe behind their walls, but David's troops entered the city through the so-called water shaft; the Hebrew text uses a rare word here whose meaning scholars debate. David garrisons the stronghold, builds walls around it and calls it the City of David. Then he brings the Ark of the Covenant here with great joy, dancing before it. Jerusalem becomes the political and religious capital. In this story the moving of the Ark joins power and worship: the king not only captures the city, but makes it the place toward which the whole people turns.", "The choice was deliberate. Jerusalem lies on the border between Judah and Benjamin, so it favored neither side. The narrow ridge between the Kidron and Tyropoeon valleys was easy to defend, and the Gihon spring at its foot gave a constant water supply. The city stood away from the main trade routes, which protected it from danger but required access roads. David gained a capital that was neutral among the tribes and secure militarily. Note the order: first the stronghold and walls, then the sanctuary, and only years later the temple, which shows the gradual maturing of the capital."], "j": "The artistic reconstruction shows a tightly built ridge, descending in terraces toward the Kidron Valley. Stone houses rise one above another, and above them stands a fortified citadel. On the eastern side a path runs to the Gihon spring, where women fill their jars. In the background, to the north, a still empty plateau can be seen, where the temple was later built. The whole gives the impression of a dense settlement stretched along the ridge, full of the smells of smoke, herbs and sun-warmed stone.", "d": "The area of the ancient city was about 5 ha (12 acres); the Gihon spring is about 100 m (330 ft) from the top of the hill.", "img": "img/c5m4.webp"}, {"id": "c5m5", "c": 5, "ct": "The Kingdom of Israel", "n": "Rabbah of the Ammonites", "lat": 31.9522, "lon": 35.9338, "ref": "2 Sam 10–12", "sub": "The city besieged by Joab, where David's drama unfolded.", "s": "During the siege of Rabbah, the Ammonite capital, David stays in Jerusalem and sins against Uriah. The prophet Nathan shows him his guilt.", "k": ["When the king of the Ammonites insulted David's envoys, war broke out. Joab, the commander of the army, besieged Rabbah, the Ammonite capital, while David remained in Jerusalem. There the events with Bathsheba and Uriah the Hittite took place, whom the king sent to the front line so that he would die. The prophet Nathan tells a parable and accuses the king. David admits his guilt. Meanwhile Joab captures part of the city, the so-called city of waters, and summons the king to capture the rest himself. These scenes set two worlds side by side: the battlefield, where soldiers carry out orders, and the palace, where the ruler forgets his responsibility for his own deeds.", "Rabbah lay on the hills of present-day Amman, on the other side of the Jordan, about 65 km (40 mi) in a straight line from Jerusalem. The road led down to the Jordan Valley and then steeply up the slopes of Transjordan, which meant two to three days' march for an army. By the springs of the Jabbok River the city had a constant water supply, so a siege was long. This distance explains why the king could remain in the capital while the war was fought far from his eyes. The biblical authors do not hide the shadow over the most famous king, and the geographical description helps us understand how great a distance separated decisions from their consequences."], "j": "The artistic reconstruction shows a fortified hill above a dry valley, with a row of houses clinging to the slope and a wide gate. At the foot, along the brook, stand the tents of the besiegers, and on the walls the helmets of the defenders gleam. The countryside is open, barren, covered with low shrubs and limestone boulders. The air is full of dust and the sound of horn signals, and in the distance flocks of Ammonite shepherds graze.", "d": "The distance to Jerusalem is about 65 km (40 mi) in a straight line; elevation about 800–850 m (2,625–2,789 ft) above sea level.", "img": null}, {"id": "c5m6", "c": 5, "ct": "The Kingdom of Israel", "n": "Solomon's Temple", "lat": 31.778, "lon": 35.2354, "ref": "1 Kgs 5–8; 2 Chr 2–7", "sub": "The first temple on Mount Moriah, built in about seven years.", "s": "Solomon built the temple north of the City of David, bringing cedars from Lebanon and craftsmen from Tyre. Its dedication became an event for the whole nation.", "k": ["The Book of Kings tells that Solomon made an agreement with Hiram, king of Tyre, who supplied cedar and cypress timber and craftsmen. The work took about seven years. The temple consisted of a porch, a main hall and the most holy place, where the Ark of the Covenant stood. The interior was covered with wood and gold, and adorned with carved cherubim, palm trees and flowers. At the dedication Solomon prayed over the people, asking that God would hear those who turn toward this place. The account in the Book of Chronicles stresses David's preparations, who gathered materials and plans, though he himself was not permitted to build the temple.", "The building stood north of the old city, on a hill that tradition connects with Mount Moriah. Solomon had to widen the plateau by building retaining walls around it. Stone was quarried nearby, and timber was floated from Lebanon by sea to Joppa and then hauled up into the hills of Judah, a trek of about 60 km (37 mi) uphill. The very location set the temple apart: it stood higher than the palaces and the city, and was visible from every side. Archaeology has not found the building itself, since later temples stood on its site, so every picture is a reconstruction based on the text and on comparisons with similar buildings of the region."], "j": "The artistic reconstruction shows a rectangular building of pale stone, with two freestanding columns at the entrance and low chambers along the sides. In front of it lies a courtyard with a great altar and a bronze basin resting on the backs of ox figures. The interior remains unseen, hidden behind cedar doors. Workers in the background lay the last blocks of the wall. The golden elements of the interior reflect the light of the lamps, and the scent of cedar and incense pervades the whole courtyard.", "d": "Dimensions of the main hall according to the text: 60 × 20 × 30 cubits, or about 27 × 9 × 13.5 m (89 × 30 × 44 ft).", "img": "img/c5m6.webp"}, {"id": "c5m7", "c": 5, "ct": "The Kingdom of Israel", "n": "Megiddo", "lat": 32.5847, "lon": 35.1847, "ref": "1 Kgs 9:15; 1 Kgs 4:12; 2 Kgs 23:29", "sub": "A fortified crossroads at the entrance to the Jezreel Valley.", "s": "Solomon fortified Megiddo, which guarded the route from Egypt to Mesopotamia. The city changed hands many times and became a symbol of decisive battles.", "k": ["The Book of Kings lists Megiddo among the cities that Solomon built up, together with Hazor and Gezer. This was meant to secure control of the most important trade artery. Alongside barracks and storehouses, gates were erected, and scholarly tradition describes a multi-chambered gate from Solomon's time, though its dating is sometimes disputed. Later, not far from the city, King Josiah died in a clash with Pharaoh Necho (2 Kgs 23). That is why Megiddo has gone down in history as a place of battles. From the biblical perspective, the fortifications served not only war: they made it possible to collect tolls from caravans, ensured supplies and strengthened the ruler's prestige in the eyes of his neighbors.", "Tel Megiddo rises at the edge of the Jezreel Valley, beside a narrow pass through the Carmel hills, about 30 km (19 mi) from the coast. Through this pass ran the coastal route, the Via Maris, linking Egypt with Syria and onward with Mesopotamia. Whoever held this pass could levy tolls and stop armies. Archaeological discoveries confirm that the city existed continuously for millennia, with traces of destruction and rebuilding appearing layer upon layer. The name Har-Magedon (Armageddon) in the Book of Revelation, written in its Greek form, refers back to this hill, though its exact understanding remains a subject of study by exegetes."], "j": "The artistic reconstruction shows a tall, oval mound above a green plain, surrounded by stone walls and a gate with several guard chambers. Inside you can see barracks and large structures that scholars interpret as stables or storehouses. On the road at the foot, a caravan of donkeys and camels walks, and in the distance the ridge of Carmel gleams. Roads run at the foot of the wall like broad ribbons, and among the fields small villages dependent on the city can be seen.", "d": "The mound rises about 60 m (200 ft) above its surroundings; about 30 distinct layers of settlement.", "img": "img/c5m7.webp"}, {"id": "c5m8", "c": 5, "ct": "The Kingdom of Israel", "n": "Hazor and Gezer", "lat": 33.0178, "lon": 35.5681, "ref": "1 Kgs 9:15–17; Josh 11:10", "sub": "The largest city of Canaan and its counterpart in the west.", "s": "Solomon rebuilt Hazor in the north and Gezer in the west as watchtowers of the kingdom. Gezer was captured by Pharaoh and given to his daughter, Solomon's wife.", "k": ["The text of the First Book of Kings links three cities: Hazor, Megiddo and Gezer. Solomon rebuilt all of them as part of a program of fortification. Gezer, according to the narrative, was captured by Pharaoh, who burned the city and gave it to his daughter as a dowry. Solomon rebuilt it anew. These three points formed a system of defense and taxation, and at the same time showed that the kingdom had formed ties with neighboring powers, including Egypt. It is worth remembering that this is an overall picture: the Bible describes here the king's building plan, and archaeologists compare it with the layers of walls and gates discovered in the three cities.", "Hazor lay in the north, above the Huleh Valley, about 15 km (9 mi) north of the Sea of Galilee. It was a great hub where roads from Damascus, Phoenicia and Egypt converged. The upper city occupied less than 10 ha, but the lower city, according to research, about 70 ha, which made it the largest center of Canaan. Gezer, for its part, guarded the western road to Jerusalem, running through the Shephelah. Both cities lay on the edges of the kingdom, where the question of borders was settled. Gezer also shows relations with Egypt: marriage to the daughter of a pharaoh was regarded as an honor, and her dowry was a real political gesture toward the young kingdom."], "j": "The artistic reconstruction shows a flat mound above a valley, with a massive wall surrounding the upper city. Against the backdrop of the dark hills of Galilee a gate with towers can be seen, and beyond it broad wheat fields. Before the gate merchants bustle with heavy sacks, soldiers guard the entrance, and smoke rises from the chimneys. As the sun sets, the walls take on a ruddy color, and the guards light torches on the towers.", "d": "The lower city of Hazor about 70 ha (173 acres); the distance to Dan is about 20 km (12 mi).", "img": null}, {"id": "c5m9", "c": 5, "ct": "The Kingdom of Israel", "n": "Dan and Bethel", "lat": 33.2487, "lon": 35.6522, "ref": "1 Kgs 12:25–33", "sub": "Jeroboam's two sanctuaries at the ends of the northern kingdom.", "s": "After the kingdom divided, Jeroboam set up golden calves at Dan and Bethel so that the people would not go up to Jerusalem. The Bible judges this as sin.", "k": ["After Solomon's death, his son Rehoboam rejected the request for lighter taxes, and the northern tribes chose Jeroboam as king. He feared that pilgrimages to Jerusalem would lead the people to return to the rule of Judah. So he appointed two centers of worship, Bethel on the southern border and Dan on the northern, and set up golden calves in them. The author of the Book of Kings regards this step as a sin that weighed on the kings of Israel for centuries. The division of the kingdom was not only a matter of politics. It was tied to the memory of ancient sanctuaries and to the question of where the people should offer sacrifices and keep the feasts.", "The choice of places made geographical sense. Bethel lies about 17 km (11 mi) north of Jerusalem, on the main road of the hill country, and was a holy place already in the days of the patriarchs. Dan is far in the north, by the sources of the Jordan, about 150 km (93 mi) from Jerusalem. The two sanctuaries covered the whole country and gave pilgrims a substitute for Jerusalem worship closer to home. From the political point of view it was a clever move, showing how closely religion and borders are linked. The prophets of later centuries will return to these two places as an example of true worship mixed with political calculation, and the Books of Kings repeat this judgment many times."], "j": "The artistic reconstruction shows a sanctuary on a rise by the springs, with a raised cultic platform and an altar of hewn stone. Tall trees grow all around and water murmurs, which sets Dan apart from the dry lands of the south. Priests and pilgrims in simple robes approach up the steps, and in the background the snowcapped crest of Mount Hermon can be seen. Even without sculptures and ornaments the place looks solemn, and the sound of the springs fills the whole area.", "d": "Dan: about 150 km (93 mi) in a straight line from Jerusalem; Bethel: about 17 km (11 mi).", "img": null}, {"id": "c5m10", "c": 5, "ct": "The Kingdom of Israel", "n": "Samaria", "lat": 32.2761, "lon": 35.1914, "ref": "1 Kgs 16:23–28; 1 Kgs 20; 2 Kgs 6–7", "sub": "The capital of the northern kingdom, founded by Omri.", "s": "Omri bought the hill from Shemer and built a new capital on it. Samaria became the seat of Ahab and Jezebel and the target of sieges.", "k": ["The Book of Kings reports that Omri bought the hill from Shemer for two talents of silver and built a city on it, which he called Samaria. His son Ahab married Jezebel, daughter of the king of Sidon, and erected a temple of Baal in the capital. The city was besieged several times by the Arameans. The stories of Elisha and the famine in Samaria show how strongly harsh conditions affected the lives of the inhabitants. Finally Samaria fell in 722 BC to Assyria. Samaria later gave its name to the whole region and its inhabitants, and its role in the New Testament, where it appears in the encounters of Jesus and the apostles, reaches many centuries further.", "The choice of the hill was deliberate. It lies in the central hill country, about 10 km (6 mi) northwest of Shechem, at an elevation of about 430 m (1,411 ft) above sea level, with a flat, wide valley all around. The city stood on its own rise, without competition from the old tribal centers, and near the road to the coast and the Jezreel Valley. Archaeologists discovered monumental walls there and ivory ornaments decorating furniture, which agrees with the mention of the house of ivory (1 Kgs 22:39). The text of the Bible describes here not only politics but also a conflict of values: kings sought alliances with their neighbors, while the prophets called for faithfulness to the covenant."], "j": "The artistic reconstruction shows a round hill surrounded by a double wall of well-dressed blocks. On the summit stands a palace with a courtyard, and from the side of the fields a paved road leads up to it. Below stretch barley fields and vineyards, and in the background the gentle hills of Samaria can be seen. The atmosphere is more lavish than at Gibeah. From the walls the wide surroundings are visible, and in the valley farmers work among terraces and olive groves.", "d": "The hill stands about 430 m (1,411 ft) above sea level; purchase price according to the text: 2 talents of silver.", "img": "img/c5m10.webp"}, {"id": "c5m11", "c": 5, "ct": "The Kingdom of Israel", "n": "Mount Carmel", "lat": 32.741, "lon": 35.045, "ref": "1 Kgs 18", "sub": "The site of Elijah's contest with the prophets of Baal.", "s": "On Carmel the prophet Elijah stood before King Ahab and the prophets of Baal. After many years of drought, rain fell on the land.", "k": ["After three years of drought, Elijah calls on King Ahab to gather the people and the prophets of Baal on Mount Carmel. A decision is to be made here: which God is the true one. The prophets of Baal cry out from morning until noon, but no one answers. Elijah rebuilds the altar, lays out the sacrifice and drenches it with water. Only then does he pray, and fire falls from heaven. The people confess faith in the God of Israel. Then the prophet climbs up and prays for rain, while his servant watches for a cloud over the sea. The story also contains a moment of stillness: after the thunder and fire the prophet is weary and discouraged, and the account leads him on into the wilderness and as far as Mount Horeb (1 Kgs 19).", "Carmel is a limestone ridge about 25 km (16 mi) long, running from the coast toward the Jezreel Valley. Its peaks reach about 550 m (1,804 ft) above sea level. From the west comes moist air off the sea, which even in time of drought brings dew and lush vegetation here, which is why Carmel was associated with fertility. From the upper parts one can see both the Mediterranean Sea and the Kishon Valley, where the sentence was later carried out. This explains why precisely this place was chosen. It is one of the most famous scenes of the Old Testament, in which geography, weather and faith form a single coherent story about trust."], "j": "The artistic reconstruction shows a rocky summit covered with oaks, shrubs and wild herbs. On a level spot stands an altar of twelve stones, and around it a crowd of villagers and soldiers gathers. Far behind them a strip of sea shimmers, and on the horizon the first small cloud appears. The wind carries the scent of resin and the moisture off the sea, and the shadows of clouds drift across the slopes.", "d": "A ridge about 25 km (16 mi) long; highest point about 550 m (1,804 ft) above sea level.", "img": "img/c5m11.webp"}, {"id": "c5m12", "c": 5, "ct": "The Kingdom of Israel", "n": "Jezreel", "lat": 32.5586, "lon": 35.3247, "ref": "1 Kgs 21; 2 Kgs 9–10", "sub": "Ahab's summer residence and Naboth's vineyard.", "s": "At Jezreel the crime against Naboth was committed, and later Elijah's prophecy was fulfilled. Joram and Jezebel died here.", "k": ["At Jezreel Ahab had a palace beside Naboth's vineyard. When the king wanted to acquire it, Naboth refused, appealing to the inheritance of his ancestors. Jezebel forged documents, and Naboth was condemned to death. Elijah announced the punishment to Ahab. Years later the prophecy was fulfilled: Jehu, anointed king, rode into Jezreel and killed Joram, and Jezebel was thrown from a window. So ended the dynasty of Omri. This scene closes the cycle of stories about Elijah and Ahab. The prophet foretold the fall of the dynasty, and the events at Jezreel show how severely the violation of the rights of an ordinary man was judged.", "Jezreel lies at the eastern end of the Jezreel Valley, about 20 km (12 mi) from Megiddo, on a small rise overlooking a broad, fertile plain. The valley is the most fertile region of Israel: it runs from Carmel to the Jordan for about 40 km (25 mi). Military and trade roads crossed here, so a ruler living at Jezreel could spot an approaching army in advance. From the tower Jehu could be seen approaching from Ramoth Gilead. The Jezreel Valley appears in the Bible many times, from the days of Gideon to Josiah, and always as a place where the fate of the land is decided."], "j": "The artistic reconstruction shows a fortified palace on a small rise, with a watchtower higher than the walls. At its feet stretch vineyards and wheat fields, and beyond them the broad green valley as far as the mountains of Gilboa. The road runs straight across the plain, making it possible to spot riders approaching from afar. In the evening the valley is covered in golden light, and the roads vanish in the mist rising over the fields.", "d": "The Jezreel Valley is about 40 km (25 mi) long; the distance to Megiddo is about 20 km (12 mi).", "img": null}, {"id": "c6m1", "c": 6, "ct": "Prophets, Exile and Return", "n": "Nineveh", "lat": 36.359, "lon": 43.153, "ref": "Jonah 1–4; Nah 1–3", "sub": "The great capital of Assyria, to which God sends a reluctant prophet.", "s": "Jonah is told to warn Nineveh, but flees in the opposite direction. When at last he preaches, the city repents, and the book teaches that God's mercy reaches even foreign nations.", "k": ["The Book of Jonah tells of a prophet who is to go to Nineveh and warn its inhabitants of judgment. Jonah, however, boards a ship sailing the other way, and a storm and a stay in the belly of a great fish bring him at last to set out obediently. His short call moves the inhabitants to repentance, from the king to the animals. The prophet is surprised, even aggrieved, at God's forgiveness. The book ends with God's question, addressed also to the reader, whether he has no right to take pity on so great a city.", "Nineveh lay on the eastern bank of the Tigris, opposite present-day Mosul in Iraq, about 800 km (500 mi) in a straight line from Jerusalem. On foot this meant many weeks of marching through Syria and northern Mesopotamia. Fertile plains, irrigated with water from the Taurus and Zagros mountains, made it possible to feed an enormous population. From here the armies of Assyria set out westward, toward the coast of the Mediterranean Sea. In going to Nineveh, Jonah was therefore going to the heart of the power that threatened his own nation. The mention of \"a three days' journey\" probably refers to the vastness of the city together with its surrounding settlements."], "j": "The artistic reconstruction shows a city surrounded by mighty walls with great gates, above which rise the terraces of palaces and temples. The walls of the buildings, made of sun-dried brick and faced with stone slabs, were adorned with reliefs of hunting scenes and military campaigns. Before the gate caravans of donkeys bustle, and by the river canals and gardens can be seen. In the distance, on a small hill, stands the tiny figure of a traveler, looking at the immensity of the city.", "d": "The walls of Nineveh from the time of Sennacherib were about 12 km (7.5 mi) in circumference.", "img": "img/c6m1.webp"}, {"id": "c6m2", "c": 6, "ct": "Prophets, Exile and Return", "n": "Samaria", "lat": 32.2778, "lon": 35.1903, "ref": "1 Kgs 16:24; 2 Kgs 17; Amos 3–6", "sub": "The capital of the Northern Kingdom, captured by Assyria in 722 BC.", "s": "Samaria was the capital of Israel, on a hill in the heart of a fertile land. After a three-year siege it fell to the Assyrians, and a large part of its inhabitants were deported.", "k": ["King Omri founded Samaria as a new capital, and his successors, Ahab and the rulers after him, built it up into an impressive city. The prophets such as Amos and Hosea, however, rebuked its inhabitants for injustice toward the poor and for the worship of foreign gods. According to 2 Kgs 17, Shalmaneser V besieged the city for three years, and his successor, Sargon II, according to Assyrian sources, completed the work in 722 or 721 BC. Part of the population was carried off to Assyria and Media, and settlers from other regions were brought into the land. The Northern Kingdom ceased to exist as a state.", "Samaria stood on a lone, oval hill rising about 100 m (330 ft) above the surrounding valleys, in the central hill country of Ephraim. The steep, easily defended position and the fertile fields around explain why the city withstood so long a siege. At the same time it lay near important routes leading from the coast to the Jordan Valley, which made it a tempting target. For Assyria, capturing Samaria opened the way south, toward Judah, and secured the rear of campaigns directed at Egypt. Today the remains lie near the Arab village of Sebastia."], "j": "The artistic reconstruction shows a hill crowned by an acropolis with a royal palace, surrounded by a double wall of cut stone. Below, on terraces, stand houses of stone and wood, and all around are wheat fields, vineyards and olive groves. On a side road a column of captives winds along, guarded by soldiers: a symbol of the tragedy of 722. On the summit of the hill the pale cut stones of the palace gleam, and from the gates merchants with donkeys head toward the valley.", "d": "The hill of Samaria rises about 100 m (330 ft) above the surrounding valley; the siege lasted about 3 years.", "img": null}, {"id": "c6m3", "c": 6, "ct": "Prophets, Exile and Return", "n": "Lachish", "lat": 31.5646, "lon": 34.8478, "ref": "2 Kgs 18:13–17; 2 Chr 32:9; Mic 1:13; Isa 36:1–2", "sub": "The second most important fortress of Judah, captured by Sennacherib in 701 BC.", "s": "When Sennacherib invaded Judah, the besieged Lachish became his headquarters. The capture of this fortress opened the way to Jerusalem for the Assyrians.", "k": ["In the fourteenth year of King Hezekiah's reign, Sennacherib, ruler of Assyria, invaded Judah and captured many of its fortified cities. The Books of Kings and Chronicles describe how his staff halted right at Lachish, from where envoys were sent to Jerusalem demanding surrender. Hezekiah tried to buy peace by sending a heavy tribute, but the Assyrians did not give up. The prophet Isaiah reassured the king, and God promised to save the city. The Book of Micah mentions Lachish in a bitter list of towns that will bear the consequences of sin.", "Lachish lay in the Shephelah, the foothills between the hills of Judah and the coastal plain, about 40 km (25 mi) southwest of Jerusalem. This position made it the guardian of the roads leading up from the coast and from Egypt toward the capital. Whoever took it controlled access to the hills. The Assyrians did not storm the wall at the first rush: they built a great siege ramp of earth and stones, and the defenders answered with a counter-ramp of their own. Archaeology confirms both of these elements. The scene of the capture of the city was also depicted in reliefs in Sennacherib's palace at Nineveh."], "j": "The artistic reconstruction shows the hill of the city girdled with mighty walls and a gate, and on its slope a siege ramp, up which siege towers with battering rams climb. Archers fire on the walls, the defenders hurl down burning torches, and smoke rises over the battlefield. In the background an Assyrian camp with the tents of the commanders can be seen. The scenes are seen from a distance, with no recognizable faces. Beneath the walls are piles of stones, wooden ladders and a few surviving olive trees.", "d": "Distance from Lachish to Jerusalem: about 40 km (25 mi) in a straight line; the siege took place in 701 BC.", "img": "img/c6m3.webp"}, {"id": "c6m4", "c": 6, "ct": "Prophets, Exile and Return", "n": "Hezekiah's Tunnel and Jerusalem in 701 BC", "lat": 31.771, "lon": 35.2355, "ref": "2 Kgs 18–20; 2 Chr 32:2–8, 30; Isa 36–37", "sub": "Jerusalem prepares for a siege, and the water goes underground.", "s": "Hezekiah strengthened the walls and channeled water from the Gihon spring into the city. Jerusalem survived Sennacherib's siege, and the Bible describes this as God's deliverance.", "k": ["When Hezekiah saw that Assyria was drawing near to Jerusalem, he set about fortifying the city. According to 2 Chr 32, he repaired the walls, built additional fortifications and saw to supplies. He also stopped the springs outside the city so that the enemy would have no water, and channeled the water to the inside of the fortifications. The Assyrian envoy called on the inhabitants to surrender, mocking their God, but Hezekiah prayed in the Temple. The Bible says that the Assyrians withdrew from the city, and Sennacherib returned to Nineveh.", "Jerusalem lay on the narrow ridge of the City of David, about 700 m (2,297 ft) above sea level. The only permanent spring, Gihon, flowed outside the walls, in the Kidron Valley, and was vulnerable to seizure by the enemy. So a tunnel about 530 m (1,740 ft) long was cut, which directs the water through a rock channel to the Pool of Siloam inside the walls. It was cut from both ends at once, and the crews met in the middle. A stone inscription from Siloam, discovered in the nineteenth century, tells of this event. Today the tunnel is open to visitors; the water level in it can be high."], "j": "The artistic reconstruction shows a narrow, cramped passage cut in the rock, with ankle-deep water and chisel marks on the walls. In the light of olive-oil lamps a dark stream can be seen flowing toward the pool, and on the surface of the hill the walls and towers of Jerusalem rise. At the mouth of the tunnel the inhabitants draw water in jars, not yet knowing what the next day will bring. The rock smells of dampness, and the coolness of the tunnel contrasts with the heat above.", "d": "Hezekiah's Tunnel is about 530 m (1,740 ft) long, and the difference in level between its ends is only about 30 cm (1 ft).", "img": null}, {"id": "c6m5", "c": 6, "ct": "Prophets, Exile and Return", "n": "Jerusalem in 587 BC", "lat": 31.778, "lon": 35.2354, "ref": "2 Kgs 25; 2 Chr 36:17–21; Jer 39; 52; Lam 1–2", "sub": "The destruction of the city and the first Temple by Nebuchadnezzar's army.", "s": "After a long siege, the Babylonians captured Jerusalem, burned the Temple, and carried off a large part of its inhabitants. The prophet Jeremiah saw in this the result of unfaithfulness, but he also proclaimed hope.", "k": ["The last king of Judah, Zedekiah, rebelled against Babylon, so Nebuchadnezzar marched out with his army and besieged Jerusalem. According to 2 Kgs 25, famine took hold in the city, and when the wall was breached the king tried to flee toward Jericho but was captured. The Babylonians burned the Temple, the palace, and the houses, and tore down the walls. Many of the inhabitants were carried off to Babylonia. Jeremiah, who had earlier warned of such a catastrophe, did not stop speaking about the future: he proclaimed a new covenant and a return. The Book of Lamentations expresses the pain of those days.", "Jerusalem stood on a mountain ridge surrounded by deep valleys, so it could be conquered mainly by starvation. That is why the siege lasted about 18 months. The Babylonian army came from Mesopotamia along the Euphrates, through Syria, and reached the land of Judah after a march counted in weeks. Zedekiah's escape ran toward the Jordan Valley, about 25 km to the east, along a route dropping some 1,000 m to the valley of Jericho. There, on the plain, the Babylonians overtook the fugitives. The scale of the fall is best shown by the difference in elevation between the capital and the desert."], "j": "The artistic reconstruction shows Jerusalem burning at dusk: smoke rises above the ruined temple on the hill, and gaps yawn in the walls. On the slope, Babylonian soldiers move among ladders and siege towers, while a long, slow procession of people carrying bundles leaves the city. The whole scene is seen from a distance, in the reddish light of the fire. Through the breaches in the walls one can see the dark, abandoned Kidron Valley.", "d": "The siege lasted about 18 months; the destruction took place in 587 or 586 BC.", "img": "img/c6m5.webp"}, {"id": "c6m6", "c": 6, "ct": "Prophets, Exile and Return", "n": "Babylon", "lat": 32.5355, "lon": 44.4275, "ref": "Dan 1–6; Isa 13–14; Jer 29; Ps 137", "sub": "The city of exile, where Daniel and his companions remained faithful to their faith.", "s": "In Babylon the people of Judah lived as exiles, while Daniel and his friends served at the royal court. Jeremiah advised the community to build houses and seek the good of the city.", "k": ["The Book of Daniel tells of young men of Judah who were educated in the palace school in Babylon, yet remained faithful to their faith. Daniel interprets the dreams of kings, three friends refuse to worship a statue, and a later account mentions the lions' den. In his letter to the exiles, Jeremiah urged them to build houses, plant gardens, and seek the welfare of the city where they lived. Psalm 137, for its part, conveys the longing by the rivers of Babylon. The community was learning to endure in a foreign world.", "Babylon lay on the Euphrates, about 90 km south of present-day Baghdad, on a flat, fertile plain crossed by a network of canals. The exiles were separated from Jerusalem by about 900 km in a straight line, which meant a journey of several months on foot. The Euphrates supplied water for fields and gardens and also made it possible to trade by boat throughout Mesopotamia. Nebuchadnezzar II expanded the city: he built the Ishtar Gate and the processional way leading to the temple of Marduk. For those who came from the hills of Judea, the flat river landscape must have seemed utterly foreign."], "j": "The artistic reconstruction presents the Ishtar Gate covered with gleaming blue glazed bricks, decorated with rows of lions, dragons, and bulls. A processional way leads up to it, and in the background rises a stepped temple tower, a ziggurat. Merchants, priests, and officials walk along the streets, and palm trees stand by the canal. The figures are seen from a distance, without facial detail. Everything is bathed in the warm, dusty light of midday.", "d": "Distance from Babylon to Jerusalem: about 900 km in a straight line; from present-day Baghdad: about 90 km.", "img": "img/c6m6.webp"}, {"id": "c6m7", "c": 6, "ct": "Prophets, Exile and Return", "n": "The Kebar River", "lat": 32.1267, "lon": 45.2347, "ref": "Ezek 1–3; 10; 37; 40–48", "sub": "A canal in Babylonia where the prophet Ezekiel saw visions of God's glory.", "s": "Ezekiel lived among the exiles by the Kebar canal and received his prophetic calling there. His visions speak of God's presence, which is not confined to a single place.", "k": ["Ezekiel, a priest taken to Babylonia together with King Jehoiachin in 597 BC, begins his book with a vision by the Kebar River. There he saw the heavens opened, a wind, a cloud, and an extraordinary throne, which pointed to God's presence among the exiles. He is commanded to be a watchman for his people, and he proclaims words of judgment first, then of hope. The vision of the valley full of bones that come to life is a picture of the renewal of the community. The book ends with a description of a new Temple and a city where God will dwell.", "The Kebar was not a river in our sense of the word, but an irrigation canal branching off from the Euphrates. It is traditionally sought in the area of the ancient city of Nippur, about 100 km southeast of Babylon; the location is not certain. The exiles established farming settlements here, cultivating fields watered by a network of canals. For a people attached to the Temple in Jerusalem, some 1,000 km away, this was a life-changing experience: God reveals himself in a foreign land too, by the water, among ordinary people, and not only in one place."], "j": "The artistic reconstruction shows a wide canal with clay banks, lined with palms and willows. On the bank stand low mud-brick houses and huts, and people in simple robes draw water or work in the fields. In the distance, the outline of a great city can be seen. The sky is vast and flat, which heightens the sense of distance from the mountains of home.", "d": "The Kebar canal lay about 100 km southeast of Babylon; Jerusalem was about 1,000 km away.", "img": null}, {"id": "c6m8", "c": 6, "ct": "Prophets, Exile and Return", "n": "Rebuilding the Temple in Jerusalem", "lat": 31.778, "lon": 35.2354, "ref": "Ezra 1–6; Hag 1–2; Zech 1–8", "sub": "The first returnees set up an altar, and after years of obstacles complete the second Temple.", "s": "After the edict of Cyrus, the exiles returned to Jerusalem and began rebuilding the Temple under the leadership of Zerubbabel and Joshua. Despite opposition from their neighbors, the building was completed in 516 or 515 BC.", "k": ["In 538 BC, Cyrus, king of Persia, allowed the exiles to return to Jerusalem and rebuild the Temple. According to Ezra 2, about 42,000 people set out under the leadership of Zerubbabel and the high priest Joshua. First the altar was rebuilt, then the foundations were laid. Their neighbors hindered the work, so construction came to a standstill for years. The prophets Haggai and Zechariah encouraged the people to resume the work during the reign of Darius I. The Temple was finished and dedicated in 516 or 515 BC, and the community joyfully celebrated the Passover.", "The road back from Babylonia usually followed an arc of the Fertile Crescent: along the Euphrates to the northwest, then through Syria to the south, about 1,400 km in all. Ezra, who returned several decades later, traveled for about four months according to Ezra 7. The returnees found the city in ruins, shrunk to the ridge of the City of David and the Temple Mount. The new Temple was more modest than the former one; the elders who remembered the old sanctuary wept. Even so, it became the center of a community that would endure for another five centuries."], "j": "The artistic reconstruction shows a hill full of scaffolding, piles of hewn stones, and cedar beams. Workers carry blocks, in the background an altar stands under the open sky, and beside it a low, still unfinished building. Priests in white robes and Levites with instruments stand by the foundations. The whole scene is seen from a distance, in the warm light of morning.", "d": "The road back from Babylonia was about 1,400 km long; the second Temple was completed in 516 or 515 BC.", "img": null}, {"id": "c6m9", "c": 6, "ct": "Prophets, Exile and Return", "n": "Susa", "lat": 32.19, "lon": 48.258, "ref": "Esth 1–10; Neh 1:1; Dan 8:2", "sub": "The winter capital of the Persian kings and the setting of the story of Esther.", "s": "In Susa takes place the story of Esther, a young Jewish woman who becomes queen and saves her people from destruction. Nehemiah, the king's cupbearer, also came from Susa.", "k": ["The Book of Esther tells of a Jewish woman who becomes the wife of King Ahasuerus, probably Xerxes I. Thanks to the counsel of her relative Mordecai, she discovers a plot aimed at her people and courageously appears before the king. The courtier Haman's plan is reversed, and the community celebrates the event as the feast of Purim. The beginning of the book of Nehemiah is also set in Susa: here a young Jew, the king's cupbearer, learns of the fall of the walls of Jerusalem and asks the ruler for permission to go there.", "Susa lay in the fertile plain of Khuzestan, at the foot of the Zagros Mountains, about 350 km east of Babylon. The Persians made it one of their four capitals and the winter residence of the kings, because the city's climate was milder than that of the highlands. From here set out the Royal Road, which linked Susa with Sardis, about 2,700 km to the west. Thanks to it, embassies and orders reached the whole empire. Susa lay close to Persepolis (about 500 km) and at the same time close enough to Mesopotamia to control its busy, wealthy provinces."], "j": "The artistic reconstruction shows a palace with mighty columns topped with bull capitals, high terraces, and walls of glazed brick bearing processions of guards. In the courtyard stand courtiers in long robes, and in the background stretch gardens and the walls of the citadel. The figures are seen from a distance or from behind, in the warm, golden light of afternoon.", "d": "Susa lay about 350 km east of Babylon; the Royal Road from Sardis was about 2,700 km long.", "img": "img/c6m9.webp"}, {"id": "c6m10", "c": 6, "ct": "Prophets, Exile and Return", "n": "Persepolis", "lat": 29.9355, "lon": 52.8916, "ref": "Ezra 1:1–4; 6:1–12; Esth 1:1–3", "sub": "The ceremonial capital of the Persian empire, which allowed the Jews to return.", "s": "The Bible does not mention Persepolis by name, but it describes the empire of which it was a symbol. Thanks to the policy of the Persian kings, the exiles were able to return to their homeland.", "k": ["Persepolis does not appear in the biblical text, but it shows the world in which Ezra, Nehemiah, and Esther lived and acted. The Persian kings, from Cyrus to Artaxerxes, ruled a vast empire from India to Egypt. Ezra 1 and 6 describe the decrees that allowed the Temple to be rebuilt and its costs to be covered from the royal treasury. Historians debate how far the Persian policy of tolerance extended, but documents from the period indicate that the rulers usually respected local cults. Thanks to this, the people of Judah were able to rebuild their community around the Temple.", "Persepolis was founded around 518 BC by Darius I on the Marvdasht plain in the Zagros Mountains, about 500 km southeast of Susa, in the heart of the Persian province of Parsa. It was a ceremonial city, not a commercial one: here embassies from across the empire were welcomed at the New Year festival. The stairways of the Apadana are decorated with reliefs showing delegations bringing gifts. Thanks to a network of roads, including the Royal Road, governors of distant provinces, Judea among them, could stay in contact with the ruler. The palaces burned in 330 BC, after the invasion of Alexander the Great."], "j": "The artistic reconstruction shows a high stone terrace reached by broad stairways decorated with reliefs of processions. On the platform rises a forest of slender columns topped with the heads of bulls and lions, and before the Gate of All Nations stand mighty winged bulls. In the background are a plain and rocky slopes, and delegates in varied costumes make their way toward the stairs.", "d": "Persepolis lay about 500 km southeast of Susa; the palaces were burned in 330 BC.", "img": null}, {"id": "c6m11", "c": 6, "ct": "Prophets, Exile and Return", "n": "Nehemiah's Wall", "lat": 31.7745, "lon": 35.234, "ref": "Neh 1–7; 12:27–43", "sub": "The rebuilding of Jerusalem's walls in only a few dozen days.", "s": "Nehemiah returned from Susa to Jerusalem and organized the rebuilding of the walls, dividing the work into sections. Despite the hostility of their neighbors, the task was completed in 52 days.", "k": ["Nehemiah, cupbearer to King Artaxerxes, heard in Susa about the ruined walls of Jerusalem and asked the king for permission to go. Around 445 BC he reached the city, rode around the ruins by night, and called the inhabitants to rebuild. The book lists who built which section and which gate fell to which family. The enemies, Sanballat, Tobiah, and Geshem, mocked, threatened, and plotted, so the workers labored with a tool in one hand and a weapon in the other. According to Neh 6:15, the wall was completed in 52 days.", "Jerusalem in this era was smaller than in the days of Hezekiah. The walls enclosed mainly the ridge of the City of David and the Temple Mount, where a handful of families lived. Nehemiah had to patch breaches in the old lines of defense, using the stones lying everywhere. The book lists about ten gates: the Sheep Gate, the Fish Gate, the Old Gate, the Valley Gate, the Dung Gate, the Fountain Gate, the Water Gate, and the Horse Gate. Dividing the work by sections, with each group building by its own house, made it possible to finish quickly. The task was made harder by a constant fear of attack from the neighbors."], "j": "The artistic reconstruction shows a hillside where a crowd of people lay stone blocks in a new wall. Some carry baskets of rubble, others climb wooden scaffolding, and guards with spears stand on the little towers. Behind them are the ruins of old houses, and in the distance the outline of the Temple Mount. The figures are shown from afar, in the light of early morning.", "d": "The rebuilding of the walls took 52 days (Neh 6:15); the work was completed around 445 BC.", "img": "img/c6m11.webp"}, {"id": "c6m12", "c": 6, "ct": "Prophets, Exile and Return", "n": "The Water Gate and the Reading of the Law", "lat": 31.7725, "lon": 35.237, "ref": "Neh 8–10; Ezra 7–10", "sub": "The community gathers in the square to hear the Law and renew the covenant.", "s": "Ezra read the Law before all the people gathered in the square in front of the Water Gate. The community celebrated the Feast of Booths and reaffirmed the covenant with God.", "k": ["When the walls were finished, all the people gathered in the square in front of the Water Gate and asked Ezra to read the book of the Law. Ezra stood on a wooden platform, and the Levites translated and explained the text so that everyone would understand. The listeners wept, but Nehemiah and Ezra reminded them that this day was a feast. Next they celebrated the Feast of Booths, living in shelters made of branches. Then the community publicly renewed the covenant and pledged faithfulness, including support for the Temple.", "The Water Gate led toward the Gihon spring, Jerusalem's only permanent spring, in the lower part of the City of David. The area in front of it was an open square where thousands of people could gather, including men, women, and children old enough to understand. Ezra arrived in Jerusalem about four months after leaving Babylonia, most likely in 458 BC, though some scholars propose a different date. The reading lasted from dawn until midday and turned the rebuilt city into a community shaped by listening to the word."], "j": "The artistic reconstruction shows a wide square under the open sky, filled with a crowd in simple robes. On a wooden platform stands a figure with an unrolled scroll, and beside him Levites and priests. In the background rises the newly rebuilt wall with a gate, and the rooftops of the houses are covered with branches prepared for the Feast of Booths. Bright morning light illuminates the whole scene.", "d": "The reading of the Law lasted from dawn until midday (Neh 8:3); Ezra's journey to Jerusalem took about 4 months.", "img": null}, {"id": "c7m1", "c": 7, "ct": "The World of Jesus", "n": "Bethlehem", "lat": 31.7054, "lon": 35.2024, "ref": "Matt 2; Luke 2:1–20", "sub": "The City of David, where Jesus was born.", "s": "Because of a census, Joseph and Mary come to Bethlehem, where Jesus is born. Shepherds from the area are the first to hear the glad news, and later wise men from the East come to the child.", "k": ["The Gospels tell that Joseph, a descendant of the house of David, set out from Nazareth for Bethlehem to be registered in the census. There Mary gave birth to a Son and laid him in a manger, because there was no room for them in the inn. That night the shepherds guarding their flocks in the nearby fields heard the news and went to see the child. Later, according to Matthew, wise men from the East, guided by a star, arrived and presented their gifts. A deadly threat from King Herod forced the family to flee to Egypt.", "Bethlehem lies about 8 km south of Jerusalem, on a ridge of hills rising about 770 m above sea level. Around it stretch pastures descending toward the Judean Desert, ideal for flocks of sheep, which explains well the presence of shepherds. The journey from Galilee usually took several days and led through the Jordan Valley or through Samaria. Its closeness to the capital explains why news of the birth reached Herod. Ancient tradition points to the grotto beneath today's Church of the Nativity as the place of Jesus' birth, venerated since the early centuries of Christianity."], "j": "In the time of Jesus, Bethlehem was a small farming settlement of stone houses with flat roofs. Many of them leaned against natural caves, used as stables and pantries. Flocks grazed on the slopes, and in the evening the air quickly turned cool. It was a quiet corner rather than a bustling town (artistic reconstruction).", "d": "Distance from Bethlehem to Jerusalem: about 8 km; elevation about 770 m above sea level.", "img": "img/c7m1.webp"}, {"id": "c7m2", "c": 7, "ct": "The World of Jesus", "n": "Nazareth", "lat": 32.6996, "lon": 35.3035, "ref": "Luke 1:26–38; 2:39–52; Matt 2:23", "sub": "The small town of Jesus' childhood and youth.", "s": "In Nazareth Mary heard the announcement, and Jesus grew up in Joseph's family. Here he also began his public teaching in the synagogue.", "k": ["According to Luke, it was in Nazareth that the angel Gabriel announced to Mary that she would conceive a Son. After the return from Egypt, the family settled in this small town, and there Jesus grew up, increasing in wisdom, as Luke reports. Joseph worked as a carpenter, and Jesus was known to the townspeople as the carpenter's son. When he returned to Nazareth years later as a teacher, he spoke in the synagogue, reading a passage from the prophet Isaiah, but met with disbelief from his fellow townspeople (Luke 4:16–30).", "Nazareth lies in Lower Galilee, in a basin surrounded by hills, at an elevation of about 350 m above sea level. It was not an important town, and the Old Testament does not mention it at all, which explains the skeptical question of whether anything good can come out of Nazareth (John 1:46). Even so, the town lay close to busy routes. Just a few kilometers away was Sepphoris, at that time the region's capital under reconstruction, where craftsmen could find work. As a result, Jesus grew up in an environment open to the wider world."], "j": "In the first century, Nazareth was a small village of probably a few hundred inhabitants. Houses of rough-cut stone and clay stood among terraces of olive trees, vines, and grain. Narrow lanes led to the well and to a simple synagogue. Children helped with the animals and in the fields (artistic reconstruction).", "d": "Elevation: about 350 m above sea level; distance to the Sea of Galilee: about 30 km.", "img": null}, {"id": "c7m3", "c": 7, "ct": "The World of Jesus", "n": "The Jordan and Bethany Beyond the Jordan", "lat": 31.8372, "lon": 35.5517, "ref": "Mark 1:1–11; John 1:28; Matt 3:13–17", "sub": "The place of Jesus' baptism and the beginning of his public ministry.", "s": "At the Jordan, John the Baptist called for repentance, and Jesus received baptism from him. The Gospels describe the opened heavens and the voice of the Father.", "k": ["John the Baptist preached repentance at the Jordan, and people from all Judea and Jerusalem came to confess their sins and be baptized. Among them came Jesus of Nazareth. The Gospels agree in telling that after the baptism the heavens opened, the Spirit descended on him like a dove, and the Father's voice confirmed that he is the beloved Son. The Gospel of John names the place of the baptism as Bethany beyond the Jordan, that is, on the eastern side of the river. It was the beginning of Jesus' public mission.", "The Jordan flows through a deep rift valley, and the area near Jericho lies more than 250 m below sea level, in one of the lowest places on earth. In its lower course the river is narrow and winding, surrounded by dense vegetation, which favored gatherings in a remote place, away from the cities. The place was convenient also because an important road from Jericho to the eastern lands ran nearby. The present-day site of Al-Maghtas, traditionally regarded as Bethany beyond the Jordan, lies about 9 km from the Dead Sea."], "j": "The river was then the color of murky green, and the banks were overgrown with reeds, willows, and tamarisks. Among the vegetation sat people waiting for their turn, far from the noise of the city. The air was hot and humid, and in the background one could see the desert hills (artistic reconstruction).", "d": "Elevation: about 250–400 m below sea level; to the Dead Sea: about 9 km.", "img": "img/c7m3.webp"}, {"id": "c7m4", "c": 7, "ct": "The World of Jesus", "n": "The Judean Desert", "lat": 31.8737, "lon": 35.4283, "ref": "Matt 4:1–11; Mark 1:12–13; Luke 4:1–13", "sub": "Forty days of fasting and temptation in the wilderness.", "s": "After his baptism, the Spirit led Jesus into the desert, where for forty days he fasted and was tempted. Tradition points to Mount Quarantania above Jericho.", "k": ["Right after his baptism, Jesus was led by the Spirit into the desert. The Gospels speak of forty days of fasting and three temptations: bread, a miraculous sign, and power over the kingdoms of the world. Each time Jesus answers by appealing to Scripture. The forty days recall Israel's forty years of wandering in the wilderness, but where the people failed, Jesus remains faithful. For Christians this scene remains to this day the model for Lent.", "The Judean Desert occupies a narrow strip between the ridge of Judea and the Dead Sea. It extends about 100 km in length and about 25 km in width, and rainfall here is only symbolic. The terrain is cut by deep ravines, caves, and cliffs, which favored hermits. According to tradition, the place of the temptations was Mount Quarantania (Latin for forty) above Jericho, rising about 350 m above the city. This is a traditional location, since the Gospels do not name a specific peak."], "j": "The desert is a landscape in shades of beige and ocher: stony hills, ravines, and cliffs without a trace of green. By day it is hot, by night cold. The silence is almost total, broken only by the sound of the wind. From the high rocks one can see the Dead Sea glittering below (artistic reconstruction).", "d": "Length of the Judean Desert: about 100 km; Mount Quarantania: about 350 m above Jericho.", "img": null}, {"id": "c7m5", "c": 7, "ct": "The World of Jesus", "n": "Cana of Galilee", "lat": 32.7467, "lon": 35.3397, "ref": "John 2:1–12; John 4:46–54", "sub": "The wedding where Jesus performed his first sign.", "s": "At a wedding in Cana, Mary pointed out that the wine had run out, and Jesus turned water into wine. The evangelist calls this the beginning of his signs.", "k": ["The Gospel of John tells of a wedding in Cana to which Jesus, his mother, and his disciples were invited. When the wine ran out, Mary turned to her Son and told the servants to listen to his words. Jesus had six stone jars filled with water, and when the water was drawn out, it turned out to be wine of excellent quality. John calls this the beginning of signs, which revealed Jesus' glory and strengthened the disciples' faith. Jesus later returned to Cana to heal the son of a royal official.", "Cana is traditionally identified with Kafr Kanna, about 6 km northeast of Nazareth, on the road leading to the lake. Archaeologists have also proposed the site of Khirbet Qana, a few kilometers to the north, but this remains a matter of debate among specialists. The location explains why Jesus could easily travel from here to Capernaum: the road down to the lake covered about 25 km and descended more than 500 m. Wedding celebrations usually lasted several days, and wine was an important part of hospitality."], "j": "A Galilean village with small stone houses was surrounded by terraced vineyards and olive groves. In the wedding courtyard stood stone jars used for ritual washing. Guests sat on rugs, and children ran between the tables. In the evening, oil lamps lit the interior (artistic reconstruction).", "d": "Distance from Cana to Nazareth: about 6 km; to Capernaum: about 25 km.", "img": null}, {"id": "c7m6", "c": 7, "ct": "The World of Jesus", "n": "Capernaum", "lat": 32.8808, "lon": 35.575, "ref": "Mark 1:21–34; Mark 2:1–12; Matt 4:13", "sub": "Jesus' own town on the northern shore of the lake.", "s": "After leaving Nazareth, Jesus made Capernaum his base for teaching. Here he stayed in Peter's house, taught in the synagogue, and healed the sick.", "k": ["Matthew writes that Jesus left Nazareth and settled in Capernaum by the lake. In this town he called the tax collector Matthew, healed Peter's mother-in-law, and taught in the synagogue, and crowds came to his house in such numbers that the friends of a paralyzed man tore up the roof to lower the sick man inside (Mark 2:1–12). Many of the f
