ishermen who became disciples lived right here. That is why the town is sometimes called his own town (Matt 9:1).", "Capernaum lay on the northern shore of the Sea of Galilee, at a crossroads linking Galilee with Syria and the coast. The Via Maris passed through here, so there was a customs post and soldiers were stationed there, such as the centurion of Luke 7. The level of the lake is about 210 m below sea level. Excavations have uncovered black basalt houses and a later, white limestone synagogue. Beneath it older basalt walls were found, and beneath the octagonal church the remains of a house that tradition links with Peter."], "j": "The town was made up of low houses of dark basalt, set closely around shared courtyards. The roofs of branches and clay were flat, and nets were drying on the shore. Fishing boats stood at the landing, and the hills of the Golan towered over everything (artistic reconstruction).", "d": "Lake level: about 210 m below sea level; population in the first century: about 1,000–1,500.", "img": "img/c7m6.webp"}, {"id": "c7m7", "c": 7, "ct": "The World of Jesus", "n": "The Sea of Galilee: Magdala, Bethsaida and Tiberias", "lat": 32.82, "lon": 35.58, "ref": "Mark 4:35–41; Mark 6:45–52; John 6:1–21; Luke 8:2", "sub": "The lake where Jesus calmed the storm and fed the crowds.", "s": "Many scenes of the Gospels take place around the lake: the calling of the fishermen, the calming of the storm, and walking on water. Magdala, Bethsaida, and Tiberias lay on its shores.", "k": ["By the Sea of Galilee, Jesus called his first disciples, Simon, Andrew, James, and John, who were fishing. He taught the crowds from a boat, and during a crossing he calmed a violent storm, asking his disciples about their faith. The feeding of the crowd with bread and fish and the walking on water also took place at the lake. Magdala was the hometown of Mary Magdalene, Bethsaida the town of Peter, Andrew, and Philip, and Tiberias, founded by Herod Antipas, bore the name of the emperor, whom the Gospels mention only briefly.", "The lake is about 21 km long and about 13 km wide, and lies about 210 m below sea level, surrounded by hills. Cold air from Mount Hermon can rush down toward the water, causing sudden, violent storms, which explains the Gospel scene well. Magdala lay on the western shore, Tiberias a little to the south, and Bethsaida at the mouth of the Jordan on the northern coast. Fishing boats sailed at night, because then there were more fish, and several towns around the lake lived from the catch."], "j": "The boats had low sides and a single sail, and the fishermen hauled in their nets, washed them, and mended them at dawn. The water could be exceptionally calm and deep blue, but in moments it could be covered with waves. Beyond them rose the peaks of the Golan hills, and in the evening campfires flickered along the shores (artistic reconstruction).", "d": "Length of the lake: about 21 km; width: about 13 km; level: about 210 m below sea level.", "img": "img/c7m7.webp"}, {"id": "c7m8", "c": 7, "ct": "The World of Jesus", "n": "Samaria and Sychar", "lat": 32.2131, "lon": 35.2815, "ref": "John 4:1–42", "sub": "Jesus' conversation with the Samaritan woman at Jacob's well.", "s": "On the way from Judea to Galilee, Jesus stopped at a well in Sychar and spoke with a Samaritan woman. Many people from the town believed after that encounter.", "k": ["The Gospel of John relates that Jesus, weary from the journey, sat down at Jacob's well in the Samaritan town of Sychar at noon. He asked for water from a woman who had come to draw it. This was surprising, because Jews and Samaritans rarely met. The conversation concerned living water, true worship, and the expectation of the Messiah. The woman told the townspeople about him, and many of them believed and invited him to stay two days.", "Samaria lay between Judea and Galilee. The shortest road from Jerusalem to Nazareth was about 100 km and cut across this very region, though many Jews chose a longer route along the Jordan to avoid hostility. Sychar is usually identified with the area of present-day Askar, at the foot of Mount Gerizim, which for the Samaritans was the holy mountain of worship. Jacob's well, about 35 m deep, is a recognizable place to this day. This is a traditional location, strongly based on the testimony of ancient pilgrims."], "j": "At the foot of Mount Gerizim stretched a fertile valley with wheat fields. The well was open, surrounded by a stone curb from which water was drawn with a leather bucket. At noon it was hot, and the area was nearly empty. In the distance a settlement could be seen (artistic reconstruction).", "d": "Depth of Jacob's well: about 35 m; distance from Jerusalem to Nazareth through Samaria: about 100 km.", "img": null}, {"id": "c7m9", "c": 7, "ct": "The World of Jesus", "n": "Caesarea Philippi and the Mount of Transfiguration", "lat": 33.2487, "lon": 35.6942, "ref": "Matt 16:13–20; Matt 17:1–9; Mark 9:2–10", "sub": "Peter's confession at the sources of the Jordan and the revelation of glory on the mountain.", "s": "Near Caesarea Philippi, Peter confessed that Jesus is the Messiah. A few days later Jesus was transfigured before Peter, James, and John on a high mountain.", "k": ["In the region of Caesarea Philippi, Jesus asked his disciples who people say he is, and then who they themselves say he is. Peter answered that he is the Messiah, the Son of the living God, and Jesus entrusted him with a special mission in the Church (Matt 16:13–20). After a few days he took Peter, James, and John up a high mountain, where his face shone and Moses and Elijah appeared beside him. A voice from the cloud pointed to Jesus as the beloved Son.", "Caesarea Philippi lies at the foot of Mount Hermon, by the springs of Banias, one of the main sources of the Jordan, at about 350 m above sea level. It was a city built by the tetrarch Philip and dedicated to the emperor, with a grotto for the worship of the god Pan. The Gospels do not give the name of the Mount of Transfiguration. Christian tradition has pointed for centuries to Mount Tabor in Lower Galilee (about 588 m above sea level), but some scholars name Hermon (about 2,814 m above sea level). This location remains a matter of debate, which is why we speak of tradition."], "j": "At Banias the water flowed from beneath a rock wall in which niches for statues had been cut. The area was overgrown with trees and shrubs, and the air was cooler than by the lake. Tabor rises alone above the Jezreel plain like a dome, and from its summit one can see fields, hills, and distant mountains (artistic reconstruction).", "d": "Tabor: about 588 m above sea level; Hermon: about 2,814 m above sea level; Caesarea Philippi: about 350 m above sea level.", "img": null}, {"id": "c7m10", "c": 7, "ct": "The World of Jesus", "n": "Jericho", "lat": 31.8714, "lon": 35.444, "ref": "Mark 10:46–52; Luke 19:1–10", "sub": "The last stop before the ascent to Jerusalem.", "s": "In Jericho, Jesus healed the blind man Bartimaeus and stayed at the house of the tax collector Zacchaeus. From here began the climb up to Jerusalem.", "k": ["As Jesus drew near to Jerusalem, he met two people in Jericho. The blind beggar Bartimaeus cried out to him in faith and received his sight. Zacchaeus, the chief tax collector, short in stature, climbed a sycamore tree to see Jesus, who invited himself to his house. Zacchaeus promised to give half of his possessions to the poor and to repay fourfold what he had extorted. Jesus declared that salvation had come to his house, for he came to seek and to save the lost.", "Jericho lies about 250 m below sea level and is one of the oldest cities in the world, but in Jesus' day life was concentrated in Herod's new center, a few kilometers from the old tell. The warm climate allowed palms and balsam to be grown, and the city was wealthy and had a customs post. From here a stony road about 27 km long led to Jerusalem, climbing about 1,000 m. It was considered dangerous, and it is in this area that the parable of the good Samaritan is set."], "j": "Jericho was a green oasis in the desert. Around it rose palm groves, gardens, and palaces, fed by water from numerous springs. Caravans stopped here before the hard road uphill. Beyond the city began the bare, brown slopes of Judea (artistic reconstruction).", "d": "Distance from Jericho to Jerusalem: about 27 km; difference in elevation: about 1,000 m.", "img": null}, {"id": "c7m11", "c": 7, "ct": "The World of Jesus", "n": "Jerusalem: Herod's Temple and the Pool of Bethesda", "lat": 31.778, "lon": 35.2354, "ref": "Mark 11:15–17; John 2:13–22; John 5:1–15", "sub": "The heart of Israel: the Temple and the pool where Jesus healed a sick man.", "s": "Jesus often came to the Temple for the feasts and taught in its courts. Nearby, at the Pool of Bethesda, he healed a man who had been ill for thirty-eight years.", "k": ["Jesus came to Jerusalem for the pilgrim feasts, such as Passover. He taught in the courts of the Temple, and during one visit he drove the merchants out of it, saying that God's house is to be a house of prayer. Nearby, at the Pool of Bethesda, he met a man who had been lying there for thirty-eight years and had no one to put him into the water. Jesus told him to rise and walk, which coincided with the Sabbath and caused a dispute (John 5:1–15).", "The Temple was expanded by Herod the Great on an enormous raised platform of about 14 hectares, supported by massive walls. Its western wall survives to this day, venerated by the Jews. The platform towered over the Kidron Valley to the east, so the structure was visible from afar, including from the Mount of Olives. The Pool of Bethesda lay just north of the Temple, near the Sheep Gate, and excavations have uncovered two large pools with porticoes. This identification is widely accepted today."], "j": "The Temple gleamed with honey-colored stone and with gold on the front of the sanctuary building. The courts were filled with pilgrims, priests, and merchants. Broad stairways led to the gates, and colonnades gave shade. Nearby, the pool with its porticoes teemed with the sick seeking relief (artistic reconstruction).", "d": "Area of the Temple platform: about 14 hectares; height of the retaining walls: over 30 m.", "img": "img/c7m11.webp"}, {"id": "c7m12", "c": 7, "ct": "The World of Jesus", "n": "Gethsemane, Golgotha and the Road to Emmaus", "lat": 31.7784, "lon": 35.2296, "ref": "Mark 14:32–42; John 19:16–42; Luke 24:13–35", "sub": "The garden of prayer, the hill of the cross, and the empty tomb.", "s": "In the Garden of Olives, Jesus prayed before his arrest, and on Golgotha he was crucified and laid in a tomb. On the Sunday of the resurrection he appeared to his disciples on the road to Emmaus.", "k": ["After the Last Supper, Jesus went with his disciples to a garden called Gethsemane at the foot of the Mount of Olives, where he prayed in anguish, asking the Father that his will be done. There he was arrested, tried, and condemned. He carried the cross to the hill called Golgotha, where he was crucified. Joseph of Arimathea laid his body in a new tomb in a nearby garden. On the third day the tomb was found empty, and the Risen One appeared to his disciples, among them two travelers on the road to Emmaus.", "Gethsemane lies on the eastern side of the Kidron Valley, opposite the Temple, on the slope of the Mount of Olives, which rises about 800 m above sea level. In Jesus' day Golgotha was outside the city walls, in a former quarry, today within the Church of the Holy Sepulchre. Ancient tradition and excavations allow this place to be linked with the crucifixion and burial. The location of Emmaus is disputed; Abu Ghosh and Latrun are among those named, about 11 km from Jerusalem, according to Luke's description about 60 stadia."], "j": "Gethsemane is a grove of old olive trees, where at night a half-darkness reigns, lit only by torches. Golgotha was a rocky hill by the walls, from which one can see the road leading to the gate. The garden with a tomb cut into the rock lay right beside it, and Easter morning brought silence and light there (artistic reconstruction).", "d": "Distance from Gethsemane to Golgotha: about 1 km; Emmaus (according to Luke): about 60 stadia, or about 11 km from Jerusalem.", "img": "img/c7m12.webp"}, {"id": "c8m1", "c": 8, "ct": "The Early Church", "n": "The Mount of Olives – the Place of Farewell", "lat": 31.7787, "lon": 35.245, "ref": "Acts 1:1–14", "sub": "From here the disciples watch Jesus depart and return to the city.", "s": "After forty days of meetings with the Risen One, the disciples stand on the Mount of Olives, where they receive the promise of power from on high. Then they go down to Jerusalem and remain together in prayer.", "k": ["The Book of Acts begins with a brief reminder: for forty days Jesus appeared to his disciples and spoke to them about the kingdom of God. Then he told them that they would receive the Holy Spirit and become witnesses. When he had said this, he was lifted up, and a cloud hid him from their sight. Two men in white reminded them that they should not stand gazing into the sky. The apostles returned to the city, went up to the upper room, and together with the women, Mary, and Jesus' relatives devoted themselves to prayer.", "The Mount of Olives is a limestone ridge east of Jerusalem, rising about 80–100 m above the Temple Mount and separated from it by the deep Kidron Valley. Luke states that it is only as far from the city as one may walk on the Sabbath, about 1 km by the later Jewish measure. For the disciples this meant a short return along a path winding among olive groves. The view from the summit takes in the whole city with the Temple, which gives the scene a symbolic dimension: from here the message will set out toward the world."], "j": "Artistic reconstruction: a gentle, stony slope overgrown with old olive trees, cut by terraces and narrow paths. Below, beyond the Kidron Valley, rises the bright Temple complex with gleaming gilded elements, and behind it the compact buildings of Jerusalem. The air is dry, the light is that of morning, and the hills of Judea are outlined in the distance. Pilgrims and shepherds with small flocks are tiny figures that give the place its everyday rhythm.", "d": "Height of the summit of the Mount of Olives: about 810 m above sea level; to the Temple Mount in a straight line about 0.6 km.", "img": null}, {"id": "c8m2", "c": 8, "ct": "The Early Church", "n": "The Upper Room – the Coming of the Holy Spirit", "lat": 31.7717, "lon": 35.2296, "ref": "Acts 1:13–2:47", "sub": "In an upper room a community is born that sets out to people of all nations.", "s": "On the feast of Pentecost, the disciples gathered in one place experience the coming of the Holy Spirit. Peter's address convinces thousands of pilgrims, and the new community lives by the apostles' teaching, the breaking of bread, and the sharing of goods.", "k": ["Fifty days after Passover, Jerusalem again fills with pilgrims, for the Feast of Weeks has arrived. The disciples are together in one place when there comes a sound like a rushing mighty wind, and tongues as of fire appear over each of them. They begin to speak in different languages, and the foreigners gathered there understand the mighty works of God being proclaimed. Peter stands up with the Eleven and explains what is happening, appealing to Scripture. That day about three thousand people join them, and the community devotes itself to teaching, prayer, the breaking of bread, and mutual help.", "Christian tradition links these events with the Upper Room on Mount Zion, in the southwestern part of ancient Jerusalem. The place itself is identified traditionally, and the present building dates from the Middle Ages. The hill lies about 750 m above sea level, a little over a kilometer from the Temple, so pilgrims could quickly gather around the apostles. The listeners named by Luke, from Parthians and Medes to Romans, show how far the routes to Jerusalem stretched: from Mesopotamia about 1,000 km, from Rome over 2,000 km."], "j": "Artistic reconstruction: a simple stone house with a flat roof and an outside staircase leading to the upper room, shielded by wooden shutters. Inside are modest tables, low benches, and olive-oil lamps. In front of the house is a narrow, paved street where people in varied dress from distant lands are gathering. Morning light enters through the window openings, and above the rooftops of Zion the city walls are outlined.", "d": "Distance from the Temple to Mount Zion: about 1 km; elevation: about 765 m above sea level (traditional location).", "img": "img/c8m2.webp"}, {"id": "c8m3", "c": 8, "ct": "The Early Church", "n": "The Temple – the Beautiful Gate", "lat": 31.778, "lon": 35.2354, "ref": "Acts 3–4", "sub": "Peter and John heal a begging man at the gate of the Temple.", "s": "Peter and John go to the Temple to pray, and at the Beautiful Gate they heal a man who had been lame from birth. The crowd gathers to hear Peter, and the next day the apostles stand before the Sanhedrin.", "k": ["At the ninth hour, about three in the afternoon, Peter and John enter the Temple to pray. At the gate called Beautiful, a man lame from birth was set down every day to ask for alms. Peter looks at him and says he has no silver or gold, but gives what he has: in the name of Jesus he commands him to rise. The man stands up, walks into the Temple with them, and praises God. As the people gather, Peter explains that the healing is a sign of the power of Jesus, and calls them to repentance.", "The Temple stood on a platform built by Herod the Great, covering about 14 hectares and surrounded by colonnades. Solomon's Porch occupied the eastern side, where the people ran together after the healing. The location of the Beautiful Gate is debated; it is usually identified with one of the gates leading from the Court of the Gentiles to the Court of the Women. This closeness of a place of prayer and a place of begging shows how piety, commerce, and poverty met within a single complex. The Sanhedrin met nearby, so the apostles' arrest followed quickly."], "j": "Artistic reconstruction: monumental colonnades of pale stone surround an enormous plaza where pilgrims and priests pass. At the entrance to the inner court stands an imposing gate with metal fittings, and a hunched figure of a beggar sits against the wall. Two figures in simple robes approach from the colonnade, seen from a distance or from behind. In the background rises the main building of the Temple, and the sky is clear, emphasizing the vastness of the structure.", "d": "Herodian Temple platform: about 480 × 300 m; Solomon's Porch along the eastern wall was about 15 m high (estimate).", "img": "img/c8m3.webp"}, {"id": "c8m4", "c": 8, "ct": "The Early Church", "n": "Jerusalem – the Martyrdom of Stephen", "lat": 31.779, "lon": 35.24, "ref": "Acts 6–7; 12:1–19", "sub": "The first martyr and the persecution that scatters the community.", "s": "The community chooses seven men to serve the poor, among them Stephen, who is accused before the Sanhedrin and stoned. The persecution scatters the disciples throughout Judea and Samaria, and later Herod Agrippa I imprisons Peter.", "k": ["As the community grew, a dispute arose over the daily care of widows, so the apostles appointed seven men for this service. One of them was Stephen, full of faith and power. His teaching provoked opposition; he was accused before the Sanhedrin, and in a long speech he recalled the history of Israel. An enraged crowd led him out of the city and stoned him, while a young man named Saul guarded the clothes of those carrying out the deed. A great persecution then began, and the disciples scattered throughout Judea and Samaria. Later chapters also tell of Peter's imprisonment under Herod Agrippa I.", "Tradition places the stoning at the northern gate, today called the Lions' Gate, although the Damascus Gate was also pointed out in the past. Both locations lie about 1 km from the Temple, on the edge of the city, where executions were carried out according to the law. The scattering of the disciples shows the role of roads: from Jerusalem, routes ran north to Samaria and Damascus, west to Lydda and Joppa, and south to Gaza. It was thanks to these routes that the persecution, paradoxically, hastened the spread of the Gospel."], "j": "Artistic reconstruction: the northern edge of ancient Jerusalem, with a massive defensive wall and a gate flanked by towers. In front of the gate lie a stony road and an open space outside the walls where a crowd gathers. The city buildings visible behind the wall are densely packed, with flat roofs of pale stone. A gray dome of sky stretches over everything, and a few fig and olive trees grow along the walls.", "d": "The northern gates of Jerusalem lay about 1 km from the Temple; the city wall in this period had a circumference of about 4 km (estimate).", "img": null}, {"id": "c8m5", "c": 8, "ct": "The Early Church", "n": "Samaria – Philip's Mission", "lat": 32.2764, "lon": 35.19, "ref": "Acts 8:4–25", "sub": "The Gospel crosses an old divide and reaches the Samaritans.", "s": "Philip proclaims Christ in a city of Samaria, and his teaching and signs open the hearts of its people. Peter and John come from Jerusalem to pray that the new believers receive the gifts of the Spirit.", "k": ["The disciples, scattered by the persecution, proclaim the word wherever they have gone. Philip, one of the seven, goes down to a city in Samaria and preaches the Messiah there. The crowds listen with one accord, because they see healings and unclean spirits being cast out, and great joy fills the city. Many are baptized, including Simon, known as the Magician, who had previously astonished people with his arts. When the news reaches Jerusalem, Peter and John are sent, and they pray that the new brothers and sisters may receive the Holy Spirit. Simon tries to buy this power and is rebuked.", "Samaria lies in the central hill country of Ephraim, north of Jerusalem, about 55 km by road. The former capital of the Northern Kingdom was rebuilt by Herod as Sebaste, with a great stadium and a temple to the emperor. Samaritans were despised by many Jews, so crossing this boundary was a deeply significant step. Fertile valleys surround the hills, and the route from Jerusalem to Galilee ran right through this region. That is why the news spread quickly, along the trade routes."], "j": "Artistic reconstruction: a monumental Hellenistic-Roman city built on a hill, with broad colonnaded streets, a temple at the summit, and a defensive wall. At the foot of the hill are terraces of vineyards and fig trees, and donkeys laden with goods plod along the road. The light is warm, and further ridges of the Ephraim hills loom in the distance.", "d": "Distance from Jerusalem to Samaria: about 55 km; height of the city hill: about 430 m above sea level.", "img": null}, {"id": "c8m6", "c": 8, "ct": "The Early Church", "n": "The Road to Gaza – the Ethiopian Official", "lat": 31.6, "lon": 34.95, "ref": "Acts 8:26–40", "sub": "On a deserted road, Philip explains Isaiah's prophecy to a foreign official.", "s": "An angel sends Philip to the desert road from Jerusalem to Gaza, where he meets an official of the queen of Ethiopia reading the book of Isaiah. Philip explains the Scripture to him, baptizes him, and is carried off by the Spirit to Azotus.", "k": ["The command is surprising: Philip is to leave bustling Samaria and go south, along a desert road. There he meets a dignitary, the treasurer of the queen of Ethiopia, who was returning from a pilgrimage to Jerusalem and reading the prophet Isaiah aloud. Philip asks a simple question about whether he understands the text, and is invited up into the chariot. He tells him about Jesus as the suffering Servant, and when the travelers pass some water, the official asks to be baptized. Then Philip is taken away and finds himself at Azotus, from where he travels on, proclaiming the Gospel as far as Caesarea.", "The road from Jerusalem to Gaza was about 90 km long and led through the hills of Judea, then through the dry, rolling Shephelah, toward the coastal plain. The exact place of the meeting is unknown; tradition points to the area of Beth Zur or the Wadi el-Hesi valley. The description of the route as deserted fits the semi-arid character of the terrain. The encounter shows that the Good News reached far beyond Palestine: the Ethiopian kingdom lay hundreds of kilometers to the south, along the Nile."], "j": "Artistic reconstruction: a long, stony road winding between low, light-brown hills covered with sparse grass and thorny shrubs. On the road stands a light two-wheeled chariot drawn by a pair of horses, and beside it the figure of a traveler on foot. In the background appears a narrow stream with a touch of green. The sky is wide and faded, and the outline of the coastal plain can be seen in the distance.", "d": "Jerusalem–Gaza distance: about 90 km, or about 3–4 days on foot; a chariot could cover it faster.", "img": "img/c8m6.webp"}, {"id": "c8m7", "c": 8, "ct": "The Early Church", "n": "Damascus – the Conversion of Saul", "lat": 33.5116, "lon": 36.3112, "ref": "Acts 9:1–25", "sub": "The persecutor becomes an apostle and escapes over the wall in a basket.", "s": "Saul is on his way to Damascus to arrest the disciples, but on the road the Risen One meets him and he is struck blind. In a house on the street called Straight, Ananias restores his sight, and Saul is baptized and begins to proclaim Jesus.", "k": ["Saul of Tarsus, who had consented to the death of Stephen, obtained letters from the high priest to the synagogues in Damascus so that he could imprison the followers of Jesus. Near the city a light from heaven surrounded him, and he heard a voice asking why he was persecuting him. Blind, he was led into the city, where for three days he neither ate nor drank. Ananias, sent by the Lord, laid his hands on him, and Saul regained his sight and was baptized. He began to preach in the synagogues, until a plot forced the disciples to let him down at night in a basket through the wall.", "Damascus lies in a fertile oasis at the foot of the Anti-Lebanon mountains, on the Barada River, about 220 km northeast of Jerusalem. It was an ancient trading hub linking Syria with Mesopotamia and Arabia, so a considerable Jewish community had its own synagogues there. The journey on foot took about 6–8 days. The narrow Straight Street mentioned in the account refers to the main Roman colonnaded thoroughfare that ran from west to east through the city. The midday sun described in the text can be blinding here."], "j": "Artistic reconstruction: a walled city in a green oasis, with a Roman colonnaded street cutting through the buildings, flat-roofed houses, and narrow alleys. In the distance are mountain peaks that are snow-covered in winter, and a stony road along which a small caravan approaches. Over the city gate hangs a sharp afternoon glow, and the gardens along the Barada River contrast with the harsh desert beyond the oasis.", "d": "Jerusalem–Damascus distance: about 220 km in a straight line, about 6–8 days on foot; the city lies at an elevation of about 700 m above sea level.", "img": "img/c8m7.webp"}, {"id": "c8m8", "c": 8, "ct": "The Early Church", "n": "Lydda – the Healing of Aeneas", "lat": 31.9515, "lon": 34.895, "ref": "Acts 9:32–35", "sub": "On the plain of Sharon, Peter heals a man paralyzed for eight years.", "s": "Peter visits the community of believers in Lydda and meets a man there who had been paralyzed for eight years. After his healing, the people of Lydda and Sharon turn to the Lord.", "k": ["After a period of relative peace, the Church in Judea, Galilee, and Samaria grew, and Peter visited the communities. In Lydda he found Aeneas, who was paralyzed and had been bedridden for eight years. Peter declared that Jesus Christ heals him, and told him to get up and make his bed. Aeneas rose at once. The event made such an impression that the people of Lydda and all of Sharon turned to the Lord. This brief summary shows how a single event could stir an entire region.", "Lydda lay at the crossing of important roads, about 40 km northwest of Jerusalem and about 18 km from the port of Joppa. The main route from the coast to the capital ran through it, so news quickly reached many places. The plain of Sharon, stretching along the coast between Joppa and Caesarea, was fertile and densely populated, though marshy in places. This combination of a strategic road and agricultural abundance explains why the Christian community could grow quickly here."], "j": "Artistic reconstruction: a large village or small town on a flat plain, with houses of sun-dried brick and stone surrounded by orchards and grain fields. A narrow street leads to a marketplace where merchants spread out their goods. On the horizon are the gentle hills of Judea, and rows of palms and sycamores line the road. The clear day gives the scene a calm, rural character.", "d": "Distance Lydda–Jerusalem: about 40 km; Lydda–Joppa: about 18 km.", "img": null}, {"id": "c8m9", "c": 8, "ct": "The Early Church", "n": "Joppa – the House of Simon the Tanner", "lat": 32.054, "lon": 34.752, "ref": "Acts 9:36–43; 10:9–23", "sub": "In the seaside port Peter raises Tabitha and receives a vision on the rooftop.", "s": "In Joppa, Peter prays over the dead Tabitha, also called Dorcas, and restores her to life. He stays with Simon the tanner, and on his roof he has a vision that prepares him to meet the Gentiles.", "k": ["In Joppa lived a disciple named Tabitha, in Greek Dorcas, known for her good deeds and almsgiving. When she died, she was laid in an upper room, and the disciples summoned Peter from nearby Lydda. Peter, surrounded by weeping widows, sent them out of the room, knelt and prayed, and then turned to the dead woman and told her to rise. She opened her eyes and sat up, and the news spread through the town. Peter stayed there many days with Simon the tanner, and at midday he went up on the roof, where he heard a voice and saw a vessel with clean and unclean animals.", "Joppa was the only natural port of Judea on the Mediterranean, about 55 km west of Jerusalem in a straight line. The high rock on which the town stood made it easy to defend, yet the harbor itself was small and difficult, with reefs at the entrance. A tanner worked with dead animals, which made him ritually unclean in the eyes of many Jews, so Simon's house stood by the seashore, away from the center. The choice of such a lodging foreshadows the breaking of the boundaries between clean and unclean in the scenes that follow."], "j": "Artistic reconstruction: a rocky headland sloping down to the sea, with a compact town on top, its flat roofs and narrow, steep lanes. On the shore lie spread-out hides and the wooden vats of a tannery, and wooden fishing boats rock in the small harbor. On one of the roofs stands a figure in a simple tunic, gazing at the sky. The sun stands high, and the sea gleams a vivid blue.", "d": "Distance Joppa–Jerusalem: about 55 km in a straight line (about 2 days on foot); Joppa–Lydda: about 18 km.", "img": "img/c8m9.webp"}, {"id": "c8m10", "c": 8, "ct": "The Early Church", "n": "Caesarea Maritima – the House of Cornelius", "lat": 32.5, "lon": 34.8933, "ref": "Acts 10:1–11:18", "sub": "The first Gentile is welcomed into the Church without becoming a Jew.", "s": "The centurion Cornelius, a God-fearing Gentile, summons Peter to his house. Peter proclaims the Gospel to him, and the Holy Spirit comes down on those listening, so they are baptized.", "k": ["Cornelius was a centurion of the cohort called the Italian Cohort, a devout man who was generous to the poor. An angel told him to send for Peter in Joppa. The next day, while the messengers were still on the road, Peter had a vision on the rooftop and understood that he must not call unclean what God has made clean. He entered the home of a Gentile, listened to his testimony, and told him about Jesus. While he was still speaking, the Holy Spirit came down on all who were listening, and Peter ordered that they be baptized. After returning to Jerusalem, he still had to explain his conduct.", "Caesarea Maritima was the capital of the Roman province of Judea, built by Herod the Great on the Mediterranean, about 55 km north of Joppa and about 100 km from Jerusalem. The city had an artificial harbor, Sebastos, a theater, a hippodrome, and an aqueduct, and Romans, Greeks, and Jews lived here. Cornelius represented the Roman military administration. Peter's visit to this cosmopolitan city marks a turning point: the Church ceases to be solely a Jewish community and begins to open itself to the Gentile world."], "j": "Artistic reconstruction: an elegant port city in the Roman style, with white buildings, broad streets, a semicircular theater facing the sea, and a long aqueduct on the horizon. Large merchant ships are moored in the harbor, and a mighty mole reinforces the quay. In the background are stately houses with courtyards, surrounded by gardens. The light is bright, and the sea is slightly choppy.", "d": "Caesarea–Joppa: about 55 km; Caesarea–Jerusalem: about 100 km; the harbor of Sebastos covered about 100,000 m² (estimate).", "img": null}, {"id": "c8m11", "c": 8, "ct": "The Early Church", "n": "Antioch on the Orontes – the Name “Christians”", "lat": 36.202, "lon": 36.16, "ref": "Acts 11:19–30; 13:1–3", "sub": "The great city of Syria becomes the Church's second center and a base for mission.", "s": "The disciples scattered after Stephen's death proclaim the Gospel in Antioch, also to Greeks. Barnabas brings Saul from Tarsus, and there the disciples were first called Christians.", "k": ["Some of the scattered disciples from Cyprus and Cyrene reached Antioch and began to proclaim the Gospel to Greeks as well. Many believed, and the Church in Jerusalem sent Barnabas to Antioch. When he saw the grace of God, he rejoiced and encouraged everyone to remain faithful. Then he went to Tarsus, found Saul, and brought him to the city, where for a year they taught a large gathering. It was there that the disciples were first called Christians. Help for the famine-stricken in Judea also set out from Antioch, and later the first missionary journey.", "Antioch on the Orontes, today Antakya in Turkey, was the third-largest city of the Roman Empire after Rome and Alexandria. It lay about 500 km north of Jerusalem, near where the Orontes River flows into the sea. Its port, Seleucia Pieria, was about 25 km away. The city was famous for its long colonnaded street, theaters, and temples, and had a population of about 250,000 to 500,000 (historians' estimates). Its diverse population and its closeness to sea and land routes made it a natural center from which the new faith could spread."], "j": "Artistic reconstruction: an enormous city spread out at the foot of Mount Silpius, cut through by a long colonnaded street along which merchants, craftsmen, and sailors pass. Theaters, baths, and magnificent temples of white stone are visible. The Orontes River flows through the city, spanned by stone bridges. The evening light gives the walls a warm, honey-colored tint.", "d": "Distance Antioch–Jerusalem: about 500 km in a straight line; Antioch–Seleucia Pieria: about 25 km; Antioch–Tarsus: about 200 km.", "img": "img/c8m11.webp"}, {"id": "c8m12", "c": 8, "ct": "The Early Church", "n": "Jerusalem – the Council of the Apostles", "lat": 31.7769, "lon": 35.2292, "ref": "Acts 15:1–35", "sub": "The first council decides whether Gentiles must take on the Law of Moses.", "s": "When a dispute arose in Antioch over the circumcision of converted Gentiles, Paul and Barnabas go to Jerusalem. The apostles and elders decide not to lay the burden of the Law on the Gentiles, and send a letter to the communities.", "k": ["Men came to Antioch from Judea who taught that without circumcision no one could be saved. A lively dispute arose, so Paul and Barnabas, along with others, went to Jerusalem. There the apostles and elders discussed the matter at length. Peter reminded them that God gave the Spirit to the Gentiles just as he did to the Jews, and Paul and Barnabas told of the signs among the nations. James, taking the floor, appealed to the prophets and proposed a solution. A letter with a few recommendations was written and sent to Antioch with Judas and Silas.", "The council took place around AD 49, and the road from Antioch to Jerusalem was about 500 km long and took several weeks. Paul and Barnabas traveled through Phoenicia and Samaria, telling along the way of the conversions of Gentiles, which brought joy to the communities. Jerusalem was still the spiritual center, and the meeting shows that important decisions were made together, in dialogue, with reference to Scripture and experience. It is traditionally regarded as the model for later councils."], "j": "Artistic reconstruction: the spacious interior of a house, where the elders of the community sit on low benches in simple cloaks. A speaker stands in the middle, and a scroll lies beside him. Light falls through narrow windows, illuminating the stone walls and simple lampstands. Outside, the murmur of the street can be heard, while in the room there is concentration and attentive listening.", "d": "Antioch–Jerusalem: about 500 km in a straight line; the council is dated to about AD 49.", "img": null}, {"id": "c9m1", "c": 9, "ct": "The Apostolic Journeys", "n": "Syrian Antioch – the Community That Sends", "lat": 36.2, "lon": 36.16, "ref": "Acts 11:19–26; 13:1–3", "sub": "From the great city on the Orontes the first missionaries set out.", "s": "In Antioch the believers were first called Christians, and the community there became the base of the mission. While the Church was praying and fasting, it sent Barnabas and Saul on their way.", "k": ["Antioch on the Orontes was one of the largest cities of the empire, alongside Rome and Alexandria. When, after Stephen's death, refugees from Jerusalem reached Syria, they began to proclaim the Gospel to non-Jews as well. The community grew quickly, so Barnabas came from Jerusalem and then brought Saul from Tarsus. For a whole year they taught a large crowd here, and it was in Antioch that the disciples were first called Christians. While the community was praying and fasting, the Holy Spirit told them to set apart Barnabas and Saul for a new work, and after laying hands on them, they sent them on their way.", "The city's location explains its role. Antioch lay in the valley of the Orontes River, roughly 30 km from the sea, and its port, Seleucia Pieria, opened the way to Cyprus and Asia Minor. To the east, caravan routes led to Mesopotamia; to the south, a road along the coast to Palestine; to the north, passes through the Amanus mountains to Cilicia and Paul's native Tarsus. A large Jewish community and many Greeks lived here, so the community was diverse from the start. This mixture of cultures became the natural starting point for the mission to the Gentiles."], "j": "Artistic reconstruction shows a city stretched between the river and the slopes of Mount Silpius. A colonnade lined the main thoroughfare, where lanterns burned at night. The districts held temples, baths, and a theater, and in private homes groups of believers gathered. Over the port hung the smell of resin and olive oil, and on the pavement the voices of merchants from Syria, Greece, and Italy mingled.", "d": "Distance from Antioch to Seleucia Pieria: about 25–30 km; to Tarsus: about 200 km.", "img": null}, {"id": "c9m2", "c": 9, "ct": "The Apostolic Journeys", "n": "Cyprus – Salamis and Paphos", "lat": 34.756, "lon": 32.41, "ref": "Acts 13:4–12", "sub": "The first stop of the mission: Barnabas's island and a meeting with the proconsul.", "s": "Barnabas and Saul sailed from Seleucia to Cyprus and proclaimed the Gospel in the synagogues of Salamis. In Paphos they met the Roman proconsul Sergius Paulus, who believed.", "k": ["From Seleucia Pieria the missionaries, together with John Mark, sailed to Cyprus, the homeland of Barnabas. In Salamis, the island's eastern port, they proclaimed the word in the synagogues. Then they traveled across the whole island as far as Paphos, the capital of the Roman province. The proconsul Sergius Paulus, an intelligent man, wanted to hear the word of God, but the Jewish magician Bar-Jesus, called Elymas, opposed him. Saul, from then on called Paul, filled with the Holy Spirit, rebuked the magician, who lost his sight for a time. The proconsul, astonished at the teaching, believed. In this passage the name Paul appears for the first time.", "Cyprus lies about 100 km from the coast of Syria, so it was a natural first leap across the sea. The island was famous for copper, whose name comes from the island's own name, as well as for timber and wine. The route from Salamis to Paphos ran along the southern coast and was about 150 km long. Paphos was the administrative capital and a center of the cult of Aphrodite, which made it a telling place for the first collision of the Gospel with the pagan world and with a representative of Roman authority. From here Paul sailed north, toward the shores of Pamphylia."], "j": "Artistic reconstruction shows the harbor of Paphos in the bright light of a Mediterranean morning. Wooden merchant ships with square sails are moored at a stone quay, and dockworkers load amphorae. On the hill in the background are the white facades of Roman villas and a temple. In the foreground, far from the viewer, a small group of travelers in cloaks walks along the quay.", "d": "Cyprus lies about 100 km from the coast of Syria; the Salamis–Paphos route is about 150 km.", "img": "img/c9m2.webp"}, {"id": "c9m3", "c": 9, "ct": "The Apostolic Journeys", "n": "Pisidian Antioch – the Synagogue and Rejection", "lat": 38.3, "lon": 31.19, "ref": "Acts 13:13–52", "sub": "In the mountains of Pisidia, Paul gives his first great speech and turns to the Gentiles.", "s": "In the synagogue Paul recounted the history of Israel up to Jesus, and many listeners asked to hear more. When some of the Jews opposed them, the missionaries turned to the Gentiles.", "k": ["From Paphos the missionaries sailed to Pamphylia and reached Perga, where John Mark returned to Jerusalem. Paul and Barnabas went on, over the mountains, to Pisidian Antioch. On the Sabbath they entered the synagogue, and after the reading of the Law and the Prophets they were asked for a word of encouragement. Paul presented the history of Israel from the exodus from Egypt to David and declared that God had raised up a Savior, Jesus. The listeners asked for more, and the following Sabbath almost the whole city gathered. When jealous opponents objected, Paul announced that he was turning to the Gentiles, and the word spread throughout the whole region, until the missionaries were driven out.", "The road from Perga in Pamphylia to Antioch led through the Taurus mountains and was about 160 km long. The city lay at an elevation of about 1,200 m above sea level, so the climate was harsher than by the sea, and the journey was arduous and dangerous because of bandits and mountain passes. Antioch was a Roman colony founded by Augustus, situated on an important road leading west to Iconium, so news quickly traveled onward. That is why Paul's expulsion did not stop the evangelization: he went along the same road to the next cities."], "j": "Artistic reconstruction shows a high-mountain city in cool, clear light. In the marketplace stand Roman buildings of pale stone, and above them rises a hill with a sanctuary of the god Men. In the distance, on a path leaving the gate, two travelers in traveling cloaks can be seen. Behind them, snow still lies on the peaks of the Taurus.", "d": "Elevation of the city: about 1,200 m above sea level; the road from Perga: about 160 km through the Taurus.", "img": "img/c9m3.webp"}, {"id": "c9m4", "c": 9, "ct": "The Apostolic Journeys", "n": "Lystra – Healing and Stoning", "lat": 37.57, "lon": 32.45, "ref": "Acts 14:6–20", "sub": "A healed lame man, a crowd shouting “gods,” and stones.", "s": "In Lystra Paul healed a man lame from birth, and the crowd took the missionaries for gods. Soon opponents persuaded the people, and Paul was stoned.", "k": ["After being driven out of Iconium, Paul and Barnabas reached Lycaonia, the city of Lystra. There Paul saw a man lame from birth who was listening to his teaching, and told him to stand up. When the man stood and began to walk, the crowd shouted in the Lycaonian language that the gods had come down to men, and called Barnabas Zeus and Paul Hermes. The priest had already brought wreaths and oxen, but the apostles tore their clothes and stopped the sacrifice. Soon Jews arrived from Antioch and Iconium, persuaded the crowd, stoned Paul, and dragged him out of the city. The disciples gathered around him, and he got up and went back into the city.", "Lystra lay on the plateau of central Anatolia, southwest of Iconium, at a distance of about 35–40 km. It was an unimportant Roman colony where people still spoke the local Lycaonian language, which explains the crowd's reaction without understanding the apostles' Greek speech. The traditional location points to a hill near present-day Hatunsaray. Timothy, who joined Paul on his second journey, came from Lystra. The next day Paul set out for Derbe, which shows how close together the cities along the Roman road lay."], "j": "Artistic reconstruction shows a modest town on a steppe plateau, with a few stone buildings around a small marketplace. Above it rises a hill with the ruins of an older settlement, and beyond stretch wheat fields and sheep pastures. From the marketplace, near the temple of Zeus, sacrificial smoke rises, and in the distance the silhouette of the Taurus mountain range can be seen.", "d": "Distance Iconium–Lystra: about 35–40 km; traditional location near present-day Hatunsaray.", "img": null}, {"id": "c9m5", "c": 9, "ct": "The Apostolic Journeys", "n": "Jerusalem – the Apostolic Council", "lat": 31.78, "lon": 35.23, "ref": "Acts 15:1–35", "sub": "The Church's first assembly decides whether Gentiles must accept the Law of Moses.", "s": "The community in Jerusalem, with Peter, James, Paul, and Barnabas present, determined that Gentiles do not have to accept circumcision. A letter with the decision was carried to Antioch.", "k": ["After the return from the first journey, a dispute arose in Antioch: some visitors from Judea claimed that without circumcision there is no salvation. So Paul and Barnabas went to Jerusalem, where the apostles and elders gathered to examine the matter. Peter reminded them that God gave the Spirit to the Gentiles as well, Paul and Barnabas told of the signs, and James proposed a resolution in accord with Scripture. It was decided not to lay the burden of the Law on the Gentiles, asking only a few practices that would make fellowship easier. A letter and trusted messengers, Judas and Silas, were sent, and the community in Antioch received it with joy.", "The road from Antioch to Jerusalem was about 500 km long and led through Phoenicia and Samaria, so the travelers could tell along the way about the conversion of the Gentiles. The city of David lay at an elevation of about 750 m above sea level and drew pilgrims from all over the world. The council is traditionally dated to about AD 49. The discussion shows that decisions were made together, in a place rooted in salvation history, yet attentive to the experience of the mission in distant lands. This meeting opened the way for Paul's further journeys."], "j": "Artistic reconstruction shows Jerusalem in the mid-first century: limestone houses on the hills, the vast Temple complex with gleaming metal plating, and the narrow lanes of the Upper City. The assembly takes place in the modest hall of a house, where men in simple cloaks sit on benches, and the light of morning comes through an open window.", "d": "Road from Antioch to Jerusalem: about 500 km; the council is dated to about AD 49.", "img": null}, {"id": "c9m6", "c": 9, "ct": "The Apostolic Journeys", "n": "Philippi – Lydia, the Prison, and the Earthquake", "lat": 41.013, "lon": 24.286, "ref": "Acts 16:8–40", "sub": "The first community in Europe is born by a river and in a prison cell.", "s": "After the vision at Troas, Paul crossed over to Macedonia and in Philippi met Lydia by the river. After the imprisonment and the earthquake, the jailer was converted along with his whole household.", "k": ["At Troas, Paul saw in a dream a Macedonian man begging for help, so the group, which included Luke, sailed through Samothrace to Neapolis, and from there went to Philippi. On the Sabbath they went outside the city to a river, where women were praying. Lydia, a seller of purple from Thyatira, opened her heart to the word and was baptized together with her household. Later Paul drove a spirit out of a slave girl, her owners accused the missionaries before the magistrates, and they were flogged and thrown into prison. At midnight an earthquake opened the doors, and the jailer, instead of killing himself, asked the way of salvation and was baptized.", "Philippi lay on the Via Egnatia, the main Roman road linking the Adriatic with the Bosporus, about 15 km from the seaport of Neapolis. The city was a Roman colony settled with veterans of the civil wars, so its inhabitants proudly stressed their citizenship. The area was famous for its gold mines and fertile plain. Crossing the Aegean Sea from Troas took only two days, which eased the mission's passage from Asia to Europe. It was here that the Church arose to which Paul later wrote a letter from prison."], "j": "Artistic reconstruction shows a Roman colony at the foot of a hill, with the broad Via Egnatia passing through the middle of the city. On one side is a forum with a colonnade, on the other an acropolis with a theater set into the slope. Outside the walls, by a stream in the greenery, a few women sit in a group, and in the distance two figures of travelers approach them.", "d": "Distance Philippi–Neapolis: about 15 km; Neapolis–Troas via Samothrace: about 2 days' sailing.", "img": "img/c9m6.webp"}, {"id": "c9m7", "c": 9, "ct": "The Apostolic Journeys", "n": "Athens – the Areopagus", "lat": 37.972, "lon": 23.725, "ref": "Acts 17:16–34", "sub": "In the intellectual center of the world, Paul speaks of the unknown God.", "s": "On the Areopagus, Paul referred to the altar “to an unknown God” and to their own poets. Some of the listeners mocked, but a few believed, including Dionysius the Areopagite and Damaris.", "k": ["After Thessalonica and Berea, from where Paul had to flee because of unrest, he reached Athens alone. Observing a city full of statues, he spoke in the synagogue and in the agora with Jews, God-fearers, and philosophers. The Epicureans and Stoics brought him to the Areopagus, where he presented God the Creator, who does not live in temples made by human hands. He made use of the altar “to an unknown God” and quotations from Greek poets, but the word about the resurrection drew mockery. Few believed, but among them were Dionysius of the Areopagus and a woman named Damaris.", "Athens lies about 80 km east of Corinth, between the Saronic Gulf and the mountains of Hymettus and Pentelicus. The hill of the Areopagus rises to a height of about 115 m, right beside the Acropolis, which is about 156 m, so the speaker could see the symbols of the city's religion: the Parthenon and the temples. Although the famous classical period had passed, Athens was still renowned as a center of learning, and its agora served as a public forum. This place required a new language of proclamation from the apostle: he did not begin with Moses, but with the questions that preoccupied the Greeks."], "j": "Artistic reconstruction shows the rocky summit of the Areopagus, steps cut into the rock, and a group of men in cloaks with their backs to the viewer, listening intently to a speaker. Behind them rises the Acropolis with the Parthenon in bright light, below the agora with its porticoes bustles, and a few birds circle over the rooftops of the city.", "d": "Height of the Areopagus: about 115 m above sea level; distance Athens–Corinth: about 80 km.", "img": "img/c9m7.webp"}, {"id": "c9m8", "c": 9, "ct": "The Apostolic Journeys", "n": "Corinth – the City of Two Ports", "lat": 37.906, "lon": 22.879, "ref": "Acts 18:1–18", "sub": "A year and a half in Corinth, where Paul works and founds a great community.", "s": "In Corinth Paul stayed with Aquila and Priscilla and worked as a tentmaker. He lived here for about a year and a half, and watched over the community despite the opposition of some of the Jews.", "k": ["After Athens, Paul came to Corinth, where he met the Jews Aquila and Priscilla, who had been expelled from Rome, and lived with them because they shared the same trade. Every Sabbath he reasoned in the synagogue, and when opposition grew after the arrival of Silas and Timothy, he turned to the Gentiles and moved to the house of Titius Justus. Even the ruler of the synagogue, Crispus, was converted. After a vision that strengthened him, Paul stayed here about a year and a half. Accused before the proconsul Gallio, he was set free, because the Roman saw no crime in the case.", "Corinth lay on an isthmus about 6 km wide that joined the Peloponnese to the mainland, and it had two ports: Lechaeum on the Gulf of Corinth and Cenchreae on the Saronic Gulf. Small ships were dragged across the isthmus along a special road, and all goods passed through the city. This made it rich, cosmopolitan, and known for its licentiousness. The hill of Acrocorinth rose to about 575 m. From Corinth Paul wrote several letters, and from here he sailed to Ephesus, taking Aquila and Priscilla with him."], "j": "Artistic reconstruction shows a wealthy trading port with a bustling marketplace. Above the city looms the mighty rock of Acrocorinth with the ruins of a temple at its summit. In workshops, craftsmen sew tents of goat hair, and on the pavement stand stalls with copper vessels, fruit, and fabrics from all over the Mediterranean.", "d": "Width of the Isthmus of Corinth: about 6 km; Paul's stay: about 18 months.", "img": null}, {"id": "c9m9", "c": 9, "ct": "The Apostolic Journeys", "n": "Ephesus – the Artemision and the Theater", "lat": 37.939, "lon": 27.341, "ref": "Acts 19:1–40", "sub": "Paul's longest stay: teaching in the school of Tyrannus and the riot of the silversmiths.", "s": "In Ephesus Paul taught for about two to three years, and the word of God spread throughout all of Asia. The riot stirred up by the silversmith Demetrius was ended by the town clerk.", "k": ["Paul came to Ephesus on his third journey, first meeting disciples of John the Baptist, who were baptized in the name of Jesus, and the Spirit came upon them. For three months he spoke in the synagogue, and when he met opposition, he moved to the school of Tyrannus, where he taught daily for two years. Healings took place here, and converts burned magic books worth a fortune. When the silversmith Demetrius, who made small shrines of Artemis, saw his profits fall, he stirred up a riot. The crowd rushed to the theater and shouted for about two hours, until the town clerk calmed the people.", "Ephesus lay at the mouth of the Cayster River, by the sea, and was the capital of the Roman province of Asia. Its Artemision was counted among the seven wonders of the ancient world. The theater on the slope of Mount Pion held about 25,000 spectators, and a straight harbor street, the Arcadiane, led to the port. Because it lay at the junction of land and sea routes, the city was an excellent center for the spread of teaching. For this reason, people in neighboring cities such as Colossae and Laodicea heard the Gospel, even though Paul himself never reached them."], "j": "Artistic reconstruction shows a marble harbor street with a colonnade, leading toward an enormous theater set into the slope of a hill. Merchants, pilgrims, and craftsmen crowd along the street. In the distance, on the plain, the white mass of the Artemision gleams with its forest of columns, and behind it stretches a line of mountains.", "d": "Theater capacity: about 25,000 spectators; Paul's stay: about 2–3 years.", "img": "img/c9m9.webp"}, {"id": "c9m10", "c": 9, "ct": "The Apostolic Journeys", "n": "Caesarea Maritima – the Prisoner Before the Governors", "lat": 32.5, "lon": 34.89, "ref": "Acts 23:23–26:32", "sub": "Two years in Herod's palace: Felix, Festus, and King Agrippa.", "s": "Paul, arrested in Jerusalem, was taken to Caesarea, where he waited two years for trial. He appealed to the emperor, which opened the way for him to Rome.", "k": ["After his arrest in Jerusalem and a plot to kill him, the Roman tribune sent Paul under heavy escort to Caesarea, the seat of the governor Felix. There Paul defended himself against his accusers from Jerusalem, while Felix put off the verdict, hoping for a bribe. After two years his successor Festus, wanting to win the favor of the Jews, proposed a trial in Jerusalem. As a Roman citizen, Paul appealed to the emperor. Later, before King Agrippa II and his sister Bernice, he told of his conversion, and Agrippa concluded that the man could have been set free if he had not appealed.", "Caesarea Maritima, built by Herod the Great around 22–10 BC, was the capital of the Roman province of Judea and had one of the largest artificial harbors of antiquity, Sebastos. It lay about 100 km from Jerusalem, so a prisoner could be transported in a single night under the escort of several hundred soldiers. From the harbor it was easy to sail to Phoenicia, Asia Minor, and Italy. So the appeal to the emperor meant that Paul would set out by ship from the same coast that the Gospel had left for the wider world."], "j": "Artistic reconstruction shows the governor's palace built on a promontory over the Mediterranean, with colonnades and a pool open to the waves. Farther on can be seen a semicircular hippodrome, a theater, and the great harbor of Sebastos with its lighthouse. Soldiers in red cloaks guard the steps leading to the audience hall.", "d": "Distance Caesarea–Jerusalem: about 100 km; Paul's imprisonment: about 2 years.", "img": null}, {"id": "c9m11", "c": 9, "ct": "The Apostolic Journeys", "n": "Malta – the Shipwreck", "lat": 35.95, "lon": 14.4, "ref": "Acts 27:1–28:10", "sub": "After a storm lasting about two weeks, the ship is wrecked off the shore of the island.", "s": "After fourteen days of storm, the ship carrying Paul the prisoner ran aground off Malta. Everyone survived, and the islanders showed them kindness.", "k": ["Paul set out for Rome under the escort of the centurion Julius, on ships from Caesarea, and after changing ships at Myra, onto an Alexandrian vessel carrying grain. Off Crete, at Fair Havens, Paul warned against sailing further, but the sailors set out, looking for a better harbor. The wind called Euroclydon struck, and for about two weeks it tossed the ship about on the open sea. Paul, supported by a vision of an angel, assured everyone that they would be saved. The ship ran aground, and 276 people reached the shore by swimming or on planks. On Malta, while warming himself by a fire, Paul shook a viper off his hand, and later healed the father of Publius.", "Malta lies about 90 km from Sicily and is about 27 km long, so finding it in a storm was a matter of luck. Tradition places the wreck at St. Paul's Bay on the north of the island. The inhabitants, called barbarians in the text because they did not speak Greek, received the shipwrecked people warmly. In winter sailing usually stopped, so the party spent three months here, then set out on an Alexandrian ship with the sign of the Dioscuri. Thanks to this, the journey to Rome could be completed in the spring."], "j": "Artistic reconstruction shows the rocky shore of northern Malta at dawn after a storm. Amid the waves lies a wooden ship with a broken mast, and on the beach the shipwrecked gather around a fire. People in simple robes approach from a distance, carrying blankets and wood. The sky is heavy with clouds, and the sea is still foaming.", "d": "Malta lies about 90 km from Sicily; length of the island: about 27 km; shipwrecked: 276 people.", "img": "img/c9m11.webp"}, {"id": "c9m12", "c": 9, "ct": "The Apostolic Journeys", "n": "Rome – the House on the Via Appia and the End of the Road", "lat": 41.89, "lon": 12.48, "ref": "Acts 28:11–31", "sub": "The journey through Syracuse and Puteoli ends in the capital of the empire.", "s": "From Malta the ship reached Puteoli via Syracuse and Rhegium, and from there Paul went along the Via Appia to Rome. For two years he lived in his own rented house, preaching without hindrance.", "k": ["After three months on Malta, the travelers sailed on an Alexandrian ship, stopped for three days at Syracuse, sailed on to Rhegium, and after one day of a south wind reached Puteoli. There they met brothers and were invited to stay a week. From Puteoli the road led toward Rome, and believers came out to meet Paul as far as the Forum of Appius and the Three Taverns. Paul thanked God and took courage. In Rome he was allowed to live in a rented house, under the guard of a soldier. For two years he received everyone and proclaimed the Kingdom of God without hindrance.", "Puteoli was the main port for grain from Alexandria, and from there the Via Appia led to Rome, a route of about 230 km that travelers covered in a few days. Believers before him, such as Aquila and Priscilla, had built a community in the capital, to which Paul addressed his Letter to the Romans. The city had about a million inhabitants and stood at the center of the world, so Paul's very presence here symbolizes the Gospel reaching “the ends of the earth” of which Jesus spoke. The Book of Acts ends with an open scene: the teaching goes on."], "j": "Artistic reconstruction shows the paving of the Via Appia shaded by pines, along which a group of travelers makes its way among tombs and villas. In the distance, above the horizon, gleam the roofs of the temples and aqueducts of Rome. In one of the city's back lanes stands a modest rented house, reached by narrow stairs, and a few visitors wait in front of it.", "d": "Road Puteoli–Rome via the Via Appia: about 230 km; Paul's stay under house arrest: about 2 years.", "img": null}],BB=[10, 22, 52, 45.5];const COL=['#c1573f','#4778a8','#5c9668','#a1548f','#c9a038','#3f9797','#d27a3a','#7a63b8','#b04a6c'];
const vp=document.getElementById('vp'),st=document.getElementById('stage'),base=document.getElementById('base'),panel=document.getElementById('panel'),pin=document.getElementById('pin');
let W=0,H=0,sc=1,tx=0,ty=0,sel=0,cur=null;const pins=[];
function px(l){return [(l.lon-BB[0])/(BB[2]-BB[0])*W,(BB[3]-l.lat)/(BB[3]-BB[1])*H]}
function apply(){st.style.transform=`translate(${tx}px,${ty}px) scale(${sc})`;document.documentElement.style.setProperty('--s',1/Math.max(sc,0.6));}
function fit(){const vw=innerWidth,vh=innerHeight;const span=vw<760?8:17;sc=vw/(W*span/(BB[2]-BB[0]));const cx=(35.6-BB[0])/(BB[2]-BB[0])*W,cy=(BB[3]-32.4)/(BB[3]-BB[1])*H;tx=vw/2-cx*sc;ty=(vh+90)/2-cy*sc;apply();}
function build(){DATA.forEach((p,i)=>{const [x,y]=px(p);const b=document.createElement('button');b.className='pin';b.style.left=x+'px';b.style.top=y+'px';b.style.setProperty('--c',COL[p.c-1]);b.title=p.n;b.onclick=e=>{e.stopPropagation();open(i)};st.appendChild(b);const t=document.createElement('div');t.className='lbl';t.style.left=x+'px';t.style.top=y+'px';t.textContent=p.n.split('(')[0].split('/')[0].trim();st.appendChild(t);pins.push([b,t,p]);});}
function filt(){pins.forEach(([b,t,p])=>{const on=!sel||p.c===sel;b.style.display=on?'':'none';t.style.display=on&&(sc>1.15||sel)?'':'none'});}
function chips(){const c=document.getElementById('chips');const names=['All'].concat([1,2,3,4,5,6,7,8,9].map(n=>{const x=DATA.find(d=>d.c===n);return n+'. '+(x?x.ct:'')}));names.forEach((nm,i)=>{const e=document.createElement('div');e.className='chip'+(i===0?' on':'');e.textContent=nm;e.onclick=()=>{sel=i;[...c.children].forEach((k,j)=>k.classList.toggle('on',j===i));filt();};c.appendChild(e)});}
function open(i){cur=i;const p=DATA[i];pins.forEach(([b],j)=>b.classList.toggle('act',j===i));
 pin.innerHTML=(p.img?`<img src="${p.img}" alt="${p.n}">`:'')+`<div class="k">Part ${p.c} · ${p.ct} · ${p.ref}</div><h2>${p.n}</h2><div class="sub">${p.sub}</div><p>${p.s}</p>`+p.k.map(x=>`<p>${x}</p>`).join('')+`<div class="box"><b>What it looked like · artistic reconstruction</b><p>${p.j}</p></div><div class="box"><b>Facts</b><p>${p.d}</p></div>`;
 panel.classList.add('open');panel.scrollTop=0;document.getElementById('hint').style.display='none';
 // center
 const [x,y]=px(p);if(innerWidth>760){tx=(innerWidth-420)/2-x*sc;ty=(innerHeight+90)/2-y*sc;}else{tx=innerWidth/2-x*sc;ty=(innerHeight*0.30)-y*sc;}st.style.transition='transform .35s';apply();setTimeout(()=>st.style.transition='',380);}
document.getElementById('cl').onclick=()=>{panel.classList.remove('open');pins.forEach(([b])=>b.classList.remove('act'))};
function zoom(f,cx,cy){const n=Math.min(Math.max(sc*f,fitMin),8);const r=n/sc;tx=cx-(cx-tx)*r;ty=cy-(cy-ty)*r;sc=n;apply();filt();}
let fitMin=0.2;
vp.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?1.18:1/1.18,e.clientX,e.clientY)},{passive:false});
document.getElementById('zi').onclick=()=>zoom(1.4,innerWidth/2,innerHeight/2);document.getElementById('zo').onclick=()=>zoom(1/1.4,innerWidth/2,innerHeight/2);
const ptr=new Map();let last=null,dist=0;
vp.addEventListener('pointerdown',e=>{vp.setPointerCapture(e.pointerId);ptr.set(e.pointerId,[e.clientX,e.clientY]);last=[e.clientX,e.clientY];if(ptr.size===2){const a=[...ptr.values()];dist=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);}});
vp.addEventListener('pointermove',e=>{if(!ptr.has(e.pointerId))return;ptr.set(e.pointerId,[e.clientX,e.clientY]);if(ptr.size===2){const a=[...ptr.values()];const d=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);zoom(d/dist,(a[0][0]+a[1][0])/2,(a[0][1]+a[1][1])/2);dist=d;}else{tx+=e.clientX-last[0];ty+=e.clientY-last[1];last=[e.clientX,e.clientY];apply();}});
['pointerup','pointercancel'].forEach(ev=>vp.addEventListener(ev,e=>{ptr.delete(e.pointerId);last=null}));
function init(){W=base.naturalWidth;H=base.naturalHeight;base.style.width=W+'px';base.style.height=H+'px';st.style.width=W+'px';st.style.height=H+'px';build();chips();fit();fitMin=sc*0.7;filt();}
if(base.complete)init();else base.onload=init;addEventListener('resize',()=>{fit();filt()});
</script></body></html>
